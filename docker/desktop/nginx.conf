server {
    listen 80;
    server_name _;

    # 文件上传大小上限：需大于后端 MAX_UPLOAD_SIZE(5MB)，否则大图在到达
    # 后端校验前就被 nginx 拒绝并返回 413 Payload Too Large。
    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    # 桌面端使用 hash 路由（createWebHashHistory），无需 history fallback；
    # 此处保留 try_files 以兼容潜在的直接资源访问。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端服务（同一 compose 网络内通过服务名访问）
    # 注意：proxy_pass 末尾不带 URI，会保留原始请求路径，
    # 因此 /api/v1/xxx -> http://his-backend:9000/api/v1/xxx
    location /api {
        proxy_pass http://his-backend:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 上传文件目录代理
    location /uploads {
        proxy_pass http://his-backend:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 支持（实时消息等）
    location /ws {
        proxy_pass http://his-backend:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

<script>
window.pageInit = function() {
    showUsersTab();
};

// 显示用户管理标签页（挂载到全局作用域）
window.showUsersTab = async function() {
    // 激活标签
    document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
    event?.target?.classList.add('active');
    
    const container = document.getElementById('system-content');
    container.innerHTML = `
        <div id="users-tab">
            <div class="action-buttons mb-3">
                <button type="button" class="btn btn-primary" onclick="showAddUserModal()">
                    <i class="bi bi-person-plus"></i> 新增用户
                </button>
            </div>
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">用户列表</h5>
                </div>
                <div class="card-body">
                    <div id="users-table-container"></div>
                </div>
            </div>
        </div>
    `;
    
    window.loadUsers();
}

// 加载用户列表（挂载到全局作用域）
window.loadUsers = async function() {
    const container = document.getElementById('users-table-container');
    if (!container) return;
    
    const loadingId = LoadingComponents.show('加载中...', container);
    
    try {
        // 调用实际API
        const response = await UserAPI.getList({
            page: 1,
            page_size: 100,
            keyword: ''
        });
        
        // 处理后端响应格式
        const users = response.items || response || [];
        
        // 模拟数据（如果API返回的数据格式不同，需要适配）
        const mockData = users.length > 0 ? users : [
            {
                id: '1',
                username: 'admin',
                name: '管理员',
                role: '系统管理员',
                department: '全部',
                status: 'active',
                created_at: '2024-01-01'
            },
            {
                id: '2',
                username: 'doctor01',
                name: '李医生',
                role: '医生',
                department: '内科',
                status: 'active',
                created_at: '2024-01-15'
            }
        ];
        
        container.innerHTML = TableComponents.renderTable({
            id: 'users-table',
            columns: [
                {
                    title: '用户名',
                    key: 'username',
                    align: 'center'
                },
                {
                    title: '姓名',
                    key: 'name',
                    align: 'center'
                },
                {
                    title: '角色',
                    key: 'role',
                    align: 'center'
                },
                {
                    title: '科室',
                    key: 'department',
                    align: 'center'
                },
                {
                    title: '状态',
                    key: 'status',
                    align: 'center',
                    render: (row) => {
                        const statusClass = row.status === 'active' ? 'success' : 'danger';
                        const statusText = row.status === 'active' ? '启用' : '禁用';
                        return `<span class="badge bg-${statusClass}">${statusText}</span>`;
                    }
                },
                {
                    title: '创建时间',
                    key: 'created_at',
                    align: 'center',
                    render: (row) => {
                        if (!row.created_at) return '-';
                        // 格式化日期为 年-月-日
                        const date = new Date(row.created_at);
                        if (isNaN(date.getTime())) {
                            // 如果已经是 YYYY-MM-DD 格式，直接返回日期部分
                            if (typeof row.created_at === 'string' && /^\d{4}-\d{2}-\d{2}/.test(row.created_at)) {
                                return row.created_at.split('T')[0].split(' ')[0];
                            }
                            return row.created_at;
                        }
                        const year = date.getFullYear();
                        const month = String(date.getMonth() + 1).padStart(2, '0');
                        const day = String(date.getDate()).padStart(2, '0');
                        return `${year}-${month}-${day}`;
                    }
                },
                {
                    title: '操作',
                    key: 'actions',
                    align: 'center',
                    render: (row) => `
                        <button class="btn btn-sm btn-outline-success" onclick="editUser('${row.id}')">
                            <i class="bi bi-pencil"></i> 编辑
                        </button>
                        <button class="btn btn-sm btn-outline-danger ms-1" onclick="deleteUser('${row.id}')">
                            <i class="bi bi-trash"></i> 删除
                        </button>
                    `
                }
            ],
            data: mockData,
            emptyText: '暂无用户数据'
        });
        
    } catch (error) {
        console.error('加载用户列表失败:', error);
        container.innerHTML = '<div class="alert alert-danger">加载失败，请刷新重试</div>';
        utils.showToast('加载用户列表失败', 'danger');
    } finally {
        LoadingComponents.hide(loadingId);
    }
}

// 显示新增用户弹窗（挂载到全局作用域）
window.showAddUserModal = async function() {
    // 加载角色列表
    let roleOptions = [{ value: '', text: '请选择' }];
    try {
        const rolesResponse = await RoleAPI.getList();
        const roles = rolesResponse.items || rolesResponse || [];
        roleOptions = [
            { value: '', text: '请选择' },
            ...roles.map(role => ({ value: role.id, text: role.name }))
        ];
    } catch (e) {
        console.error('加载角色列表失败:', e);
    }
    
    const formHtml = `
        ${FormComponents.createInput({
            id: 'user-username',
            label: '用户名',
            name: 'username',
            required: true,
            placeholder: '请输入用户名'
        })}
        ${FormComponents.createInput({
            id: 'user-name',
            label: '姓名',
            name: 'name',
            required: true,
            placeholder: '请输入姓名'
        })}
        ${FormComponents.createInput({
            id: 'user-employee-no',
            label: '工号',
            name: 'employee_no',
            required: true,
            placeholder: '请输入工号'
        })}
        ${FormComponents.createInput({
            id: 'user-password',
            label: '密码',
            name: 'password',
            type: 'password',
            required: true,
            placeholder: '请输入密码'
        })}
        ${FormComponents.createSelect({
            id: 'user-role',
            label: '角色',
            name: 'role_id',
            required: true,
            options: roleOptions
        })}
        ${FormComponents.createInput({
            id: 'user-phone',
            label: '手机号',
            name: 'phone',
            type: 'tel',
            required: true,
            placeholder: '请输入手机号'
        })}
        ${FormComponents.createInput({
            id: 'user-email',
            label: '邮箱',
            name: 'email',
            type: 'email',
            placeholder: '请输入邮箱（选填）'
        })}
    `;
    
    // 定义onSubmit函数
    const onSubmitHandler = async (data) => {
        try {
            // 处理角色分配
            const roleId = data.role_id;
            const employeeNo = data.employee_no;
            const userName = data.name;
            const userPhone = data.phone;
            
            // 验证必填字段
            if (!data.username || !data.username.trim()) {
                utils.showToast('用户名不能为空', 'danger');
                return false;
            }
            if (!data.password || !data.password.trim()) {
                utils.showToast('密码不能为空', 'danger');
                return false;
            }
            if (!data.name || !data.name.trim()) {
                utils.showToast('姓名不能为空', 'danger');
                return false;
            }
            if (!data.phone || !data.phone.trim()) {
                utils.showToast('手机号不能为空', 'danger');
                return false;
            }
            
            // 创建用户（注意：后端需要real_name字段，前端传的是name）
            // 构建用户数据，只包含后端需要的字段
            const userData = {
                username: data.username.trim(),
                password: data.password,
                real_name: data.name.trim(), // 关键：将name映射为real_name
                phone: data.phone.trim(),
                status: 'active'
            };
            
            // 邮箱为选填，如果为空字符串或null，不包含在请求中
            if (data.email && data.email.trim()) {
                userData.email = data.email.trim();
            }
            
            // 验证real_name是否存在
            if (!userData.real_name || !userData.real_name.trim()) {
                utils.showToast('姓名不能为空', 'danger');
                return false;
            }
            
            const userResult = await UserAPI.create(userData);
            const userId = userResult.id || userResult.data?.id;
            
            if (!userId) {
                throw new Error('创建用户失败：未返回用户ID');
            }
            
            // 如果有角色ID，分配角色
            if (roleId) {
                await UserAPI.assignRole(userId, roleId);
                
                // 如果角色是医生，需要创建医生记录
                // 获取角色信息以判断是否为医生
                try {
                    const roleResponse = await RoleAPI.getDetail(roleId);
                    const roleCode = roleResponse.code || roleResponse.data?.code;
                    
                    if (roleCode === 'doctor') {
                        // 验证必填字段
                        if (!employeeNo) {
                            throw new Error('创建医生记录失败：工号不能为空');
                        }
                        
                        // 创建医生记录
                        await DoctorAPI.create({
                            name: userName,
                            employee_no: employeeNo,
                            phone: userPhone,
                            user_id: userId,
                            status: 'active'
                        });
                        utils.showToast('新增用户成功，已自动创建医生记录。请在医生管理中编辑医生详细信息。', 'success');
                    } else {
                        utils.showToast('新增用户成功', 'success');
                    }
                } catch (roleError) {
                    console.warn('获取角色信息或创建医生记录失败:', roleError);
                    // 如果创建医生记录失败，仍然提示用户成功，但给出警告
                    if (roleError.message && roleError.message.includes('医生记录')) {
                        utils.showToast('新增用户成功，但创建医生记录失败：' + roleError.message, 'warning');
                    } else {
                        utils.showToast('新增用户成功', 'success');
                    }
                }
            } else {
                utils.showToast('新增用户成功', 'success');
            }
            
            loadUsers();
            return true;
        } catch (error) {
            // 提取更详细的错误信息
            let errorMsg = error.message || '新增用户失败';
            
            // 优先使用error对象中保存的验证错误
            if (error.validationErrors && Array.isArray(error.validationErrors)) {
                const errorDetails = error.validationErrors.map(err => {
                    const field = err.loc && err.loc.length > 0 ? err.loc[err.loc.length - 1] : '未知字段';
                    const msg = err.msg || '验证失败';
                    return `${field}: ${msg}`;
                }).join('; ');
                errorMsg = `验证失败: ${errorDetails}`;
            } else if (error.response && error.response.data) {
                const errorData = error.response.data;
                // 处理FastAPI默认格式 {detail: [...]}
                if (errorData.detail && Array.isArray(errorData.detail)) {
                    const errorDetails = errorData.detail.map(err => {
                        const field = err.loc && err.loc.length > 0 ? err.loc[err.loc.length - 1] : '未知字段';
                        const msg = err.msg || '验证失败';
                        return `${field}: ${msg}`;
                    }).join('; ');
                    errorMsg = `验证失败: ${errorDetails}`;
                } else if (errorData.data && errorData.data.details && errorData.data.details.errors) {
                    // 处理自定义格式
                    const validationErrors = errorData.data.details.errors;
                    const errorDetails = validationErrors.map(err => {
                        const field = err.loc && err.loc.length > 0 ? err.loc[err.loc.length - 1] : '未知字段';
                        const msg = err.msg || '验证失败';
                        return `${field}: ${msg}`;
                    }).join('; ');
                    errorMsg = `验证失败: ${errorDetails}`;
                } else if (errorData.message) {
                    errorMsg = errorData.message;
                }
            }
            
            utils.showToast(errorMsg, 'danger');
            return false;
        }
    };
    
    const result = await ModalComponents.showFormModal({
        title: '新增用户',
        formHtml: formHtml,
        size: 'lg',
        onSubmit: onSubmitHandler
    });
}

// 编辑用户（挂载到全局作用域）
window.editUser = async function(id) {
    try {
        const user = await UserAPI.getDetail(id);
        
        // 加载角色列表
        let roleOptions = [{ value: '', text: '请选择' }];
        try {
            const rolesResponse = await RoleAPI.getList();
            const roles = rolesResponse.items || rolesResponse || [];
            roleOptions = [
                { value: '', text: '请选择' },
                ...roles.map(role => ({ value: role.id, text: role.name }))
            ];
        } catch (e) {
            console.error('加载角色列表失败:', e);
        }
        
        // 获取用户当前角色
        const currentRoleId = user.roles && user.roles.length > 0 ? user.roles[0] : '';
        
        const formHtml = `
            ${FormComponents.createInput({
                id: 'edit-username',
                label: '用户名',
                name: 'username',
                value: user.username,
                readonly: true
            })}
            ${FormComponents.createInput({
                id: 'edit-real-name',
                label: '姓名',
                name: 'real_name',
                value: user.real_name || user.name || '',
                required: true
            })}
            ${FormComponents.createInput({
                id: 'edit-phone',
                label: '手机号',
                name: 'phone',
                value: user.phone || '',
                type: 'tel'
            })}
            ${FormComponents.createInput({
                id: 'edit-email',
                label: '邮箱',
                name: 'email',
                value: user.email || '',
                type: 'email'
            })}
            ${FormComponents.createSelect({
                id: 'edit-status',
                label: '状态',
                name: 'status',
                value: user.status || 'active',
                options: [
                    { value: 'active', text: '启用' },
                    { value: 'inactive', text: '禁用' }
                ]
            })}
            ${FormComponents.createSelect({
                id: 'edit-role',
                label: '角色',
                name: 'role_id',
                value: currentRoleId,
                options: roleOptions
            })}
            ${FormComponents.createInput({
                id: 'edit-password',
                label: '新密码（留空不修改）',
                name: 'password',
                type: 'password',
                placeholder: '留空则不修改密码'
            })}
        `;
        
        await ModalComponents.showFormModal({
            title: '编辑用户',
            formHtml: formHtml,
            size: 'lg',
            onSubmit: async (formData) => {
                try {
                    // 处理角色分配
                    const roleId = formData.role_id;
                    delete formData.role_id;
                    
                    // 如果密码为空，删除该字段
                    if (!formData.password) {
                        delete formData.password;
                    }
                    
                    // 更新用户
                    await UserAPI.update(id, formData);
                    
                    // 如果有角色ID且与当前不同，更新角色
                    if (roleId && roleId !== currentRoleId) {
                        await UserAPI.assignRole(id, roleId);
                    }
                    
                    utils.showToast('更新用户成功', 'success');
                    loadUsers();
                    return true;
                } catch (error) {
                    console.error('更新用户失败:', error);
                    const errorMsg = error.message || '更新用户失败';
                    utils.showToast(errorMsg, 'danger');
                    return false;
                }
            }
        });
    } catch (error) {
        console.error('获取用户详情失败:', error);
        utils.showToast('获取用户详情失败', 'danger');
    }
}

// 删除用户（挂载到全局作用域）
window.deleteUser = async function(id) {
    const confirmed = await ModalComponents.confirm({
        title: '确认删除',
        message: '确定要删除该用户吗？',
        confirmText: '删除',
        confirmType: 'danger'
    });
    
    if (confirmed) {
        try {
            await UserAPI.delete(id);
            utils.showToast('删除用户成功', 'success');
            loadUsers();
        } catch (error) {
            console.error('删除用户失败:', error);
            const errorMsg = error.message || '删除用户失败';
            utils.showToast(errorMsg, 'danger');
        }
    }
}

// 显示系统设置标签页（挂载到全局作用域）
window.showSettingsTab = function(event) {
    // 阻止默认行为
    if (event) {
        event.preventDefault();
    }
    
    // 导航到系统设置页面
    try {
        if (window.app && typeof window.app.navigate === 'function') {
            console.log('导航到系统设置页面: system/settings');
            window.app.navigate('system/settings');
        } else {
            // 如果app对象不存在，直接跳转
            console.log('app对象不存在，直接跳转到系统设置页面');
            window.location.href = '/views/system/settings.html';
        }
    } catch (error) {
        console.error('导航到系统设置页面失败:', error);
        // 降级方案：直接跳转
        window.location.href = '/views/system/settings.html';
    }
    return false; // 阻止默认行为
}
</script>

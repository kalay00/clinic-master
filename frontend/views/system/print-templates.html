<!-- 打印模板管理页面 -->
<div class="page-header">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="#" onclick="app.navigate('dashboard')">首页</a></li>
            <li class="breadcrumb-item"><a href="#" onclick="app.navigate('system')">系统管理</a></li>
            <li class="breadcrumb-item active">打印模板管理</li>
        </ol>
    </nav>
    <div class="d-flex justify-content-between align-items-center">
        <h1><i class="bi bi-printer"></i> 打印模板管理</h1>
        <div>
            <button type="button" class="btn btn-success me-2" onclick="if(window.initPresetTemplates) window.initPresetTemplates()">
                <i class="bi bi-download"></i> 初始化预设模板
            </button>
            <button type="button" class="btn btn-primary" onclick="if(window.showAddTemplateModal) window.showAddTemplateModal()">
                <i class="bi bi-plus-circle"></i> 新增模板
            </button>
        </div>
    </div>
</div>

<!-- 搜索栏 -->
<div id="search-container"></div>

<!-- 模板列表 -->
<div class="card">
    <div class="card-header">
        <h5 class="mb-0">模板列表</h5>
    </div>
    <div class="card-body">
        <div id="templates-table-container"></div>
        <div id="templates-pagination-container" class="mt-3"></div>
    </div>
</div>

<script>
let currentPage = 1;
let pageSize = 10;
let searchKeyword = '';
let filterType = '';

// 挂载到全局作用域
window.pageInit = function() {
    if (window.initSearchBar) {
        window.initSearchBar();
    }
    if (window.loadTemplates) {
        window.loadTemplates();
    }
};

// 初始化搜索栏（挂载到全局作用域）
window.initSearchBar = function() {
    const container = document.getElementById('search-container');
    if (!container) {
        console.warn('search-container元素未找到，跳过搜索栏初始化');
        return;
    }
    
    container.innerHTML = SearchComponents.createSearchBar({
        id: 'template-search',
        placeholder: '请输入模板名称搜索...',
        onSearch: (keyword) => {
            searchKeyword = keyword;
            currentPage = 1;
            if (window.loadTemplates) {
                window.loadTemplates();
            }
        },
        filters: [
            {
                type: 'select',
                id: 'type-filter',
                label: '模板类型',
                options: [
                    { value: '', text: '全部' },
                    { value: 'bill', text: '账单' },
                    { value: 'prescription', text: '处方' },
                    { value: 'medical_record', text: '病历' }
                ],
                onChange: (value) => {
                    filterType = value;
                    currentPage = 1;
                    if (window.loadTemplates) {
                        window.loadTemplates();
                    }
                }
            }
        ]
    });
};

// 加载模板列表（挂载到全局作用域）
window.loadTemplates = async function() {
    const container = document.getElementById('templates-table-container');
    const loadingId = LoadingComponents.show('加载中...', container);
    
    try {
        // 构建查询参数
        const params = {
            page: currentPage,
            page_size: pageSize
        };
        if (filterType) {
            params.type = filterType;
        }
        
        // 调用API
        const response = await PrintTemplateAPI.getList(params);
        
        // 处理后端响应格式
        let data = {
            items: [],
            total: 0,
            page: currentPage,
            page_size: pageSize,
            total_pages: 0
        };
        
        if (response && response.data) {
            if (response.data.items) {
                data.items = response.data.items;
            }
            if (response.data.pagination) {
                data.total = response.data.pagination.total || 0;
                data.page = response.data.pagination.page || currentPage;
                data.page_size = response.data.pagination.page_size || pageSize;
                data.total_pages = response.data.pagination.pages || 0;
            }
        } else if (response && response.items) {
            data.items = response.items;
            if (response.pagination) {
                data.total = response.pagination.total || 0;
                data.page = response.pagination.page || currentPage;
                data.page_size = response.pagination.page_size || pageSize;
                data.total_pages = response.pagination.pages || 0;
            }
        } else if (Array.isArray(response)) {
            data.items = response;
            data.total = response.length;
        }
        
        // 过滤搜索结果
        if (searchKeyword) {
            data.items = data.items.filter(item => 
                item.name && item.name.toLowerCase().includes(searchKeyword.toLowerCase())
            );
            data.total = data.items.length;
        }
        
        // 渲染表格
        container.innerHTML = TableComponents.renderTable({
            columns: [
                {
                    title: '模板名称',
                    key: 'name',
                    render: (row) => {
                        const defaultBadge = row.is_default ? '<span class="badge bg-primary ms-2">默认</span>' : '';
                        return `${row.name || '-'}${defaultBadge}`;
                    }
                },
                {
                    title: '模板类型',
                    key: 'type',
                    align: 'center',
                    render: (row) => {
                        const typeMap = {
                            'bill': '账单',
                            'prescription': '处方',
                            'medical_record': '病历'
                        };
                        return typeMap[row.type] || row.type || '-';
                    }
                },
                {
                    title: '创建时间',
                    key: 'created_at',
                    align: 'center',
                    render: (row) => {
                        if (!row.created_at) return '-';
                        const date = new Date(row.created_at);
                        return date.toLocaleString('zh-CN');
                    }
                },
                {
                    title: '操作',
                    key: 'actions',
                    align: 'center',
                    render: (row) => {
                        return `
                            <div class="btn-group" role="group">
                                <button type="button" class="btn btn-sm btn-info" onclick="if(window.editTemplate) window.editTemplate('${row.id}')" title="编辑">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button type="button" class="btn btn-sm btn-secondary" onclick="if(window.duplicateTemplate) window.duplicateTemplate('${row.id}')" title="复制">
                                    <i class="bi bi-files"></i>
                                </button>
                                <button type="button" class="btn btn-sm btn-success" onclick="if(window.previewTemplate) window.previewTemplate('${row.id}')" title="预览">
                                    <i class="bi bi-eye"></i>
                                </button>
                                ${!row.is_default ? `
                                    <button type="button" class="btn btn-sm btn-warning" onclick="if(window.setDefaultTemplate) window.setDefaultTemplate('${row.id}')" title="设为默认">
                                        <i class="bi bi-star"></i>
                                    </button>
                                ` : ''}
                                <button type="button" class="btn btn-sm btn-danger" onclick="if(window.deleteTemplate) window.deleteTemplate('${row.id}')" title="删除">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        `;
                    }
                }
            ],
            data: data.items,
            emptyText: '暂无模板数据'
        });
        
        // 渲染分页
        const paginationContainer = document.getElementById('templates-pagination-container');
        if (paginationContainer && data.total_pages > 0) {
            paginationContainer.innerHTML = TableComponents.renderPagination({
                currentPage: data.page,
                totalPages: data.total_pages,
                totalItems: data.total,
                pageSize: data.page_size,
                onPageChange: (page) => {
                    currentPage = page;
                    window.loadTemplates();
                }
            });
        } else {
            paginationContainer.innerHTML = '';
        }
        
    } catch (error) {
        console.error('加载模板列表失败:', error);
        container.innerHTML = '<div class="alert alert-danger">加载失败，请刷新重试</div>';
        if (window.utils && window.utils.showToast) {
            window.utils.showToast('加载模板列表失败', 'danger');
        }
    } finally {
        LoadingComponents.hide(loadingId);
    }
};

// 显示新增模板弹窗（挂载到全局作用域）
window.showAddTemplateModal = async function() {
    const formHtml = `
        ${FormComponents.createInput({
            id: 'template-name',
            label: '模板名称 <span class="text-danger">*</span>',
            name: 'name',
            placeholder: '请输入模板名称',
            required: true
        })}
        ${FormComponents.createSelect({
            id: 'template-type',
            label: '模板类型 <span class="text-danger">*</span>',
            name: 'type',
            required: true,
            options: [
                { value: 'bill', text: '账单' },
                { value: 'prescription', text: '处方' },
                { value: 'medical_record', text: '病历' }
            ]
        })}
        <div class="mb-3">
            <label class="form-check-label">
                <input type="checkbox" class="form-check-input" id="template-is-default" name="is_default">
                设为默认模板
            </label>
        </div>
        <div class="alert alert-info">
            <i class="bi bi-info-circle"></i> 创建模板后，可以在编辑器中配置模板字段和样式。
        </div>
    `;
    
    const result = await ModalComponents.showFormModal({
        title: '新增打印模板',
        formHtml: formHtml,
        size: 'lg',
        onSubmit: async (data) => {
            try {
                if (!data.name || !data.name.trim()) {
                    if (window.utils && window.utils.showToast) {
                        window.utils.showToast('请输入模板名称', 'danger');
                    }
                    return false;
                }
                
                if (!data.type) {
                    if (window.utils && window.utils.showToast) {
                        window.utils.showToast('请选择模板类型', 'danger');
                    }
                    return false;
                }
                
                // 创建默认模板配置
                const defaultConfig = {
                    version: "1.0",
                    page: {
                        width: 210,
                        height: 297,
                        unit: "mm",
                        margin: {
                            top: 10,
                            right: 10,
                            bottom: 10,
                            left: 10
                        }
                    },
                    sections: [
                        {
                            id: "header",
                            name: "页眉",
                            fields: []
                        },
                        {
                            id: "body",
                            name: "正文",
                            fields: []
                        },
                        {
                            id: "footer",
                            name: "页脚",
                            fields: []
                        }
                    ]
                };
                
                const templateData = {
                    name: data.name.trim(),
                    type: data.type,
                    template_config: defaultConfig,
                    is_default: data.is_default || false
                };
                
                const response = await PrintTemplateAPI.create(templateData);
                
                if (window.utils && window.utils.showToast) {
                    window.utils.showToast('创建模板成功', 'success');
                }
                
                if (window.loadTemplates) {
                    window.loadTemplates();
                }
                
                // 创建成功后，自动打开编辑器
                if (response && response.data && response.data.id) {
                    setTimeout(() => {
                        if (window.editTemplate) {
                            window.editTemplate(response.data.id);
                        }
                    }, 500);
                }
                
                return true;
            } catch (error) {
                console.error('创建模板失败:', error);
                let errorMsg = error.message || '创建模板失败';
                if (error.response && error.response.data && error.response.data.message) {
                    errorMsg = error.response.data.message;
                }
                if (window.utils && window.utils.showToast) {
                    window.utils.showToast(errorMsg, 'danger');
                }
                return false;
            }
        }
    });
};

// 编辑模板（挂载到全局作用域）
window.editTemplate = async function(templateId) {
    // 跳转到编辑器页面（将在任务8中实现）
    if (window.app && window.app.navigate) {
        window.app.navigate(`system/print-templates/editor?id=${templateId}`);
    } else {
        window.location.href = `/views/system/print-templates-editor.html?id=${templateId}`;
    }
};

// 预览模板（挂载到全局作用域）
window.previewTemplate = async function(templateId) {
    try {
        const response = await PrintTemplateAPI.preview(templateId);
        
        let html = '';
        if (response && response.data && response.data.html) {
            html = response.data.html;
        } else if (response && response.html) {
            html = response.html;
        }
        
        if (!html) {
            if (window.utils && window.utils.showToast) {
                window.utils.showToast('预览失败：未获取到HTML内容', 'danger');
            }
            return;
        }
        
        // 打开新窗口显示预览
        const previewWindow = window.open('', '_blank');
        previewWindow.document.write(html);
        previewWindow.document.close();
        
    } catch (error) {
        console.error('预览模板失败:', error);
        let errorMsg = error.message || '预览模板失败';
        if (error.response && error.response.data && error.response.data.message) {
            errorMsg = error.response.data.message;
        }
        if (window.utils && window.utils.showToast) {
            window.utils.showToast(errorMsg, 'danger');
        }
    }
};

// 设置默认模板（挂载到全局作用域）
window.setDefaultTemplate = async function(templateId) {
    const confirmed = await ModalComponents.confirm({
        title: '确认设置',
        message: '确定要将此模板设为默认模板吗？',
        confirmText: '确认',
        confirmType: 'warning'
    });
    
    if (!confirmed) return;
    
    try {
        await PrintTemplateAPI.setDefault(templateId);
        if (window.utils && window.utils.showToast) {
            window.utils.showToast('设置默认模板成功', 'success');
        }
        if (window.loadTemplates) {
            window.loadTemplates();
        }
    } catch (error) {
        console.error('设置默认模板失败:', error);
        let errorMsg = error.message || '设置默认模板失败';
        if (error.response && error.response.data && error.response.data.message) {
            errorMsg = error.response.data.message;
        }
        if (window.utils && window.utils.showToast) {
            window.utils.showToast(errorMsg, 'danger');
        }
    }
};

// 删除模板（挂载到全局作用域）
window.deleteTemplate = async function(templateId) {
    const confirmed = await ModalComponents.confirm({
        title: '确认删除',
        message: '确定要删除此模板吗？删除后无法恢复。',
        confirmText: '确认删除',
        confirmType: 'danger'
    });
    
    if (!confirmed) return;
    
    try {
        await PrintTemplateAPI.delete(templateId);
        if (window.utils && window.utils.showToast) {
            window.utils.showToast('删除模板成功', 'success');
        }
        if (window.loadTemplates) {
            window.loadTemplates();
        }
    } catch (error) {
        console.error('删除模板失败:', error);
        let errorMsg = error.message || '删除模板失败';
        if (error.response && error.response.data && error.response.data.message) {
            errorMsg = error.response.data.message;
        }
        if (window.utils && window.utils.showToast) {
            window.utils.showToast(errorMsg, 'danger');
        }
    }
};

// 复制模板（挂载到全局作用域）
window.duplicateTemplate = async function(templateId) {
    const formHtml = `
        ${FormComponents.createInput({
            id: 'duplicate-template-name',
            label: '新模板名称 <span class="text-danger">*</span>',
            name: 'name',
            placeholder: '请输入新模板名称',
            required: true
        })}
    `;
    
    const result = await ModalComponents.showFormModal({
        title: '复制模板',
        formHtml: formHtml,
        size: 'md',
        onSubmit: async (data) => {
            const newName = document.getElementById('duplicate-template-name').value?.trim();
            if (!newName) {
                if (window.utils && window.utils.showToast) {
                    window.utils.showToast('请输入新模板名称', 'danger');
                }
                return false;
            }
            
            try {
                const response = await PrintTemplateAPI.duplicate(templateId, newName);
                
                if (window.utils && window.utils.showToast) {
                    window.utils.showToast('复制模板成功', 'success');
                }
                
                if (window.loadTemplates) {
                    window.loadTemplates();
                }
                
                // 复制成功后，自动打开编辑器
                if (response && response.data && response.data.id) {
                    setTimeout(() => {
                        if (window.editTemplate) {
                            window.editTemplate(response.data.id);
                        }
                    }, 500);
                }
                
                return true;
            } catch (error) {
                console.error('复制模板失败:', error);
                let errorMsg = error.message || '复制模板失败';
                if (error.response && error.response.data && error.response.data.message) {
                    errorMsg = error.response.data.message;
                }
                if (window.utils && window.utils.showToast) {
                    window.utils.showToast(errorMsg, 'danger');
                }
                return false;
            }
        }
    });
};

// 初始化预设模板（挂载到全局作用域）
window.initPresetTemplates = async function() {
    const confirmed = await ModalComponents.confirm({
        title: '确认初始化',
        message: '确定要初始化预设模板吗？如果已存在同名模板，将跳过创建。',
        confirmText: '确认初始化',
        confirmType: 'info'
    });
    
    if (!confirmed) return;
    
    try {
        const response = await PrintTemplateAPI.initPresetTemplates();
        
        let message = '初始化预设模板成功';
        if (response && response.data) {
            const created = response.data.created || [];
            const skipped = response.data.skipped || [];
            if (created.length > 0) {
                message += `，已创建 ${created.length} 个模板`;
            }
            if (skipped.length > 0) {
                message += `，跳过 ${skipped.length} 个已存在的模板`;
            }
        }
        
        if (window.utils && window.utils.showToast) {
            window.utils.showToast(message, 'success');
        }
        
        if (window.loadTemplates) {
            window.loadTemplates();
        }
    } catch (error) {
        console.error('初始化预设模板失败:', error);
        let errorMsg = error.message || '初始化预设模板失败';
        if (error.response && error.response.data && error.response.data.message) {
            errorMsg = error.response.data.message;
        }
        if (window.utils && window.utils.showToast) {
            window.utils.showToast(errorMsg, 'danger');
        }
    }
};
</script>

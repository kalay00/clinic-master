<!-- 账单详情页面 -->
<div class="page-header">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="#" onclick="app.navigate('dashboard')">首页</a></li>
            <li class="breadcrumb-item"><a href="#" onclick="app.navigate('payments')">收费管理</a></li>
            <li class="breadcrumb-item active">账单详情</li>
        </ol>
    </nav>
    <div class="d-flex justify-content-between align-items-center">
        <h1><i class="bi bi-receipt"></i> 账单详情</h1>
        <div class="d-flex gap-2 align-items-center">
            <div class="input-group" style="width: 200px;">
                <label class="input-group-text" for="print-template-select">
                    <i class="bi bi-file-earmark-text"></i>
                </label>
                <select class="form-select" id="print-template-select" onchange="if(window.onTemplateSelectChange) window.onTemplateSelectChange()">
                    <option value="">使用默认模板</option>
                </select>
            </div>
            <button type="button" class="btn btn-info" onclick="if(window.printBill) window.printBill()">
                <i class="bi bi-printer"></i> 打印
            </button>
            <button type="button" class="btn btn-secondary" onclick="app.navigate('payments')">
                <i class="bi bi-arrow-left"></i> 返回
            </button>
        </div>
    </div>
</div>

<div id="bill-detail-container"></div>

<script>
let billId = null;
let billData = null;
let printTemplates = [];
let selectedTemplateId = null;

window.pageInit = async function() {
    // 从URL hash或search中获取参数
    let queryString = '';
    
    // 优先从hash中获取（SPA路由）
    if (window.location.hash) {
        const hashParts = window.location.hash.split('?');
        if (hashParts.length > 1) {
            queryString = hashParts[1];
        }
    }
    
    // 如果hash中没有，从search中获取（直接访问）
    if (!queryString && window.location.search) {
        queryString = window.location.search.substring(1);
    }
    
    // 从当前路由中获取（app.navigate传递的）
    if (!queryString && app && app.currentRoute) {
        const routeParts = app.currentRoute.split('?');
        if (routeParts.length > 1) {
            queryString = routeParts[1];
        }
    }
    
    const urlParams = new URLSearchParams(queryString);
    billId = urlParams.get('id');
    
    if (!billId) {
        document.getElementById('bill-detail-container').innerHTML = '<div class="alert alert-danger">账单ID不存在</div>';
        return;
    }
    
    await loadPrintTemplates();
    await loadBillDetail();
};

// 加载打印模板列表
async function loadPrintTemplates() {
    try {
        const response = await PrintTemplateAPI.getList({
            page: 1,
            page_size: 100,
            type: 'bill'
        });
        
        let items = [];
        if (response && response.data) {
            items = response.data.items || [];
        } else if (response && response.items) {
            items = response.items || [];
        }
        
        printTemplates = items;
        
        // 填充模板选择下拉框
        const select = document.getElementById('print-template-select');
        if (select) {
            // 保留"使用默认模板"选项
            select.innerHTML = '<option value="">使用默认模板</option>';
            
            // 添加模板选项
            printTemplates.forEach(template => {
                const option = document.createElement('option');
                option.value = template.id;
                option.textContent = template.name + (template.is_default ? ' (默认)' : '');
                if (template.is_default) {
                    option.selected = true;
                    selectedTemplateId = template.id;
                }
                select.appendChild(option);
            });
        }
    } catch (error) {
        console.error('加载打印模板失败:', error);
    }
}

// 模板选择变化
window.onTemplateSelectChange = function() {
    const select = document.getElementById('print-template-select');
    if (select) {
        selectedTemplateId = select.value || null;
    }
};

// 加载账单详情
async function loadBillDetail() {
    const container = document.getElementById('bill-detail-container');
    const loadingId = LoadingComponents.show('加载中...', container);
    
    try {
        // 调用实际API
        const billResponse = await PaymentAPI.getBillDetail(billId);
        
        // 处理后端响应格式
        let bill = billResponse;
        if (billResponse && billResponse.data) {
            bill = billResponse.data;
        }
        
        // 适配后端返回的字段名
        bill.bill_no = bill.bill_no || bill.bill_number || billId;
        // 确保items是数组
        if (!bill.items) {
            bill.items = [];
        } else if (!Array.isArray(bill.items)) {
            // 如果不是数组，尝试转换
            bill.items = [bill.items];
        }
        bill.total_amount = bill.total_amount || bill.total || 0;
        bill.subtotal = bill.subtotal || bill.total_amount || 0;
        bill.paid_amount = bill.paid_amount || 0;
        bill.payment_status = bill.payment_status || bill.status || 'unpaid';
        
        // 调试信息
        console.log('账单数据:', {
            bill_no: bill.bill_no,
            items_count: bill.items ? bill.items.length : 0,
            items: bill.items
        });
        
        // 保存账单数据供打印使用
        billData = bill;
        
        // 确保字段存在
        if (!bill.id) bill.id = billId;
        
        // 身份证号脱敏函数
        function maskIdCard(idCard) {
            if (!idCard || typeof idCard !== 'string') return '-';
            if (idCard.length < 10) return idCard; // 太短不脱敏
            // 前6位 + **** + 后4位
            return idCard.substring(0, 6) + '****' + idCard.substring(idCard.length - 4);
        }
        
        // 格式化金额（如果没有utils.formatMoney）
        function formatMoney(amount) {
            if (window.utils && typeof window.utils.formatMoney === 'function') {
                return window.utils.formatMoney(amount);
            }
            if (typeof amount === 'number') {
                return '¥' + amount.toFixed(2);
            }
            return amount || '¥0.00';
        }
        
        container.innerHTML = `
            <!-- 基本信息 -->
            <div class="card mb-3">
                <div class="card-header">
                    <h5 class="mb-0"><i class="bi bi-info-circle"></i> 基本信息</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label text-muted">账单号</label>
                            <div class="fw-bold">${bill.bill_no || bill.id}</div>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label text-muted">患者姓名</label>
                            <div class="fw-bold">${bill.patient_name || '-'}</div>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label text-muted">身份证号</label>
                            <div>${bill.patient_id_card ? maskIdCard(bill.patient_id_card) : '-'}</div>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label text-muted">创建时间</label>
                            <div>${bill.created_at || bill.created_time || '-'}</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 费用明细 -->
            <div class="card mb-3">
                <div class="card-header">
                    <h5 class="mb-0"><i class="bi bi-list-ul"></i> 费用明细</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead>
                                <tr>
                                    <th>项目名称</th>
                                    <th>数量</th>
                                    <th>单价</th>
                                    <th>金额</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${bill.items && bill.items.length > 0 ? bill.items.map(item => `
                                    <tr>
                                        <td>${item.item_name || item.name || '-'}</td>
                                        <td>${item.quantity || 0}</td>
                                        <td class="text-right">${formatMoney(item.unit_price || 0)}</td>
                                        <td class="text-right">${formatMoney(item.total_price || item.amount || 0)}</td>
                                    </tr>
                                `).join('') : '<tr><td colspan="4" class="text-center text-muted">暂无明细</td></tr>'}
                                <tr>
                                    <td colspan="3" class="text-right">小计：</td>
                                    <td class="text-right">${formatMoney(bill.subtotal)}</td>
                                </tr>
                                ${bill.discount_amount > 0 ? `
                                    <tr>
                                        <td colspan="3" class="text-right">优惠：</td>
                                        <td class="text-right text-danger">-${formatMoney(bill.discount_amount)}</td>
                                    </tr>
                                ` : ''}
                                ${bill.insurance_amount > 0 ? `
                                    <tr>
                                        <td colspan="3" class="text-right">医保报销：</td>
                                        <td class="text-right text-success">-${formatMoney(bill.insurance_amount)}</td>
                                    </tr>
                                ` : ''}
                                <tr class="table-info">
                                    <td colspan="3" class="text-right fw-bold">合计：</td>
                                    <td class="text-right fw-bold">${formatMoney(bill.total_amount)}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <!-- 支付信息 -->
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0"><i class="bi bi-credit-card"></i> 支付信息</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label text-muted">支付状态</label>
                            <div>
                                ${bill.payment_status === 'paid' ? '<span class="badge bg-success">已支付</span>' : 
                                  bill.payment_status === 'refunded' ? '<span class="badge bg-danger">已退费</span>' : 
                                  bill.payment_status === 'partial' ? '<span class="badge bg-info">部分支付</span>' :
                                  '<span class="badge bg-warning">未支付</span>'}
                            </div>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label text-muted">应付金额</label>
                            <div class="fw-bold">${formatMoney(bill.total_amount)}</div>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label text-muted">已付金额</label>
                            <div class="fw-bold">${formatMoney(bill.paid_amount)}</div>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label text-muted">支付方式</label>
                            <div>${bill.payment_method || bill.payment_type || '未支付'}</div>
                        </div>
                        ${(bill.payment_time || bill.paid_at) ? `
                            <div class="col-md-3 mb-3">
                                <label class="form-label text-muted">支付时间</label>
                                <div>${bill.payment_time || bill.paid_at}</div>
                            </div>
                        ` : ''}
                    </div>
                    ${bill.payment_status === 'unpaid' ? `
                        <div class="mt-3">
                            <button type="button" class="btn btn-success" onclick="if(window.payBill) window.payBill()">
                                <i class="bi bi-credit-card"></i> 立即支付
                            </button>
                        </div>
                    ` : ''}
                </div>
            </div>
        `;
        
    } catch (error) {
        console.error('加载账单详情失败:', error);
        container.innerHTML = '<div class="alert alert-danger">加载失败，请刷新重试</div>';
        utils.showToast('加载账单详情失败', 'danger');
    } finally {
        LoadingComponents.hide(loadingId);
    }
}

// 支付账单（挂载到全局作用域）
window.payBill = function() {
    if (!billId) {
        utils.showToast('账单ID不存在', 'danger');
        return;
    }
    window.location.href = `/views/payments/list.html?action=pay&id=${billId}`;
};

// 打印账单（挂载到全局作用域）
window.printBill = async function() {
    if (selectedTemplateId) {
        // 使用选中的模板打印
        try {
            const response = await PrintTemplateAPI.preview(selectedTemplateId, {
                data_type: 'bill',
                data_id: billId
            });
            
            let html = '';
            if (response && response.data && response.data.html) {
                html = response.data.html;
            } else if (response && response.html) {
                html = response.html;
            }
            
            if (html) {
                // 打开新窗口打印
                const printWindow = window.open('', '_blank');
                printWindow.document.write(html);
                printWindow.document.close();
                
                // 等待内容加载后打印
                printWindow.onload = function() {
                    printWindow.print();
                };
            } else {
                // 如果模板渲染失败，使用默认打印
                window.print();
            }
        } catch (error) {
            console.error('使用模板打印失败:', error);
            // 如果模板打印失败，使用默认打印
            window.print();
        }
    } else {
        // 使用默认打印
        window.print();
    }
};
</script>

<style>
@media print {
    .no-print {
        display: none !important;
    }
    
    .page-header,
    .btn {
        display: none !important;
    }
}
</style>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>租户管理 - 平台管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../css/main.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        :root {
            --primary-dark: #0f172a;
            --primary-blue: #1e40af;
            --primary-gradient: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #3b82f6 100%);
            --sidebar-gradient: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            --accent-gold: #f59e0b;
            --accent-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --card-shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.24);
            --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.07), 0 10px 15px rgba(0, 0, 0, 0.1);
            --card-shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.15), 0 20px 40px rgba(0, 0, 0, 0.1);
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --bg-light: #f8fafc;
            --bg-white: #ffffff;
        }
        
        body {
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 50%, #cbd5e1 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(30, 64, 175, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        
        .container-fluid {
            position: relative;
            z-index: 1;
        }
        
        /* 侧边栏 - 高端深色设计 */
        .sidebar {
            min-height: 100vh;
            background: var(--sidebar-gradient);
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        .sidebar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(245, 158, 11, 0.05) 100%);
            pointer-events: none;
        }
        
        .sidebar .brand {
            padding: 2rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
        }
        
        .sidebar .brand h4 {
            color: white;
            font-weight: 700;
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .sidebar .brand h4 i {
            font-size: 1.75rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .sidebar .brand small {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 0.25rem;
            display: block;
        }
        
        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.75);
            padding: 0.875rem 1.5rem;
            border-radius: 0.75rem;
            margin: 0.375rem 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
            font-size: 0.9375rem;
            position: relative;
            z-index: 1;
            border: 1px solid transparent;
        }
        
        .sidebar .nav-link::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 0;
            background: var(--accent-gradient);
            border-radius: 0 3px 3px 0;
            transition: height 0.3s ease;
        }
        
        .sidebar .nav-link:hover {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            transform: translateX(4px);
            border-color: rgba(255, 255, 255, 0.1);
        }
        
        .sidebar .nav-link.active {
            background: rgba(59, 130, 246, 0.15);
            color: white;
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }
        
        .sidebar .nav-link.active::before {
            height: 60%;
        }
        
        .sidebar .nav-link i {
            width: 22px;
            margin-right: 0.875rem;
            font-size: 1.125rem;
        }
        
        .sidebar .user-info {
            padding: 1.5rem;
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1;
        }
        
        .sidebar .user-info .btn {
            border-radius: 0.5rem;
            font-weight: 500;
            font-size: 0.875rem;
            padding: 0.5rem 1rem;
            transition: all 0.3s ease;
        }
        
        .sidebar .user-info .btn-light {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        .sidebar .user-info .btn-light:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
        
        .sidebar .user-info .btn-outline-light {
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .sidebar .user-info .btn-outline-light:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        /* 主内容区 */
        .main-content {
            background: transparent;
            padding: 2.5rem;
        }
        
        .page-header {
            background: var(--bg-white);
            padding: 2rem 2.5rem;
            border-radius: 1rem;
            box-shadow: var(--card-shadow);
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }
        
        .page-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--primary-gradient);
        }
        
        .page-header h1 {
            color: var(--text-primary);
            font-weight: 700;
            margin: 0;
            font-size: 2rem;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .page-header h1 i {
            color: var(--primary-blue);
        }
        
        .content-card {
            background: var(--bg-white);
            border-radius: 1rem;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .content-card:hover {
            box-shadow: var(--card-shadow-lg);
        }
        
        .content-card .card-header {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 1.5rem 2rem;
            font-weight: 600;
            font-size: 1.125rem;
            position: relative;
        }
        
        .content-card .card-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }
        
        .content-card .card-header h5 {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 600;
        }
        
        .content-card .card-body {
            padding: 2rem;
        }
        
        .btn-primary {
            background: var(--primary-gradient);
            border: none;
            border-radius: 0.625rem;
            padding: 0.75rem 1.75rem;
            font-weight: 600;
            font-size: 0.9375rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }
        
        .btn-primary:hover::before {
            width: 300px;
            height: 300px;
        }
        
        .table {
            margin-bottom: 0;
        }
        
        .table thead {
            background: var(--bg-light);
        }
        
        .table thead th {
            font-weight: 600;
            color: var(--text-primary);
            text-transform: uppercase;
            font-size: 0.8125rem;
            letter-spacing: 0.5px;
            padding: 1rem;
            border-bottom: 2px solid var(--border-color);
        }
        
        .table tbody td {
            padding: 1rem;
            color: var(--text-primary);
            vertical-align: middle;
        }
        
        .table tbody tr {
            transition: all 0.2s ease;
        }
        
        .table tbody tr:hover {
            background: var(--bg-light);
            transform: scale(1.01);
        }
        
        .modal-content {
            border-radius: 1rem;
            border: none;
            box-shadow: var(--card-shadow-lg);
            overflow: hidden;
        }
        
        .modal-header {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 1.5rem 2rem;
        }
        
        .modal-header .modal-title {
            font-weight: 600;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .modal-body {
            padding: 2rem;
        }
        
        .modal-footer {
            border-top: 1px solid var(--border-color);
            padding: 1.5rem 2rem;
        }
        
        .form-label {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            font-size: 0.9375rem;
        }
        
        .form-control {
            border-radius: 0.625rem;
            border: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
            font-size: 0.9375rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            <!-- 侧边栏 -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar">
                <div class="d-flex flex-column h-100">
                    <div class="brand">
                        <h4><i class="bi bi-shield-lock-fill"></i> 平台管理</h4>
                        <small>Platform Administration</small>
                    </div>
                    <ul class="nav flex-column flex-grow-1">
                        <li class="nav-item">
                            <a class="nav-link" href="dashboard.html">
                                <i class="bi bi-speedometer2"></i> 仪表板
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="tenants.html">
                                <i class="bi bi-building"></i> 租户管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="statistics.html">
                                <i class="bi bi-graph-up"></i> 平台统计
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="audit.html">
                                <i class="bi bi-file-text"></i> 审计日志
                            </a>
                        </li>
                    </ul>
                    <div class="user-info" style="padding: 1rem; margin-top: auto; border-top: 1px solid rgba(255, 255, 255, 0.1); background: rgba(0, 0, 0, 0.1);">
                        <div class="d-grid gap-2">
                            <button class="btn btn-sm btn-light" onclick="window.location.href='dashboard.html'">
                                <i class="bi bi-house"></i> 返回首页
                            </button>
                            <button class="btn btn-sm btn-outline-light" onclick="logout()">
                                <i class="bi bi-box-arrow-right"></i> 退出登录
                            </button>
                        </div>
                    </div>
                </div>
            </nav>

            <!-- 主内容区 -->
            <main class="col-md-9 ms-sm-auto col-lg-10 main-content">
                <div class="page-header">
                    <div class="d-flex justify-content-between align-items-center">
                        <h1><i class="bi bi-building"></i> 租户管理</h1>
                        <button type="button" class="btn btn-primary" onclick="showAddTenantModal()">
                            <i class="bi bi-plus-circle"></i> 新增租户
                        </button>
                    </div>
                </div>

                <!-- 搜索和筛选 -->
                <div class="content-card mb-4">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <input type="text" class="form-control" id="searchInput" placeholder="搜索租户名称或代码...">
                            </div>
                            <div class="col-md-3">
                                <select class="form-select" id="statusFilter">
                                    <option value="">全部状态</option>
                                    <option value="active">启用</option>
                                    <option value="inactive">禁用</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <button type="button" class="btn btn-primary w-100" onclick="window.loadTenants()">
                                    <i class="bi bi-search"></i> 搜索
                                </button>
                            </div>
                            <div class="col-md-2">
                                <button type="button" class="btn btn-secondary w-100" onclick="resetFilters()">
                                    <i class="bi bi-arrow-clockwise"></i> 重置
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 租户列表 -->
                <div class="content-card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-list-ul"></i> 租户列表</h5>
                    </div>
                    <div class="card-body">
                        <div id="tenantsTableContainer">
                            <div class="text-center py-5">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">加载中...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- 修改租户管理员密码模态框 -->
    <div class="modal fade" id="changePasswordModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-key"></i> 修改租户管理员密码</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="changePasswordForm">
                        <input type="hidden" id="changePasswordTenantId">
                        <div class="mb-3">
                            <label class="form-label">租户名称</label>
                            <input type="text" class="form-control" id="changePasswordTenantName" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">新密码 <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="newPassword" required minlength="6">
                            <small class="text-muted">密码长度至少为6位</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">确认新密码 <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="confirmPassword" required minlength="6">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="saveTenantAdminPassword()">
                        <i class="bi bi-save"></i> 保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 新增/编辑租户模态框 -->
    <div class="modal fade" id="tenantModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="tenantModalTitle">新增租户</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="tenantForm">
                        <input type="hidden" id="tenantId">
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">租户名称 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="tenantName" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">租户代码 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="tenantCode" required pattern="[A-Z0-9]+">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">机构类型 <span class="text-danger">*</span></label>
                                <select class="form-select" id="tenantType" required>
                                    <option value="clinic">门诊</option>
                                    <option value="hospital">医院</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">租户域名</label>
                                <input type="text" class="form-control" id="tenantDomain" placeholder="如：test001.his.example.com">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">联系人</label>
                                <input type="text" class="form-control" id="contactName">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">联系电话</label>
                                <input type="text" class="form-control" id="contactPhone">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">联系邮箱</label>
                                <input type="email" class="form-control" id="contactEmail">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">状态</label>
                                <select class="form-select" id="tenantStatus">
                                    <option value="active">启用</option>
                                    <option value="inactive">禁用</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">地址</label>
                                <textarea class="form-control" id="tenantAddress" rows="2"></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">订阅计划</label>
                                <select class="form-select" id="subscriptionPlan">
                                    <option value="">请选择</option>
                                    <option value="standard">标准版</option>
                                    <option value="premium">高级版</option>
                                </select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="saveTenant()">
                        <i class="bi bi-save"></i> 保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script>
        // 等待 API 加载完成
        (function() {
            // 检查 PlatformAPI 是否已加载
            function checkAPILoaded() {
                if (typeof window.PlatformAPI === 'undefined') {
                    setTimeout(checkAPILoaded, 50);
                    return;
                }
                // API 已加载，初始化页面
                initPage();
            }
            
            function initPage() {
                // 检查登录状态
                const token = localStorage.getItem('his_token');
                const user = JSON.parse(localStorage.getItem('his_user') || '{}');
                
                if (!token || user.role !== 'platform_admin') {
                    window.location.href = '/platform-login.html';
                    return;
                }
                
                let currentPage = 1;
                const pageSize = 10;

                /**
                 * 加载租户列表
                 */
                window.loadTenants = async function(page = 1) {
                    try {
                        const search = document.getElementById('searchInput').value;
                        const status = document.getElementById('statusFilter').value;
                        
                        const params = {
                            page: page,
                            page_size: pageSize,
                            search: search || undefined,
                            status: status || undefined
                        };
                        
                        const response = await PlatformAPI.getTenants(params);
                        
                        // 处理不同的响应格式
                        if (response && response.code === 200) {
                            // 标准响应格式 {code: 200, data: {items: [], pagination: {}}}
                            const data = response.data || response;
                            renderTenantsTable(data);
                            currentPage = page;
                        } else if (response && response.items) {
                            // 直接返回 {items: [], pagination: {}}
                            renderTenantsTable(response);
                            currentPage = page;
                        } else {
                            // 错误响应
                            const errorMsg = response?.message || response?.error || '未知错误';
                            showError('加载租户列表失败：' + errorMsg);
                        }
                    } catch (error) {
                        console.error('加载租户列表失败:', error);
                        const errorMsg = error?.message || error?.response?.data?.message || '网络错误，请稍后重试';
                        showError('加载租户列表失败：' + errorMsg);
                    }
                }

                /**
                 * 渲染租户表格
                 */
                function renderTenantsTable(data) {
                    const container = document.getElementById('tenantsTableContainer');
                    const items = data.items || [];
                    const pagination = data.pagination || {};
                    
                    if (items.length === 0) {
                        container.innerHTML = '<div class="alert alert-info">暂无租户数据</div>';
                        return;
                    }
                    
                    let html = `
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>租户代码</th>
                                        <th>租户名称</th>
                                        <th>域名</th>
                                        <th>类型</th>
                                        <th>状态</th>
                                        <th>订阅计划</th>
                                        <th>创建时间</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;
                    
                    items.forEach(tenant => {
                        const statusBadge = tenant.status === 'active' 
                            ? '<span class="badge bg-success">启用</span>'
                            : '<span class="badge bg-secondary">禁用</span>';
                        
                        html += `
                            <tr>
                                <td><code>${tenant.code}</code></td>
                                <td>${tenant.name}</td>
                                <td>${tenant.domain || '-'}</td>
                                <td>${tenant.type === 'clinic' ? '门诊' : '医院'}</td>
                                <td>${statusBadge}</td>
                                <td>${tenant.subscription_plan || '-'}</td>
                                <td>${tenant.created_at ? new Date(tenant.created_at).toLocaleDateString('zh-CN') : '-'}</td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary" onclick="editTenant('${tenant.id}')">
                                        <i class="bi bi-pencil"></i> 编辑
                                    </button>
                                    <button class="btn btn-sm btn-outline-warning" onclick="showChangePasswordModal('${tenant.id}', '${tenant.name}')">
                                        <i class="bi bi-key"></i> 修改密码
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger" onclick="deleteTenant('${tenant.id}', '${tenant.name}')">
                                        <i class="bi bi-trash"></i> 删除
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                    
                    html += `
                                </tbody>
                            </table>
                        </div>
                    `;
            
                    // 添加分页
                    if (pagination.total > pageSize) {
                        html += renderPagination(pagination);
                    }
                    
                    container.innerHTML = html;
                }

                /**
                 * 渲染分页
                 */
                function renderPagination(pagination) {
                    const totalPages = pagination.pages || pagination.total_pages || Math.ceil((pagination.total || 0) / pageSize);
                    let html = '<nav><ul class="pagination justify-content-center">';
                    
                    for (let i = 1; i <= totalPages; i++) {
                        html += `
                            <li class="page-item ${i === currentPage ? 'active' : ''}">
                                <a class="page-link" href="#" onclick="window.loadTenants(${i}); return false;">${i}</a>
                            </li>
                        `;
                    }
                    
                    html += '</ul></nav>';
                    return html;
                }

                /**
                 * 显示新增租户模态框
                 */
                window.showAddTenantModal = function() {
                    document.getElementById('tenantModalTitle').textContent = '新增租户';
                    document.getElementById('tenantForm').reset();
                    document.getElementById('tenantId').value = '';
                    document.getElementById('tenantStatus').value = 'active';
                    
                    const modal = new bootstrap.Modal(document.getElementById('tenantModal'));
                    modal.show();
                }

                /**
                 * 编辑租户
                 */
                window.editTenant = async function(tenantId) {
                    try {
                        const response = await PlatformAPI.getTenantDetail(tenantId);
                        
                        // API 客户端在成功时返回 data.data，所以 response 可能是租户对象本身
                        // 或者可能是 {code: 200, data: {...}} 格式（如果 API 客户端没有处理）
                        let tenant = null;
                        
                        if (response && response.code === 200) {
                            // 标准响应格式 {code: 200, data: {...}}
                            tenant = response.data;
                        } else if (response && response.id) {
                            // 直接返回租户对象（API 客户端已处理，返回 data.data）
                            tenant = response;
                        } else if (response && response.data) {
                            // {data: {...}} 格式
                            tenant = response.data;
                        } else {
                            // 错误响应或未知格式
                            console.error('获取租户信息失败 - 响应格式异常:', response);
                            const errorMsg = response?.message || response?.error || '未知错误';
                            showError('获取租户信息失败：' + errorMsg);
                            return;
                        }
                        
                        if (!tenant || !tenant.id) {
                            console.error('获取租户信息失败 - 租户数据无效:', tenant, '原始响应:', response);
                            showError('获取租户信息失败：租户数据无效');
                            return;
                        }
                        
                        // 填充表单
                        document.getElementById('tenantModalTitle').textContent = '编辑租户';
                        document.getElementById('tenantId').value = tenant.id || '';
                        document.getElementById('tenantName').value = tenant.name || '';
                        document.getElementById('tenantCode').value = tenant.code || '';
                        document.getElementById('tenantType').value = tenant.type || 'clinic';
                        document.getElementById('tenantDomain').value = tenant.domain || '';
                        document.getElementById('contactName').value = tenant.contact_name || '';
                        document.getElementById('contactPhone').value = tenant.contact_phone || '';
                        document.getElementById('contactEmail').value = tenant.contact_email || '';
                        document.getElementById('tenantAddress').value = tenant.address || '';
                        document.getElementById('tenantStatus').value = tenant.status || 'active';
                        document.getElementById('subscriptionPlan').value = tenant.subscription_plan || '';
                        
                        const modal = new bootstrap.Modal(document.getElementById('tenantModal'));
                        modal.show();
                    } catch (error) {
                        console.error('获取租户信息失败:', error);
                        // 提取错误消息
                        let errorMsg = '网络错误，请稍后重试';
                        if (error?.message) {
                            errorMsg = error.message;
                        } else if (error?.response?.data?.message) {
                            errorMsg = error.response.data.message;
                        } else if (error?.response?.data) {
                            errorMsg = typeof error.response.data === 'string' 
                                ? error.response.data 
                                : (error.response.data.message || '请求失败');
                        }
                        showError('获取租户信息失败：' + errorMsg);
                    }
                }

                /**
                 * 保存租户
                 */
                window.saveTenant = async function() {
                    const tenantId = document.getElementById('tenantId').value;
                    const isEdit = !!tenantId;
                    
                    const tenantData = {
                        name: document.getElementById('tenantName').value,
                        code: document.getElementById('tenantCode').value.toUpperCase(),
                        type: document.getElementById('tenantType').value,
                        domain: document.getElementById('tenantDomain').value,
                        contact_name: document.getElementById('contactName').value,
                        contact_phone: document.getElementById('contactPhone').value,
                        contact_email: document.getElementById('contactEmail').value,
                        address: document.getElementById('tenantAddress').value,
                        status: document.getElementById('tenantStatus').value,
                        subscription_plan: document.getElementById('subscriptionPlan').value,
                    };
                    
                    try {
                        let response;
                        if (isEdit) {
                            response = await PlatformAPI.updateTenant(tenantId, tenantData);
                        } else {
                            response = await PlatformAPI.createTenant(tenantData);
                        }
                        
                        if (response.code === 200) {
                            bootstrap.Modal.getInstance(document.getElementById('tenantModal')).hide();
                            showSuccess(isEdit ? '租户更新成功' : '租户创建成功');
                            window.loadTenants(currentPage);
                        } else {
                            showError(response.message || '保存失败');
                        }
                    } catch (error) {
                        console.error('保存租户失败:', error);
                        showError('网络错误，请稍后重试');
                    }
                }

                /**
                 * 显示修改密码模态框
                 */
                window.showChangePasswordModal = function(tenantId, tenantName) {
                    document.getElementById('changePasswordTenantId').value = tenantId;
                    document.getElementById('changePasswordTenantName').value = tenantName;
                    document.getElementById('changePasswordForm').reset();
                    document.getElementById('changePasswordTenantId').value = tenantId;
                    document.getElementById('changePasswordTenantName').value = tenantName;
                    
                    const modal = new bootstrap.Modal(document.getElementById('changePasswordModal'));
                    modal.show();
                }
                
                /**
                 * 保存租户管理员密码
                 */
                window.saveTenantAdminPassword = async function() {
                    const tenantId = document.getElementById('changePasswordTenantId').value;
                    const newPassword = document.getElementById('newPassword').value;
                    const confirmPassword = document.getElementById('confirmPassword').value;
                    
                    if (!newPassword || !confirmPassword) {
                        showError('请填写所有字段');
                        return;
                    }
                    
                    if (newPassword.length < 6) {
                        showError('新密码长度至少为6位');
                        return;
                    }
                    
                    if (newPassword !== confirmPassword) {
                        showError('两次输入的新密码不一致');
                        return;
                    }
                    
                    try {
                        const response = await PlatformAPI.updateTenantAdminPassword(tenantId, newPassword);
                        
                        if (response && response.code === 200) {
                            bootstrap.Modal.getInstance(document.getElementById('changePasswordModal')).hide();
                            showSuccess('密码修改成功');
                        } else {
                            const errorMsg = response?.message || '修改密码失败';
                            showError(errorMsg);
                        }
                    } catch (error) {
                        console.error('修改密码失败:', error);
                        const errorMsg = error?.message || error?.response?.data?.message || '网络错误，请稍后重试';
                        showError('修改密码失败：' + errorMsg);
                    }
                }
                
                /**
                 * 删除租户
                 */
                window.deleteTenant = async function(tenantId, tenantName) {
                    if (!confirm(`确定要删除租户"${tenantName}"吗？\n\n注意：此操作将软删除租户，租户数据不会被物理删除。`)) {
                        return;
                    }
                    
                    try {
                        const response = await PlatformAPI.deleteTenant(tenantId);
                        
                        if (response.code === 200) {
                            showSuccess('租户删除成功');
                            window.loadTenants(currentPage);
                        } else {
                            showError(response.message || '删除失败');
                        }
                    } catch (error) {
                        console.error('删除租户失败:', error);
                        showError('网络错误，请稍后重试');
                    }
                }

                /**
                 * 重置筛选条件
                 */
                window.resetFilters = function() {
                    document.getElementById('searchInput').value = '';
                    document.getElementById('statusFilter').value = '';
                    window.loadTenants(1);
                }

                /**
                 * 显示成功消息
                 */
                function showSuccess(message) {
                    const alertDiv = document.createElement('div');
                    alertDiv.className = 'alert alert-success alert-dismissible fade show';
                    alertDiv.innerHTML = `
                        ${message}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    `;
                    document.querySelector('main').insertBefore(alertDiv, document.querySelector('main').firstChild);
                    
                    setTimeout(() => alertDiv.remove(), 3000);
                }

                /**
                 * 退出登录
                 */
                window.logout = async function() {
                    if (!confirm('确定要退出登录吗？')) {
                        return;
                    }
                    
                    try {
                        const currentToken = localStorage.getItem('his_token');
                        if (currentToken) {
                            try {
                                await fetch('/api/v1/auth/logout', {
                                    method: 'POST',
                                    headers: {
                                        'Authorization': `Bearer ${currentToken}`,
                                        'Content-Type': 'application/json'
                                    }
                                });
                            } catch (error) {
                                console.warn('调用登出API失败（继续清除本地数据）:', error);
                            }
                        }
                    } catch (error) {
                        console.warn('登出API调用失败（继续清除本地数据）:', error);
                    }
                    
                    localStorage.removeItem('his_token');
                    localStorage.removeItem('his_refresh_token');
                    localStorage.removeItem('his_user');
                    
                    window.location.href = '/platform-login.html';
                }
                
                /**
                 * 显示错误消息
                 */
                function showError(message) {
                    const alertDiv = document.createElement('div');
                    alertDiv.className = 'alert alert-danger alert-dismissible fade show';
                    alertDiv.innerHTML = `
                        ${message}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    `;
                    document.querySelector('main').insertBefore(alertDiv, document.querySelector('main').firstChild);
                    
                    setTimeout(() => alertDiv.remove(), 5000);
                }
                
                // 页面加载完成后自动加载租户列表
                // 注意：所有函数已定义完成，现在可以安全调用
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', function() {
                        window.loadTenants();
                    });
                } else {
                    // DOM 已经加载完成
                    window.loadTenants();
                }
            }
            
            // 开始检查 API 是否已加载
            checkAPILoaded();
        })();
    </script>
</body>
</html>

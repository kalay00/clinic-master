<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>审计日志 - 平台管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../css/main.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        :root {
            --primary-dark: #0f172a;
            --primary-blue: #1e40af;
            --primary-gradient: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #3b82f6 100%);
            --sidebar-gradient: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            --accent-gold: #f59e0b;
            --accent-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.07), 0 10px 15px rgba(0, 0, 0, 0.1);
            --card-shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.15), 0 20px 40px rgba(0, 0, 0, 0.1);
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --bg-light: #f8fafc;
            --bg-white: #ffffff;
        }
        
        body {
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 50%, #cbd5e1 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(30, 64, 175, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        
        .container-fluid {
            position: relative;
            z-index: 1;
        }
        
        /* 侧边栏样式 - 与dashboard.html一致 */
        .sidebar {
            min-height: 100vh;
            background: var(--sidebar-gradient);
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        .sidebar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(245, 158, 11, 0.05) 100%);
            pointer-events: none;
        }
        
        .sidebar .brand {
            padding: 2rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
        }
        
        .sidebar .brand h4 {
            color: white;
            font-weight: 700;
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .sidebar .brand h4 i {
            font-size: 1.75rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .sidebar .brand small {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 0.25rem;
            display: block;
        }
        
        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.75);
            padding: 0.875rem 1.5rem;
            border-radius: 0.75rem;
            margin: 0.375rem 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
            font-size: 0.9375rem;
            position: relative;
            z-index: 1;
            border: 1px solid transparent;
        }
        
        .sidebar .nav-link::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 0;
            background: var(--accent-gradient);
            border-radius: 0 3px 3px 0;
            transition: height 0.3s ease;
        }
        
        .sidebar .nav-link:hover {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            transform: translateX(4px);
            border-color: rgba(255, 255, 255, 0.1);
        }
        
        .sidebar .nav-link.active {
            background: rgba(59, 130, 246, 0.15);
            color: white;
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }
        
        .sidebar .nav-link.active::before {
            height: 60%;
        }
        
        .sidebar .nav-link i {
            width: 22px;
            margin-right: 0.875rem;
            font-size: 1.125rem;
        }
        
        .sidebar .user-info {
            padding: 1.5rem;
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1;
        }
        
        .sidebar .user-info .user-name {
            color: white;
            font-weight: 600;
            margin-bottom: 0.25rem;
            font-size: 0.9375rem;
        }
        
        .sidebar .user-info .user-role {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8125rem;
            font-weight: 400;
        }
        
        .sidebar .user-info .btn {
            border-radius: 0.5rem;
            font-weight: 500;
            font-size: 0.875rem;
            padding: 0.5rem 1rem;
            transition: all 0.3s ease;
        }
        
        .sidebar .user-info .btn-light {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        .sidebar .user-info .btn-light:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
        
        .sidebar .user-info .btn-outline-light {
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .sidebar .user-info .btn-outline-light:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        /* 主内容区 */
        .main-content {
            background: transparent;
            padding: 2.5rem;
        }
        
        .page-header {
            background: var(--bg-white);
            padding: 2rem 2.5rem;
            border-radius: 1rem;
            box-shadow: var(--card-shadow);
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }
        
        .page-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--primary-gradient);
        }
        
        .page-header h1 {
            color: var(--text-primary);
            font-weight: 700;
            margin: 0;
            font-size: 2rem;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .page-header h1 i {
            color: var(--primary-blue);
        }
        
        /* 内容卡片 */
        .content-card {
            background: var(--bg-white);
            border-radius: 1rem;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .content-card:hover {
            box-shadow: var(--card-shadow-lg);
        }
        
        .content-card .card-header {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 1.5rem 2rem;
            font-weight: 600;
            font-size: 1.125rem;
            position: relative;
        }
        
        .content-card .card-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }
        
        .content-card .card-header h5 {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 600;
        }
        
        .content-card .card-body {
            padding: 2rem;
        }
        
        .table {
            margin-bottom: 0;
        }
        
        .table thead {
            background: var(--bg-light);
        }
        
        .table thead th {
            font-weight: 600;
            color: var(--text-primary);
            text-transform: uppercase;
            font-size: 0.8125rem;
            letter-spacing: 0.5px;
            padding: 1rem;
            border-bottom: 2px solid var(--border-color);
        }
        
        .table tbody td {
            padding: 1rem;
            color: var(--text-primary);
            vertical-align: middle;
        }
        
        .table tbody tr {
            transition: all 0.2s ease;
        }
        
        .table tbody tr:hover {
            background: var(--bg-light);
        }
        
        .badge {
            padding: 0.375rem 0.75rem;
            font-weight: 600;
            font-size: 0.75rem;
            border-radius: 0.375rem;
        }
        
        .form-label {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            font-size: 0.9375rem;
        }
        
        .form-control {
            border-radius: 0.625rem;
            border: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
            font-size: 0.9375rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .btn-primary {
            background: var(--primary-gradient);
            border: none;
            border-radius: 0.625rem;
            padding: 0.75rem 1.75rem;
            font-weight: 600;
            font-size: 0.9375rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            <!-- 侧边栏 -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar">
                <div class="d-flex flex-column h-100">
                    <div class="brand">
                        <h4><i class="bi bi-shield-lock-fill"></i> 平台管理</h4>
                        <small>Platform Administration</small>
                    </div>
                    <ul class="nav flex-column flex-grow-1">
                        <li class="nav-item">
                            <a class="nav-link" href="dashboard.html">
                                <i class="bi bi-speedometer2"></i> 仪表板
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="tenants.html">
                                <i class="bi bi-building"></i> 租户管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="statistics.html">
                                <i class="bi bi-graph-up"></i> 平台统计
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="audit.html">
                                <i class="bi bi-file-text"></i> 审计日志
                            </a>
                        </li>
                    </ul>
                    <div class="user-info">
                        <div class="d-flex align-items-center mb-3">
                            <div class="flex-grow-1">
                                <div id="currentUser" class="user-name"></div>
                                <div id="currentUserRole" class="user-role">平台管理员</div>
                            </div>
                        </div>
                        <div class="d-grid gap-2">
                            <button class="btn btn-sm btn-light" onclick="window.location.href='dashboard.html'">
                                <i class="bi bi-key"></i> 修改密码
                            </button>
                            <button class="btn btn-sm btn-outline-light" onclick="logout()">
                                <i class="bi bi-box-arrow-right"></i> 退出登录
                            </button>
                        </div>
                    </div>
                </div>
            </nav>

            <!-- 主内容区 -->
            <main class="col-md-9 ms-sm-auto col-lg-10 main-content">
                <div class="page-header">
                    <h1><i class="bi bi-file-text"></i> 审计日志</h1>
                </div>

                <!-- 筛选条件 -->
                <div class="content-card mb-4">
                    <div class="card-body">
                        <form id="filterForm" class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label">租户</label>
                                <input type="text" class="form-control" id="filterTenant" placeholder="租户名称">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">用户</label>
                                <input type="text" class="form-control" id="filterUser" placeholder="用户名称">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">资源类型</label>
                                <select class="form-control" id="filterResourceType">
                                    <option value="">全部</option>
                                    <option value="patient">患者</option>
                                    <option value="registration">挂号</option>
                                    <option value="medical_record">病历</option>
                                    <option value="prescription">处方</option>
                                    <option value="bill">账单</option>
                                    <option value="user">用户</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">操作类型</label>
                                <select class="form-control" id="filterOperationType">
                                    <option value="">全部</option>
                                    <option value="create">创建</option>
                                    <option value="update">更新</option>
                                    <option value="delete">删除</option>
                                    <option value="query">查询</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">开始日期</label>
                                <input type="date" class="form-control" id="filterStartDate">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">结束日期</label>
                                <input type="date" class="form-control" id="filterEndDate">
                            </div>
                            <div class="col-md-12">
                                <button type="button" class="btn btn-primary" onclick="window.loadLogs()">
                                    <i class="bi bi-search"></i> 查询
                                </button>
                                <button type="button" class="btn btn-secondary ms-2" onclick="window.resetFilters()">
                                    <i class="bi bi-arrow-clockwise"></i> 重置
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 日志列表 -->
                <div class="content-card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-list-ul"></i> 操作日志列表</h5>
                    </div>
                    <div class="card-body">
                        <div id="logsContainer">
                            <div class="text-center py-5">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">加载中...</span>
                                </div>
                            </div>
                        </div>
                        <nav id="paginationContainer" aria-label="分页导航"></nav>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script>
        // 将变量挂载到 window 对象，确保全局可访问
        window.auditLogs = {
            currentPage: 1,
            pageSize: 20
        };
        
        // 等待 API 加载完成
        (function() {
            function checkAPILoaded() {
                if (typeof window.PlatformAPI === 'undefined') {
                    setTimeout(checkAPILoaded, 50);
                    return;
                }
                initPage();
            }
            
            function initPage() {
                // 检查登录状态
                const token = localStorage.getItem('his_token');
                const user = JSON.parse(localStorage.getItem('his_user') || '{}');
                
                if (!token || user.role !== 'platform_admin') {
                    window.location.href = '/platform-login.html';
                    return;
                }
                
                // 显示当前用户信息
                if (user.username) {
                    document.getElementById('currentUser').textContent = user.real_name || user.username;
                }
                
                // 设置默认日期（最近7天）
                const endDate = new Date();
                const startDate = new Date();
                startDate.setDate(startDate.getDate() - 7);
                
                document.getElementById('filterStartDate').value = startDate.toISOString().split('T')[0];
                document.getElementById('filterEndDate').value = endDate.toISOString().split('T')[0];
                
                // 加载日志
                if (typeof window.loadLogs === 'function') {
                    window.loadLogs();
                } else {
                    console.error('loadLogs 函数未定义');
                }
            }
            
            // 定义所有全局函数（避免重复定义）
            let isLoadingLogs = false; // 防止重复调用
            
            window.loadLogs = async function(page = 1) {
                // 防止重复调用
                if (isLoadingLogs) {
                    console.log('loadLogs 正在执行，跳过重复调用');
                    return;
                }
                
                console.log('loadLogs 被调用，页码:', page);
                isLoadingLogs = true;
                
                if (!window.auditLogs) {
                    window.auditLogs = { currentPage: 1, pageSize: 20 };
                }
                
                window.auditLogs.currentPage = page;
                
                try {
                    // 显示加载状态
                    const container = document.getElementById('logsContainer');
                    if (container) {
                        container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">加载中...</span></div></div>';
                    }
                    
                    const filters = {
                        page: page,
                        page_size: window.auditLogs.pageSize
                    };
                    
                    const tenantName = document.getElementById('filterTenant')?.value?.trim() || '';
                    const userName = document.getElementById('filterUser')?.value?.trim() || '';
                    const resourceType = document.getElementById('filterResourceType')?.value || '';
                    const operationType = document.getElementById('filterOperationType')?.value || '';
                    const startDate = document.getElementById('filterStartDate')?.value || '';
                    const endDate = document.getElementById('filterEndDate')?.value || '';
                    
                    if (resourceType) filters.resource_type = resourceType;
                    if (operationType) filters.operation_type = operationType;
                    if (startDate) filters.start_date = startDate;
                    if (endDate) filters.end_date = endDate;
                    
                    console.log('查询参数:', filters);
                    
                    if (typeof window.PlatformAPI === 'undefined') {
                        throw new Error('PlatformAPI 未加载');
                    }
                    
                    const response = await window.PlatformAPI.getAuditLogs(filters);
                    console.log('API响应:', response);
                    console.log('API响应类型:', typeof response);
                    console.log('API响应数据结构:', JSON.stringify(response, null, 2));
                    
                    let logs = [];
                    let pagination = {};
                    
                    // 解析响应数据（ApiClient.request 返回 data.data || data）
                    if (response && response.code === 200) {
                        // 标准响应格式: {code: 200, data: {items: [], pagination: {}}}
                        logs = response.data?.items || [];
                        pagination = response.data?.pagination || {};
                        console.log('使用标准响应格式，items数量:', logs.length);
                    } else if (response && response.data) {
                        // 直接数据格式: {data: {items: [], pagination: {}}}
                        logs = response.data.items || [];
                        pagination = response.data.pagination || {};
                        console.log('使用直接数据格式，items数量:', logs.length);
                    } else if (response && response.items !== undefined) {
                        // 直接格式: {items: [], pagination: {}} (ApiClient已解包)
                        logs = response.items || [];
                        pagination = response.pagination || {};
                        console.log('使用直接格式（已解包），items数量:', logs.length);
                    } else if (Array.isArray(response)) {
                        // 数组格式: []
                        logs = response;
                        console.log('使用数组格式，items数量:', logs.length);
                    } else {
                        console.warn('未知的响应格式:', response);
                    }
                    
                    // 修复分页字段：后端返回的是 pages，前端需要 total_pages
                    if (pagination.pages !== undefined && pagination.total_pages === undefined) {
                        pagination.total_pages = pagination.pages;
                    }
                    
                    console.log('解析后的日志数量:', logs.length);
                    console.log('分页信息:', pagination);
                    
                    // 过滤租户和用户名称（前端过滤，因为API可能不支持）
                    if (tenantName) {
                        logs = logs.filter(log => 
                            log.tenant_name && log.tenant_name.includes(tenantName)
                        );
                    }
                    if (userName) {
                        logs = logs.filter(log => 
                            log.user_name && log.user_name.includes(userName)
                        );
                    }
                    
                    if (typeof window.renderLogs === 'function') {
                        window.renderLogs(logs);
                    } else {
                        console.error('renderLogs 函数未定义');
                    }
                    
                    if (typeof window.renderPagination === 'function') {
                        window.renderPagination(pagination);
                    } else {
                        console.error('renderPagination 函数未定义');
                    }
                } catch (error) {
                    console.error('加载日志失败:', error);
                    console.error('错误堆栈:', error.stack);
                    const container = document.getElementById('logsContainer');
                    if (container) {
                        container.innerHTML = '<div class="alert alert-danger">加载日志失败: ' + (error.message || '未知错误') + '</div>';
                    }
                } finally {
                    isLoadingLogs = false;
                }
            }
            
            window.getOperationTypeBadge = function(type) {
                const badges = {
                    'create': '<span class="badge bg-success">创建</span>',
                    'update': '<span class="badge bg-primary">更新</span>',
                    'delete': '<span class="badge bg-danger">删除</span>',
                    'query': '<span class="badge bg-info">查询</span>'
                };
                return badges[type] || `<span class="badge bg-secondary">${type || '未知'}</span>`;
            }
            
            window.getResourceTypeBadge = function(type) {
                const badges = {
                    'patient': '<span class="badge bg-info">患者</span>',
                    'registration': '<span class="badge bg-primary">挂号</span>',
                    'medical_record': '<span class="badge bg-success">病历</span>',
                    'prescription': '<span class="badge bg-warning">处方</span>',
                    'bill': '<span class="badge bg-danger">账单</span>',
                    'user': '<span class="badge bg-secondary">用户</span>'
                };
                return badges[type] || `<span class="badge bg-secondary">${type || '未知'}</span>`;
            }
            
            window.renderLogs = function(logs) {
                const container = document.getElementById('logsContainer');
                
                if (!container) {
                    console.error('logsContainer 元素不存在');
                    return;
                }
                
                if (logs.length === 0) {
                    container.innerHTML = '<div class="alert alert-info">暂无日志数据</div>';
                    return;
                }
                
                let html = '<div class="table-responsive"><table class="table table-hover">';
                html += '<thead><tr>';
                html += '<th>时间</th>';
                html += '<th>租户</th>';
                html += '<th>用户</th>';
                html += '<th>操作类型</th>';
                html += '<th>资源类型</th>';
                html += '<th>操作描述</th>';
                html += '<th>IP地址</th>';
                html += '<th>状态</th>';
                html += '</tr></thead><tbody>';
                
                logs.forEach(log => {
                    const statusBadge = log.status === 'success' 
                        ? '<span class="badge bg-success">成功</span>'
                        : '<span class="badge bg-danger">失败</span>';
                    
                    const operationTypeBadge = window.getOperationTypeBadge(log.operation_type);
                    const resourceTypeBadge = window.getResourceTypeBadge(log.resource_type);
                    
                    const timeStr = log.created_at 
                        ? new Date(log.created_at).toLocaleString('zh-CN')
                        : '-';
                    
                    html += '<tr>';
                    html += `<td>${timeStr}</td>`;
                    html += `<td>${log.tenant_name || '系统'}</td>`;
                    html += `<td>${log.user_name || '未知'}</td>`;
                    html += `<td>${operationTypeBadge}</td>`;
                    html += `<td>${resourceTypeBadge}</td>`;
                    html += `<td>${log.operation_desc || '-'}</td>`;
                    html += `<td>${log.ip_address || '-'}</td>`;
                    html += `<td>${statusBadge}</td>`;
                    html += '</tr>';
                });
                
                html += '</tbody></table></div>';
                container.innerHTML = html;
            }
            
            window.renderPagination = function(pagination) {
                const container = document.getElementById('paginationContainer');
                if (!container) {
                    console.error('paginationContainer 元素不存在');
                    return;
                }
                
                // 支持两种分页字段名称：pages 和 total_pages
                const totalPages = pagination.total_pages || pagination.pages || 1;
                const currentPage = window.auditLogs?.currentPage || 1;
                
                if (totalPages <= 1) {
                    container.innerHTML = '';
                    return;
                }
                
                let html = '<ul class="pagination justify-content-center">';
                
                // 上一页
                html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">`;
                html += `<a class="page-link" href="#" onclick="window.loadLogs(${currentPage - 1}); return false;">上一页</a>`;
                html += '</li>';
                
                // 页码
                for (let i = 1; i <= totalPages; i++) {
                    if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                        html += `<li class="page-item ${i === currentPage ? 'active' : ''}">`;
                        html += `<a class="page-link" href="#" onclick="window.loadLogs(${i}); return false;">${i}</a>`;
                        html += '</li>';
                    } else if (i === currentPage - 3 || i === currentPage + 3) {
                        html += '<li class="page-item disabled"><span class="page-link">...</span></li>';
                    }
                }
                
                // 下一页
                html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">`;
                html += `<a class="page-link" href="#" onclick="window.loadLogs(${currentPage + 1}); return false;">下一页</a>`;
                html += '</li>';
                
                html += '</ul>';
                container.innerHTML = html;
            }
            
            window.resetFilters = function() {
                document.getElementById('filterTenant').value = '';
                document.getElementById('filterUser').value = '';
                document.getElementById('filterResourceType').value = '';
                document.getElementById('filterOperationType').value = '';
                
                const endDate = new Date();
                const startDate = new Date();
                startDate.setDate(startDate.getDate() - 7);
                
                document.getElementById('filterStartDate').value = startDate.toISOString().split('T')[0];
                document.getElementById('filterEndDate').value = endDate.toISOString().split('T')[0];
                
                window.loadLogs(1);
            }
            
            window.logout = async function() {
                if (!confirm('确定要退出登录吗？')) {
                    return;
                }
                
                try {
                    const currentToken = localStorage.getItem('his_token');
                    if (currentToken) {
                        try {
                            await fetch('/api/v1/auth/logout', {
                                method: 'POST',
                                headers: {
                                    'Authorization': `Bearer ${currentToken}`,
                                    'Content-Type': 'application/json'
                                }
                            });
                        } catch (error) {
                            console.warn('调用登出API失败（继续清除本地数据）:', error);
                        }
                    }
                } catch (error) {
                    console.warn('登出API调用失败（继续清除本地数据）:', error);
                }
                
                localStorage.removeItem('his_token');
                localStorage.removeItem('his_refresh_token');
                localStorage.removeItem('his_user');
                
                window.location.href = '/platform-login.html';
            }
            
            checkAPILoaded();
        })();
    </script>
</body>
</html>

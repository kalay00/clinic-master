<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平台管理 - 仪表板</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../css/main.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        :root {
            --primary-dark: #0f172a;
            --primary-blue: #1e40af;
            --primary-gradient: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #3b82f6 100%);
            --sidebar-gradient: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            --accent-gold: #f59e0b;
            --accent-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --card-shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.24);
            --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.07), 0 10px 15px rgba(0, 0, 0, 0.1);
            --card-shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.15), 0 20px 40px rgba(0, 0, 0, 0.1);
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --bg-light: #f8fafc;
            --bg-white: #ffffff;
        }
        
        body {
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 50%, #cbd5e1 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(30, 64, 175, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        
        .container-fluid {
            position: relative;
            z-index: 1;
        }
        
        /* 侧边栏 - 高端深色设计 */
        .sidebar {
            min-height: 100vh;
            background: var(--sidebar-gradient);
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        .sidebar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(245, 158, 11, 0.05) 100%);
            pointer-events: none;
        }
        
        .sidebar .brand {
            padding: 2rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
        }
        
        .sidebar .brand h4 {
            color: white;
            font-weight: 700;
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .sidebar .brand h4 i {
            font-size: 1.75rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .sidebar .brand small {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 0.25rem;
            display: block;
        }
        
        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.75);
            padding: 0.875rem 1.5rem;
            border-radius: 0.75rem;
            margin: 0.375rem 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
            font-size: 0.9375rem;
            position: relative;
            z-index: 1;
            border: 1px solid transparent;
        }
        
        .sidebar .nav-link::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 0;
            background: var(--accent-gradient);
            border-radius: 0 3px 3px 0;
            transition: height 0.3s ease;
        }
        
        .sidebar .nav-link:hover {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            transform: translateX(4px);
            border-color: rgba(255, 255, 255, 0.1);
        }
        
        .sidebar .nav-link.active {
            background: rgba(59, 130, 246, 0.15);
            color: white;
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }
        
        .sidebar .nav-link.active::before {
            height: 60%;
        }
        
        .sidebar .nav-link i {
            width: 22px;
            margin-right: 0.875rem;
            font-size: 1.125rem;
        }
        
        .sidebar .user-info {
            padding: 1.5rem;
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1;
        }
        
        .sidebar .user-info .user-name {
            color: white;
            font-weight: 600;
            margin-bottom: 0.25rem;
            font-size: 0.9375rem;
        }
        
        .sidebar .user-info .user-role {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8125rem;
            font-weight: 400;
        }
        
        .sidebar .user-info .btn {
            border-radius: 0.5rem;
            font-weight: 500;
            font-size: 0.875rem;
            padding: 0.5rem 1rem;
            transition: all 0.3s ease;
        }
        
        .sidebar .user-info .btn-light {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        .sidebar .user-info .btn-light:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
        
        .sidebar .user-info .btn-outline-light {
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .sidebar .user-info .btn-outline-light:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        /* 主内容区 */
        .main-content {
            background: transparent;
            padding: 2.5rem;
        }
        
        .page-header {
            background: var(--bg-white);
            padding: 2rem 2.5rem;
            border-radius: 1rem;
            box-shadow: var(--card-shadow);
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }
        
        .page-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--primary-gradient);
        }
        
        .page-header h1 {
            color: var(--text-primary);
            font-weight: 700;
            margin: 0;
            font-size: 2rem;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .page-header h1 i {
            color: var(--primary-blue);
        }
        
        .page-header .text-muted {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9375rem;
        }
        
        /* 统计卡片 - 高端设计 */
        .stat-card {
            background: var(--bg-white);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: var(--card-shadow);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            height: 100%;
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: var(--primary-gradient);
            transition: width 0.3s ease;
        }
        
        .stat-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            transition: transform 0.4s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--card-shadow-lg);
            border-color: rgba(59, 130, 246, 0.2);
        }
        
        .stat-card:hover::before {
            width: 6px;
        }
        
        .stat-card:hover::after {
            transform: scale(1.2);
        }
        
        .stat-card.success::before {
            background: linear-gradient(180deg, #10b981 0%, #059669 100%);
        }
        
        .stat-card.success::after {
            background: radial-gradient(circle, rgba(16, 185, 129, 0.05) 0%, transparent 70%);
        }
        
        .stat-card.warning::before {
            background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
        }
        
        .stat-card.warning::after {
            background: radial-gradient(circle, rgba(245, 158, 11, 0.05) 0%, transparent 70%);
        }
        
        .stat-card.danger::before {
            background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%);
        }
        
        .stat-card.danger::after {
            background: radial-gradient(circle, rgba(239, 68, 68, 0.05) 0%, transparent 70%);
        }
        
        .stat-card .stat-icon {
            width: 72px;
            height: 72px;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover .stat-icon {
            transform: scale(1.1) rotate(5deg);
        }
        
        .stat-card.success .stat-icon {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        
        .stat-card.warning .stat-icon {
            background: var(--accent-gradient);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }
        
        .stat-card.danger .stat-icon {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }
        
        .stat-card .stat-label {
            color: var(--text-secondary);
            font-size: 0.8125rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
        }
        
        .stat-card .stat-value {
            color: var(--text-primary);
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0;
            line-height: 1.2;
            letter-spacing: -1px;
            position: relative;
            z-index: 1;
        }
        
        /* 特定卡片的白色字体 */
        .stat-card.success .stat-value,
        .stat-card.danger .stat-value {
            color: white;
        }
        
        /* 特定卡片ID的白色字体 */
        #activeTenants,
        #totalPatients {
            color: white !important;
        }
        
        /* 内容卡片 */
        .content-card {
            background: var(--bg-white);
            border-radius: 1rem;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .content-card:hover {
            box-shadow: var(--card-shadow-lg);
        }
        
        .content-card .card-header {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 1.5rem 2rem;
            font-weight: 600;
            font-size: 1.125rem;
            position: relative;
        }
        
        .content-card .card-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }
        
        .content-card .card-header h5 {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 600;
        }
        
        .content-card .card-body {
            padding: 2rem;
        }
        
        /* 按钮样式 */
        .btn-primary {
            background: var(--primary-gradient);
            border: none;
            border-radius: 0.625rem;
            padding: 0.75rem 1.75rem;
            font-weight: 600;
            font-size: 0.9375rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }
        
        .btn-primary:hover::before {
            width: 300px;
            height: 300px;
        }
        
        .btn-primary i {
            position: relative;
            z-index: 1;
        }
        
        .btn-primary span {
            position: relative;
            z-index: 1;
        }
        
        /* 列表项样式 */
        .list-group-item {
            border: none;
            border-bottom: 1px solid var(--border-color);
            padding: 1.25rem;
            transition: all 0.3s ease;
            background: transparent;
        }
        
        .list-group-item:hover {
            background: var(--bg-light);
            transform: translateX(8px);
            border-left: 3px solid var(--primary-blue);
            padding-left: calc(1.25rem - 3px);
        }
        
        .list-group-item:last-child {
            border-bottom: none;
        }
        
        .list-group-item .fw-bold {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.9375rem;
        }
        
        .list-group-item .text-muted {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        
        .list-group-item code {
            background: var(--bg-light);
            color: var(--primary-blue);
            padding: 0.25rem 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.8125rem;
            font-weight: 600;
        }
        
        /* 模态框样式 */
        .modal-content {
            border-radius: 1rem;
            border: none;
            box-shadow: var(--card-shadow-lg);
            overflow: hidden;
        }
        
        .modal-header {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 1.5rem 2rem;
        }
        
        .modal-header .modal-title {
            font-weight: 600;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .modal-body {
            padding: 2rem;
        }
        
        .modal-footer {
            border-top: 1px solid var(--border-color);
            padding: 1.5rem 2rem;
        }
        
        .form-label {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            font-size: 0.9375rem;
        }
        
        .form-control {
            border-radius: 0.625rem;
            border: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
            font-size: 0.9375rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .main-content {
                padding: 1.5rem;
            }
            
            .page-header {
                padding: 1.5rem;
            }
            
            .stat-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            <!-- 侧边栏 -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar">
                <div class="d-flex flex-column h-100">
                    <div class="brand">
                        <h4><i class="bi bi-shield-lock-fill"></i> 平台管理</h4>
                        <small>Platform Administration</small>
                    </div>
                    <ul class="nav flex-column flex-grow-1">
                        <li class="nav-item">
                            <a class="nav-link active" href="dashboard.html">
                                <i class="bi bi-speedometer2"></i> 仪表板
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="tenants.html">
                                <i class="bi bi-building"></i> 租户管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="statistics.html">
                                <i class="bi bi-graph-up"></i> 平台统计
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="audit.html">
                                <i class="bi bi-file-text"></i> 审计日志
                            </a>
                        </li>
                    </ul>
                    <div class="user-info">
                        <div class="d-flex align-items-center mb-3">
                            <div class="flex-grow-1">
                                <div id="currentUser" class="user-name"></div>
                                <div id="currentUserRole" class="user-role">平台管理员</div>
                            </div>
                        </div>
                        <div class="d-grid gap-2">
                            <button class="btn btn-sm btn-light" onclick="showChangePasswordModal()">
                                <i class="bi bi-key"></i> 修改密码
                            </button>
                            <button class="btn btn-sm btn-outline-light" onclick="logout()">
                                <i class="bi bi-box-arrow-right"></i> 退出登录
                            </button>
                        </div>
                    </div>
                </div>
            </nav>

            <!-- 主内容区 -->
            <main class="col-md-9 ms-sm-auto col-lg-10 main-content">
                <div class="page-header">
                    <div class="d-flex justify-content-between align-items-center">
                        <h1><i class="bi bi-speedometer2"></i> 平台管理仪表板</h1>
                        <div class="text-muted">
                            <i class="bi bi-calendar3"></i> <span id="systemTime">-</span>
                        </div>
                    </div>
                </div>

                <!-- 统计卡片 -->
                <div class="row g-4 mb-4">
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div class="flex-grow-1">
                                    <div class="stat-label">总租户数</div>
                                    <h3 class="stat-value mb-0" id="totalTenants">-</h3>
                                </div>
                                <div class="stat-icon">
                                    <i class="bi bi-building"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card success">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div class="flex-grow-1">
                                    <div class="stat-label">活跃租户</div>
                                    <h3 class="stat-value mb-0" id="activeTenants">-</h3>
                                </div>
                                <div class="stat-icon">
                                    <i class="bi bi-check-circle-fill"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card warning">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div class="flex-grow-1">
                                    <div class="stat-label">总用户数</div>
                                    <h3 class="stat-value mb-0" id="totalUsers">-</h3>
                                </div>
                                <div class="stat-icon">
                                    <i class="bi bi-people-fill"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card danger">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div class="flex-grow-1">
                                    <div class="stat-label">总患者数</div>
                                    <h3 class="stat-value mb-0" id="totalPatients">-</h3>
                                </div>
                                <div class="stat-icon">
                                    <i class="bi bi-person-heart"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 最近租户 -->
                <div class="row g-4">
                    <div class="col-md-8">
                        <div class="content-card">
                            <div class="card-header">
                                <h5 class="mb-0"><i class="bi bi-building"></i> 最近创建的租户</h5>
                            </div>
                            <div class="card-body">
                                <div id="recentTenantsContainer">
                                    <div class="text-center py-5">
                                        <div class="spinner-border text-primary" role="status">
                                            <span class="visually-hidden">加载中...</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="content-card">
                            <div class="card-header">
                                <h5 class="mb-0"><i class="bi bi-info-circle"></i> 系统信息</h5>
                            </div>
                            <div class="card-body">
                                <dl class="row mb-0">
                                    <dt class="col-sm-6 fw-normal text-muted">平台版本</dt>
                                    <dd class="col-sm-6 fw-semibold">v1.0.0</dd>
                                    
                                    <dt class="col-sm-6 fw-normal text-muted">系统时间</dt>
                                    <dd class="col-sm-6 fw-semibold" id="systemTime2">-</dd>
                                    
                                    <dt class="col-sm-6 fw-normal text-muted">最后登录</dt>
                                    <dd class="col-sm-6 fw-semibold" id="lastLogin">-</dd>
                                </dl>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- 修改密码模态框 -->
    <div class="modal fade" id="changePasswordModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-key"></i> 修改密码</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="changePasswordForm">
                        <div class="mb-4">
                            <label class="form-label">旧密码 <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="oldPassword" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">新密码 <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="newPassword" required minlength="6">
                            <small class="text-muted">密码长度至少为6位</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">确认新密码 <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="confirmPassword" required minlength="6">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="savePassword()">
                        <i class="bi bi-save"></i> <span>保存</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script>
        // 等待 API 加载完成
        (function() {
            // 检查 PlatformAPI 是否已加载
            function checkAPILoaded() {
                if (typeof window.PlatformAPI === 'undefined') {
                    setTimeout(checkAPILoaded, 50);
                    return;
                }
                // API 已加载，初始化页面
                initPage();
            }
            
            function initPage() {
                // 检查登录状态
                const token = localStorage.getItem('his_token');
                const user = JSON.parse(localStorage.getItem('his_user') || '{}');
                
                if (!token || user.role !== 'platform_admin') {
                    window.location.href = '/platform-login.html';
                    return;
                }
                
                // 显示当前用户信息
                if (user.username) {
                    document.getElementById('currentUser').textContent = user.real_name || user.username;
                }
                
                // 更新系统时间
                function updateSystemTime() {
                    const now = new Date();
                    const timeStr = now.toLocaleString('zh-CN');
                    document.getElementById('systemTime').textContent = timeStr;
                    document.getElementById('systemTime2').textContent = timeStr;
                }
                updateSystemTime();
                setInterval(updateSystemTime, 1000);
                
                /**
                 * 加载统计数据
                 */
                async function loadStatistics() {
                    try {
                        // 并行加载租户列表和平台统计数据
                        const [tenantsResponse, statsResponse] = await Promise.all([
                            PlatformAPI.getTenants({ page_size: 1000 }),
                            PlatformAPI.getStatistics().catch(err => {
                                console.warn('获取平台统计数据失败:', err);
                                return null;
                            })
                        ]);
                        
                        // 处理租户数据
                        let tenants = [];
                        if (tenantsResponse && tenantsResponse.code === 200) {
                            tenants = tenantsResponse.data?.items || tenantsResponse.data || [];
                        } else if (Array.isArray(tenantsResponse)) {
                            tenants = tenantsResponse;
                        } else if (tenantsResponse && tenantsResponse.items) {
                            tenants = tenantsResponse.items;
                        } else if (tenantsResponse && tenantsResponse.data) {
                            tenants = Array.isArray(tenantsResponse.data) ? tenantsResponse.data : (tenantsResponse.data.items || []);
                        }
                        
                        const activeTenants = tenants.filter(t => t.status === 'active');
                        
                        document.getElementById('totalTenants').textContent = tenants.length;
                        document.getElementById('activeTenants').textContent = activeTenants.length;
                        
                        // 处理平台统计数据
                        if (statsResponse) {
                            let stats = {};
                            if (statsResponse && statsResponse.code === 200) {
                                stats = statsResponse.data || statsResponse;
                            } else if (statsResponse && statsResponse.data) {
                                stats = statsResponse.data;
                            } else {
                                stats = statsResponse;
                            }
                            
                            document.getElementById('totalUsers').textContent = stats.total_users || 0;
                            document.getElementById('totalPatients').textContent = stats.total_patients || 0;
                        } else {
                            document.getElementById('totalUsers').textContent = 0;
                            document.getElementById('totalPatients').textContent = 0;
                        }
                        
                        // 显示最近创建的租户
                        const recentTenants = tenants
                            .sort((a, b) => {
                                const dateA = a.created_at ? new Date(a.created_at) : new Date(0);
                                const dateB = b.created_at ? new Date(b.created_at) : new Date(0);
                                return dateB - dateA;
                            })
                            .slice(0, 5);
                        
                        renderRecentTenants(recentTenants);
                    } catch (error) {
                        console.error('加载统计数据失败:', error);
                        showError('网络错误，请稍后重试: ' + (error.message || '未知错误'));
                    }
                }
                
                /**
                 * 退出登录
                 */
                window.logout = async function() {
                    if (!confirm('确定要退出登录吗？')) {
                        return;
                    }
                    
                    try {
                        const currentToken = localStorage.getItem('his_token');
                        if (currentToken) {
                            try {
                                await fetch('/api/v1/auth/logout', {
                                    method: 'POST',
                                    headers: {
                                        'Authorization': `Bearer ${currentToken}`,
                                        'Content-Type': 'application/json'
                                    }
                                });
                            } catch (error) {
                                console.warn('调用登出API失败（继续清除本地数据）:', error);
                            }
                        }
                    } catch (error) {
                        console.warn('登出API调用失败（继续清除本地数据）:', error);
                    }
                    
                    localStorage.removeItem('his_token');
                    localStorage.removeItem('his_refresh_token');
                    localStorage.removeItem('his_user');
                    
                    window.location.href = '/platform-login.html';
                }
                
                /**
                 * 显示修改密码模态框
                 */
                window.showChangePasswordModal = function() {
                    document.getElementById('changePasswordForm').reset();
                    const modal = new bootstrap.Modal(document.getElementById('changePasswordModal'));
                    modal.show();
                }
                
                /**
                 * 保存密码
                 */
                window.savePassword = async function() {
                    const oldPassword = document.getElementById('oldPassword').value;
                    const newPassword = document.getElementById('newPassword').value;
                    const confirmPassword = document.getElementById('confirmPassword').value;
                    
                    if (!oldPassword || !newPassword || !confirmPassword) {
                        alert('请填写所有字段');
                        return;
                    }
                    
                    if (newPassword.length < 6) {
                        alert('新密码长度至少为6位');
                        return;
                    }
                    
                    if (newPassword !== confirmPassword) {
                        alert('两次输入的新密码不一致');
                        return;
                    }
                    
                    try {
                        const response = await PlatformAPI.changePassword(oldPassword, newPassword);
                        
                        if (response && response.code === 200) {
                            bootstrap.Modal.getInstance(document.getElementById('changePasswordModal')).hide();
                            alert('密码修改成功，请重新登录');
                            window.logout();
                        } else {
                            const errorMsg = response?.message || '修改密码失败';
                            alert(errorMsg);
                        }
                    } catch (error) {
                        console.error('修改密码失败:', error);
                        const errorMsg = error?.message || error?.response?.data?.message || '网络错误，请稍后重试';
                        alert('修改密码失败：' + errorMsg);
                    }
                }
                
                /**
                 * 渲染最近租户列表
                 */
                function renderRecentTenants(tenants) {
                    const container = document.getElementById('recentTenantsContainer');
                    
                    if (tenants.length === 0) {
                        container.innerHTML = '<div class="alert alert-info">暂无租户数据</div>';
                        return;
                    }
                    
                    let html = '<div class="list-group list-group-flush">';
                    tenants.forEach(tenant => {
                        const statusBadge = tenant.status === 'active' 
                            ? '<span class="badge bg-success">启用</span>'
                            : '<span class="badge bg-secondary">禁用</span>';
                        
                        const createdDate = tenant.created_at 
                            ? new Date(tenant.created_at).toLocaleDateString('zh-CN')
                            : '-';
                        
                        html += `
                            <div class="list-group-item d-flex justify-content-between align-items-start">
                                <div class="ms-2 me-auto">
                                    <div class="fw-bold">
                                        <i class="bi bi-building"></i> ${tenant.name}
                                        ${statusBadge}
                                    </div>
                                    <small class="text-muted">
                                        <code>${tenant.code}</code> | 创建于 ${createdDate}
                                    </small>
                                </div>
                                <a href="tenants.html" class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-arrow-right"></i>
                                </a>
                            </div>
                        `;
                    });
                    html += '</div>';
                    
                    container.innerHTML = html;
                }
                
                /**
                 * 显示错误消息
                 */
                function showError(message) {
                    const alertDiv = document.createElement('div');
                    alertDiv.className = 'alert alert-danger alert-dismissible fade show';
                    alertDiv.innerHTML = `
                        ${message}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    `;
                    document.querySelector('main').insertBefore(alertDiv, document.querySelector('main').firstChild);
                    
                    setTimeout(() => alertDiv.remove(), 5000);
                }
                
                // 页面加载时加载数据
                loadStatistics();
            }
            
            // 开始检查 API 是否已加载
            checkAPILoaded();
        })();
    </script>
</body>
</html>

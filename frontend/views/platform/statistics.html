<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平台统计 - 平台管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../css/main.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        :root {
            --primary-dark: #0f172a;
            --primary-blue: #1e40af;
            --primary-gradient: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #3b82f6 100%);
            --sidebar-gradient: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            --accent-gold: #f59e0b;
            --accent-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.07), 0 10px 15px rgba(0, 0, 0, 0.1);
            --card-shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.15), 0 20px 40px rgba(0, 0, 0, 0.1);
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --bg-light: #f8fafc;
            --bg-white: #ffffff;
        }
        
        body {
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 50%, #cbd5e1 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(30, 64, 175, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        
        .container-fluid {
            position: relative;
            z-index: 1;
        }
        
        /* 侧边栏样式 - 与dashboard.html一致 */
        .sidebar {
            min-height: 100vh;
            background: var(--sidebar-gradient);
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        .sidebar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(245, 158, 11, 0.05) 100%);
            pointer-events: none;
        }
        
        .sidebar .brand {
            padding: 2rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
        }
        
        .sidebar .brand h4 {
            color: white;
            font-weight: 700;
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .sidebar .brand h4 i {
            font-size: 1.75rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .sidebar .brand small {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 0.25rem;
            display: block;
        }
        
        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.75);
            padding: 0.875rem 1.5rem;
            border-radius: 0.75rem;
            margin: 0.375rem 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
            font-size: 0.9375rem;
            position: relative;
            z-index: 1;
            border: 1px solid transparent;
        }
        
        .sidebar .nav-link::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 0;
            background: var(--accent-gradient);
            border-radius: 0 3px 3px 0;
            transition: height 0.3s ease;
        }
        
        .sidebar .nav-link:hover {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            transform: translateX(4px);
            border-color: rgba(255, 255, 255, 0.1);
        }
        
        .sidebar .nav-link.active {
            background: rgba(59, 130, 246, 0.15);
            color: white;
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }
        
        .sidebar .nav-link.active::before {
            height: 60%;
        }
        
        .sidebar .nav-link i {
            width: 22px;
            margin-right: 0.875rem;
            font-size: 1.125rem;
        }
        
        .sidebar .user-info {
            padding: 1.5rem;
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1;
        }
        
        .sidebar .user-info .user-name {
            color: white;
            font-weight: 600;
            margin-bottom: 0.25rem;
            font-size: 0.9375rem;
        }
        
        .sidebar .user-info .user-role {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8125rem;
            font-weight: 400;
        }
        
        .sidebar .user-info .btn {
            border-radius: 0.5rem;
            font-weight: 500;
            font-size: 0.875rem;
            padding: 0.5rem 1rem;
            transition: all 0.3s ease;
        }
        
        .sidebar .user-info .btn-light {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        .sidebar .user-info .btn-light:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
        
        .sidebar .user-info .btn-outline-light {
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .sidebar .user-info .btn-outline-light:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        /* 主内容区 */
        .main-content {
            background: transparent;
            padding: 2.5rem;
        }
        
        .page-header {
            background: var(--bg-white);
            padding: 2rem 2.5rem;
            border-radius: 1rem;
            box-shadow: var(--card-shadow);
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }
        
        .page-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--primary-gradient);
        }
        
        .page-header h1 {
            color: var(--text-primary);
            font-weight: 700;
            margin: 0;
            font-size: 2rem;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .page-header h1 i {
            color: var(--primary-blue);
        }
        
        /* 统计卡片 */
        .stat-card {
            background: var(--bg-white);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: var(--card-shadow);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            height: 100%;
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: var(--primary-gradient);
            transition: width 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--card-shadow-lg);
            border-color: rgba(59, 130, 246, 0.2);
        }
        
        .stat-card:hover::before {
            width: 6px;
        }
        
        .stat-card.success::before {
            background: linear-gradient(180deg, #10b981 0%, #059669 100%);
        }
        
        .stat-card.warning::before {
            background: var(--accent-gradient);
        }
        
        .stat-card.danger::before {
            background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%);
        }
        
        .stat-card.info::before {
            background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%);
        }
        
        .stat-card .stat-icon {
            width: 72px;
            height: 72px;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover .stat-icon {
            transform: scale(1.1) rotate(5deg);
        }
        
        .stat-card.success .stat-icon {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        
        .stat-card.warning .stat-icon {
            background: var(--accent-gradient);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }
        
        .stat-card.danger .stat-icon {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }
        
        .stat-card.info .stat-icon {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        
        .stat-card .stat-label {
            color: var(--text-secondary);
            font-size: 0.8125rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
        }
        
        .stat-card .stat-value {
            color: var(--text-primary);
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0;
            line-height: 1.2;
            letter-spacing: -1px;
            position: relative;
            z-index: 1;
        }
        
        /* 特定卡片的白色字体 */
        .stat-card.success .stat-value,
        .stat-card.danger .stat-value {
            color: white;
        }
        
        /* 特定卡片ID的白色字体 - 确保覆盖 */
        #activeTenants,
        #todayRevenue,
        #totalMedicalRecords,
        #totalBills,
        #monthNewPatients {
            color: white !important;
        }
        
        /* 今日收入的span标签也需要白色 */
        #todayRevenue span {
            color: white !important;
        }
        
        .stat-card .stat-unit {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-left: 0.25rem;
        }
        
        /* 内容卡片 */
        .content-card {
            background: var(--bg-white);
            border-radius: 1rem;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .content-card:hover {
            box-shadow: var(--card-shadow-lg);
        }
        
        .content-card .card-header {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 1.5rem 2rem;
            font-weight: 600;
            font-size: 1.125rem;
            position: relative;
        }
        
        .content-card .card-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }
        
        .content-card .card-header h5 {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 600;
        }
        
        .content-card .card-body {
            padding: 2rem;
        }
        
        .chart-container {
            position: relative;
            height: 300px;
        }
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script>
        // 等待 API 加载完成
        (function() {
            function checkAPILoaded() {
                if (typeof window.PlatformAPI === 'undefined') {
                    setTimeout(checkAPILoaded, 50);
                    return;
                }
                initPage();
            }
            
            function initPage() {
                // 检查登录状态
                const token = localStorage.getItem('his_token');
                const user = JSON.parse(localStorage.getItem('his_user') || '{}');
                
                if (!token || user.role !== 'platform_admin') {
                    window.location.href = '/platform-login.html';
                    return;
                }
                
                // 显示当前用户信息
                if (user.username) {
                    document.getElementById('currentUser').textContent = user.real_name || user.username;
                }
                
                // 加载统计数据
                loadStatistics();
            }
            
            async function loadStatistics() {
                try {
                    const response = await PlatformAPI.getStatistics();
                    
                    let stats = {};
                    if (response && response.code === 200) {
                        stats = response.data || response;
                    } else if (response && response.data) {
                        stats = response.data;
                    } else {
                        stats = response;
                    }
                    
                    // 更新统计卡片
                    document.getElementById('totalTenants').textContent = stats.total_tenants || 0;
                    document.getElementById('activeTenants').textContent = stats.active_tenants || 0;
                    document.getElementById('totalUsers').textContent = stats.total_users || 0;
                    document.getElementById('totalPatients').textContent = stats.total_patients || 0;
                    document.getElementById('totalRegistrations').textContent = stats.total_registrations || 0;
                    document.getElementById('totalMedicalRecords').textContent = stats.total_medical_records || 0;
                    document.getElementById('totalRevenue').textContent = formatMoney(stats.total_revenue || 0);
                    document.getElementById('todayRevenue').textContent = formatMoney(stats.today_revenue || 0);
                    document.getElementById('monthRevenue').textContent = formatMoney(stats.month_revenue || 0);
                    document.getElementById('totalBills').textContent = stats.total_bills || 0;
                    document.getElementById('todayNewPatients').textContent = stats.today_new_patients || 0;
                    document.getElementById('monthNewPatients').textContent = stats.month_new_patients || 0;
                } catch (error) {
                    console.error('加载统计数据失败:', error);
                    alert('加载统计数据失败: ' + (error.message || '未知错误'));
                }
            }
            
            function formatMoney(amount) {
                if (amount === 0 || !amount) return '0.00';
                return parseFloat(amount).toLocaleString('zh-CN', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });
            }
            
            window.logout = async function() {
                if (!confirm('确定要退出登录吗？')) {
                    return;
                }
                
                try {
                    const currentToken = localStorage.getItem('his_token');
                    if (currentToken) {
                        try {
                            await fetch('/api/v1/auth/logout', {
                                method: 'POST',
                                headers: {
                                    'Authorization': `Bearer ${currentToken}`,
                                    'Content-Type': 'application/json'
                                }
                            });
                        } catch (error) {
                            console.warn('调用登出API失败（继续清除本地数据）:', error);
                        }
                    }
                } catch (error) {
                    console.warn('登出API调用失败（继续清除本地数据）:', error);
                }
                
                localStorage.removeItem('his_token');
                localStorage.removeItem('his_refresh_token');
                localStorage.removeItem('his_user');
                
                window.location.href = '/platform-login.html';
            }
            
            checkAPILoaded();
        })();
    </script>
</body>
</html>

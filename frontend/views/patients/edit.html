<!-- 患者编辑页面 -->
<div class="page-header">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="#" onclick="app.navigate('dashboard')">首页</a></li>
            <li class="breadcrumb-item"><a href="#" onclick="app.navigate('patients')">患者管理</a></li>
            <li class="breadcrumb-item active" id="page-title-breadcrumb">新增患者</li>
        </ol>
    </nav>
    <h1><i class="bi bi-person-plus"></i> <span id="page-title">新增患者</span></h1>
</div>

<div class="card">
    <div class="card-body">
        <form id="patient-form" class="needs-validation" novalidate>
            <div id="patient-form-content">
                <!-- 表单内容将由JavaScript动态生成 -->
            </div>
        </form>
    </div>
</div>

<script>
let patientId = null;
let isEdit = false;

window.pageInit = function() {
    // 从URL获取患者ID（支持hash路由和直接URL）
    let urlParams;
    if (window.location.hash && window.location.hash.includes('?')) {
        // 从hash中获取查询参数
        const hashQuery = window.location.hash.split('?')[1];
        urlParams = new URLSearchParams(hashQuery);
    } else {
        // 从URL search中获取查询参数
        urlParams = new URLSearchParams(window.location.search);
    }
    
    patientId = urlParams.get('id');
    isEdit = !!patientId;
    
    // 更新页面标题
    const pageTitle = isEdit ? '编辑患者' : '新增患者';
    const titleElement = document.getElementById('page-title');
    const breadcrumbElement = document.getElementById('page-title-breadcrumb');
    if (titleElement) titleElement.textContent = pageTitle;
    if (breadcrumbElement) breadcrumbElement.textContent = pageTitle;
    
    // 生成表单
    renderForm();
    
    // 延迟执行，确保DOM已加载
    setTimeout(() => {
        // 如果是编辑模式，加载患者数据
        if (isEdit && window.loadPatientData) {
            window.loadPatientData();
        }
        
        // 表单提交
        const form = document.getElementById('patient-form');
        if (form && window.handleSubmit) {
            form.addEventListener('submit', window.handleSubmit);
        }
    }, 100);
};

// 渲染表单
function renderForm() {
    const formContent = document.getElementById('patient-form-content');
    if (!formContent || typeof FormComponents === 'undefined') {
        console.error('表单容器或FormComponents未找到');
        return;
    }
    
    const formHtml = `
        <div class="row">
            <div class="col-md-6">
                ${FormComponents.createInput({
                    id: 'patient-name',
                    label: '姓名',
                    name: 'name',
                    required: true,
                    placeholder: '请输入患者姓名'
                })}
            </div>
            <div class="col-md-6">
                ${FormComponents.createSelect({
                    id: 'patient-gender',
                    label: '性别',
                    name: 'gender',
                    required: true,
                    options: [
                { value: 'male', text: '男' },
                { value: 'female', text: '女' },
                { value: 'other', text: '其他' }
            ]
        })}
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6">
                ${FormComponents.createDatePicker({
                    id: 'patient-birthday',
                    label: '出生日期',
                    name: 'birthday',
                    required: true
                })}
            </div>
            <div class="col-md-6">
                ${FormComponents.createInput({
                    id: 'patient-phone',
                    label: '联系电话',
                    name: 'phone',
                    required: true,
                    placeholder: '请输入联系电话'
                })}
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6">
                ${FormComponents.createInput({
                    id: 'patient-id-card',
                    label: '身份证号',
                    name: 'id_card',
                    placeholder: '请输入身份证号'
                })}
            </div>
            <div class="col-md-6">
                ${FormComponents.createInput({
                    id: 'patient-address',
                    label: '地址',
                    name: 'address',
                    placeholder: '请输入地址'
                })}
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6">
                ${FormComponents.createInput({
                    id: 'patient-emergency-contact',
                    label: '紧急联系人',
                    name: 'emergency_contact',
                    placeholder: '请输入紧急联系人姓名'
                })}
            </div>
            <div class="col-md-6">
                ${FormComponents.createInput({
                    id: 'patient-emergency-phone',
                    label: '紧急联系人电话',
                    name: 'emergency_phone',
                    placeholder: '请输入紧急联系人电话'
                })}
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6">
                ${FormComponents.createTextarea({
                    id: 'patient-allergy',
                    label: '过敏史',
                    name: 'allergy_history',
                    rows: 2,
                    placeholder: '请输入过敏史，如无请填写"无"'
                })}
            </div>
            <div class="col-md-6">
                ${FormComponents.createTextarea({
                    id: 'patient-chronic',
                    label: '慢性病史',
                    name: 'chronic_disease',
                    rows: 2,
                    placeholder: '请输入慢性病史，如无请填写"无"'
                })}
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6">
                ${FormComponents.createSelect({
                    id: 'patient-blood-type',
                    label: '血型',
                    name: 'blood_type',
                    options: [
                        { value: 'A', text: 'A' },
                        { value: 'B', text: 'B' },
                        { value: 'AB', text: 'AB' },
                        { value: 'O', text: 'O' }
                    ]
                })}
            </div>
            <div class="col-md-6">
                ${FormComponents.createTextarea({
                    id: 'patient-remark',
                    label: '备注',
                    name: 'remark',
                    rows: 2,
                    placeholder: '请输入备注'
                })}
            </div>
        </div>
        
        <div class="mt-4">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-circle"></i> 保存
            </button>
            <button type="button" class="btn btn-secondary ms-2" onclick="if(window.app && window.app.navigate) { window.app.navigate('patients'); } else { window.location.href='/views/patients/list.html'; }">
                <i class="bi bi-x-circle"></i> 取消
            </button>
        </div>
    `;
    
    formContent.innerHTML = formHtml;
}

// 加载患者数据（挂载到全局作用域）
window.loadPatientData = async function() {
    try {
        // 调用实际API
        const patient = await PatientAPI.getDetail(patientId);
        
        // 填充表单（适配后端返回的字段名）
        // 添加元素存在性检查和重试机制
        const setValue = (id, value) => {
            const element = document.getElementById(id);
            if (element) {
                // 处理日期格式（如果是日期字段）
                if (id === 'patient-birthday' && value) {
                    // 确保日期格式为 yyyy-MM-dd
                    if (value instanceof Date) {
                        element.value = value.toISOString().split('T')[0];
                    } else if (typeof value === 'string') {
                        // 尝试解析日期字符串
                        const date = new Date(value);
                        if (!isNaN(date.getTime())) {
                            element.value = date.toISOString().split('T')[0];
                        } else {
                            element.value = value;
                        }
                    } else {
                        element.value = value || '';
                    }
                } else {
                    element.value = value || '';
                }
            } else {
                console.warn(`表单元素未找到: ${id}`);
            }
        };
        
        // 等待DOM完全加载后再设置值
        const fillForm = () => {
            setValue('patient-name', patient.name);
            setValue('patient-gender', patient.gender);
            setValue('patient-birthday', patient.birthday || patient.birth_date);
            setValue('patient-phone', patient.phone);
            setValue('patient-id-card', patient.id_card);
            setValue('patient-address', patient.address);
            setValue('patient-emergency-contact', patient.emergency_contact);
            setValue('patient-emergency-phone', patient.emergency_phone);
            setValue('patient-allergy', patient.allergy_history);
            setValue('patient-chronic', patient.chronic_disease);
            setValue('patient-blood-type', patient.blood_type);
            setValue('patient-remark', patient.remark);
        };
        
        // 直接填充表单（表单已经在renderForm中生成）
        fillForm();
        
    } catch (error) {
        console.error('加载患者数据失败:', error);
        utils.showToast('加载患者数据失败: ' + (error.message || '未知错误'), 'danger');
    }
}

// 处理表单提交（挂载到全局作用域）
window.handleSubmit = async function(e) {
    e.preventDefault();
    e.stopPropagation();
    
    const form = e.target;
    if (!form.checkValidity()) {
        form.classList.add('was-validated');
        return;
    }
    
    const formData = new FormData(form);
    const data = Object.fromEntries(formData);
    
    try {
        if (isEdit) {
            await PatientAPI.update(patientId, data);
            utils.showToast('更新患者成功', 'success');
        } else {
            await PatientAPI.create(data);
            utils.showToast('新增患者成功', 'success');
        }
        
        setTimeout(() => {
            if (window.app && window.app.navigate) {
                window.app.navigate('patients');
            } else {
                window.location.href = '/views/patients/list.html';
            }
        }, 1000);
        
    } catch (error) {
        console.error('保存患者失败:', error);
        utils.showToast('保存患者失败', 'danger');
    }
}
</script>

<!-- 库存流水管理页面 -->
<div class="page-header">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="#" onclick="app.navigate('dashboard')">首页</a></li>
            <li class="breadcrumb-item active">库存流水</li>
        </ol>
    </nav>
    <h1><i class="bi bi-list-check"></i> 库存流水</h1>
</div>

<div class="container-fluid py-4">

        <!-- 搜索栏 -->
        <div class="card mb-4">
            <div class="card-body">
                <form id="search-form" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">药品</label>
                        <select class="form-select" id="search-drug">
                            <option value="">全部</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">交易类型</label>
                        <select class="form-select" id="search-type">
                            <option value="">全部</option>
                            <option value="purchase">采购入库</option>
                            <option value="sale">销售出库</option>
                            <option value="adjust">调整</option>
                            <option value="check">盘点</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">开始日期</label>
                        <input type="datetime-local" class="form-control" id="search-start-date">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">结束日期</label>
                        <input type="datetime-local" class="form-control" id="search-end-date">
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary me-2">
                            <i class="bi bi-search"></i> 搜索
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="resetSearch()">
                            <i class="bi bi-arrow-clockwise"></i> 重置
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 库存流水列表 -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>交易时间</th>
                                <th>药品名称</th>
                                <th>交易类型</th>
                                <th>数量</th>
                                <th>单价</th>
                                <th>总金额</th>
                                <th>变动前库存</th>
                                <th>变动后库存</th>
                                <th>备注</th>
                            </tr>
                        </thead>
                        <tbody id="transactions-table-body">
                            <tr>
                                <td colspan="9" class="text-center">加载中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- 分页 -->
                <div id="pagination-container" class="mt-3"></div>
            </div>
        </div>
    </div>

    <!-- 脚本已在index.html中加载，无需重复加载 -->
    <script>
        let currentPage = 1;
        const pageSize = 20;
        let searchParams = {};

        // 挂载到全局作用域，供SPA系统调用
        window.pageInit = async function() {
            await loadDrugs();
            loadTransactions();
            
            // 搜索表单提交
            const searchForm = document.getElementById('search-form');
            if (searchForm) {
                searchForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    currentPage = 1;
                    searchParams = {
                        drug_id: document.getElementById('search-drug').value,
                        transaction_type: document.getElementById('search-type').value,
                        start_date: document.getElementById('search-start-date').value,
                        end_date: document.getElementById('search-end-date').value
                    };
                    loadTransactions();
                });
            }
        };

        // 加载药品列表
        async function loadDrugs() {
            try {
                const response = await PharmacyAPI.getDrugs({ page: 1, page_size: 1000 });
                const drugs = response.items || response.data?.items || [];
                
                const select = document.getElementById('search-drug');
                select.innerHTML = '<option value="">全部</option>';
                drugs.forEach(drug => {
                    const option = document.createElement('option');
                    option.value = drug.id;
                    option.textContent = `${drug.name} (${drug.specification || ''})`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('加载药品列表失败:', error);
            }
        }

        // 加载库存流水列表
        async function loadTransactions() {
            try {
                const params = {
                    page: currentPage,
                    page_size: pageSize,
                    ...searchParams
                };
                
                const response = await InventoryAPI.getTransactions(params);
                const transactions = response.items || response.data?.items || [];
                const pagination = response.pagination || response.data?.pagination || {};
                
                renderTransactionsTable(transactions);
                renderPagination(pagination);
            } catch (error) {
                console.error('加载库存流水列表失败:', error);
                utils.showToast('加载库存流水列表失败', 'danger');
            }
        }

        // 渲染库存流水表格
        function renderTransactionsTable(transactions) {
            const tbody = document.getElementById('transactions-table-body');
            
            if (transactions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="text-center">暂无数据</td></tr>';
                return;
            }
            
            tbody.innerHTML = transactions.map(trans => {
                const typeMap = {
                    'purchase': { text: '采购入库', class: 'text-success' },
                    'sale': { text: '销售出库', class: 'text-danger' },
                    'adjust': { text: '调整', class: 'text-warning' },
                    'check': { text: '盘点', class: 'text-info' }
                };
                const typeInfo = typeMap[trans.transaction_type] || { text: trans.transaction_type, class: '' };
                
                const quantityClass = trans.quantity > 0 ? 'text-success' : 'text-danger';
                const quantityPrefix = trans.quantity > 0 ? '+' : '';
                
                return `
                    <tr>
                        <td>${trans.transaction_date ? new Date(trans.transaction_date).toLocaleString() : '-'}</td>
                        <td>${trans.drug_name || '-'}</td>
                        <td><span class="${typeInfo.class}">${typeInfo.text}</span></td>
                        <td class="${quantityClass}">${quantityPrefix}${trans.quantity}</td>
                        <td>¥${trans.unit_price || 0}</td>
                        <td>¥${trans.total_amount || 0}</td>
                        <td>${trans.before_quantity}</td>
                        <td>${trans.after_quantity}</td>
                        <td>${trans.remark || '-'}</td>
                    </tr>
                `;
            }).join('');
        }

        // 渲染分页
        function renderPagination(pagination) {
            const container = document.getElementById('pagination-container');
            if (!pagination || pagination.pages <= 1) {
                container.innerHTML = '';
                return;
            }
            
            let html = '<nav><ul class="pagination justify-content-center">';
            
            html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;">上一页</a>
            </li>`;
            
            for (let i = 1; i <= pagination.pages; i++) {
                if (i === 1 || i === pagination.pages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a>
                    </li>`;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    html += '<li class="page-item disabled"><span class="page-link">...</span></li>';
                }
            }
            
            html += `<li class="page-item ${currentPage === pagination.pages ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;">下一页</a>
            </li>`;
            
            html += '</ul></nav>';
            html += `<div class="text-center mt-2">共 ${pagination.total} 条记录</div>`;
            
            container.innerHTML = html;
        }

        // 切换页码（挂载到全局作用域）
        window.changePage = function(page) {
            currentPage = page;
            loadTransactions();
        };

        // 重置搜索（挂载到全局作用域）
        window.resetSearch = function() {
            document.getElementById('search-drug').value = '';
            document.getElementById('search-type').value = '';
            document.getElementById('search-start-date').value = '';
            document.getElementById('search-end-date').value = '';
            searchParams = {};
            currentPage = 1;
            loadTransactions();
        };
    </script>

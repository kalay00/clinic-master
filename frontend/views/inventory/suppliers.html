<!-- 供应商管理页面 -->
<div class="page-header">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="#" onclick="app.navigate('dashboard')">首页</a></li>
            <li class="breadcrumb-item active">供应商管理</li>
        </ol>
    </nav>
    <h1><i class="bi bi-truck"></i> 供应商管理</h1>
</div>

<!-- 操作按钮 -->
<div class="action-buttons">
    <button type="button" class="btn btn-primary" onclick="showAddSupplierModal()">
                <i class="bi bi-plus-circle"></i> 新增供应商
            </button>
        </div>

<div class="container-fluid py-4">

        <!-- 搜索栏 -->
        <div class="card mb-4">
            <div class="card-body">
                <form id="search-form" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">搜索关键词</label>
                        <input type="text" class="form-control" id="search-keyword" placeholder="供应商名称、编码、联系人">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">状态</label>
                        <select class="form-select" id="search-status">
                            <option value="">全部</option>
                            <option value="active">启用</option>
                            <option value="inactive">禁用</option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary me-2">
                            <i class="bi bi-search"></i> 搜索
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="resetSearch()">
                            <i class="bi bi-arrow-clockwise"></i> 重置
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 供应商列表 -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>供应商编码</th>
                                <th>供应商名称</th>
                                <th>联系人</th>
                                <th>联系电话</th>
                                <th>联系邮箱</th>
                                <th>分类</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="suppliers-table-body">
                            <tr>
                                <td colspan="8" class="text-center">加载中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- 分页 -->
                <div id="pagination-container" class="mt-3"></div>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        const pageSize = 10;
        let searchParams = {};

// 挂载到全局作用域，供SPA系统调用
window.pageInit = function() {
            loadSuppliers();
            
            // 搜索表单提交
    const searchForm = document.getElementById('search-form');
    if (searchForm) {
        searchForm.addEventListener('submit', function(e) {
                e.preventDefault();
                currentPage = 1;
                searchParams = {
                    keyword: document.getElementById('search-keyword').value,
                    status: document.getElementById('search-status').value
                };
                loadSuppliers();
            });
    }
};

// 加载供应商列表（挂载到全局作用域）
window.loadSuppliers = async function() {
            try {
                const params = {
                    page: currentPage,
                    page_size: pageSize,
                    ...searchParams
                };
                
                const response = await InventoryAPI.getSuppliers(params);
                const suppliers = response.items || response.data?.items || [];
                const pagination = response.pagination || response.data?.pagination || {};
                
                renderSuppliersTable(suppliers);
                renderPagination(pagination);
            } catch (error) {
                console.error('加载供应商列表失败:', error);
                utils.showToast('加载供应商列表失败', 'danger');
            }
};

        // 渲染供应商表格
        function renderSuppliersTable(suppliers) {
            const tbody = document.getElementById('suppliers-table-body');
            
            if (suppliers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center">暂无数据</td></tr>';
                return;
            }
            
            tbody.innerHTML = suppliers.map(supplier => `
                <tr>
                    <td>${supplier.code || '-'}</td>
                    <td>${supplier.name || '-'}</td>
                    <td>${supplier.contact_name || '-'}</td>
                    <td>${supplier.contact_phone || '-'}</td>
                    <td>${supplier.contact_email || '-'}</td>
                    <td>${supplier.category || '-'}</td>
                    <td>
                        <span class="badge ${supplier.status === 'active' ? 'bg-success' : 'bg-secondary'}">
                            ${supplier.status === 'active' ? '启用' : '禁用'}
                        </span>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-primary" onclick="editSupplier('${supplier.id}')">
                            <i class="bi bi-pencil"></i> 编辑
                        </button>
                        <button class="btn btn-sm btn-danger" onclick="deleteSupplier('${supplier.id}')">
                            <i class="bi bi-trash"></i> 删除
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // 渲染分页
        function renderPagination(pagination) {
            const container = document.getElementById('pagination-container');
            if (!pagination || pagination.pages <= 1) {
                container.innerHTML = '';
                return;
            }
            
            let html = '<nav><ul class="pagination justify-content-center">';
            
            // 上一页
            html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;">上一页</a>
            </li>`;
            
            // 页码
            for (let i = 1; i <= pagination.pages; i++) {
                if (i === 1 || i === pagination.pages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a>
                    </li>`;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    html += '<li class="page-item disabled"><span class="page-link">...</span></li>';
                }
            }
            
            // 下一页
            html += `<li class="page-item ${currentPage === pagination.pages ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;">下一页</a>
            </li>`;
            
            html += '</ul></nav>';
            html += `<div class="text-center mt-2">共 ${pagination.total} 条记录</div>`;
            
            container.innerHTML = html;
        }

// 切换页码（挂载到全局作用域）
window.changePage = function(page) {
            currentPage = page;
            loadSuppliers();
};

// 重置搜索（挂载到全局作用域）
window.resetSearch = function() {
            document.getElementById('search-keyword').value = '';
            document.getElementById('search-status').value = '';
            searchParams = {};
            currentPage = 1;
            loadSuppliers();
};

// 显示新增供应商弹窗（挂载到全局作用域）
window.showAddSupplierModal = async function() {
            const formHtml = `
                ${FormComponents.createInput({
                    id: 'add-name',
                    label: '供应商名称',
                    name: 'name',
                    required: true
                })}
                ${FormComponents.createInput({
                    id: 'add-code',
                    label: '供应商编码',
                    name: 'code',
                    required: true
                })}
                ${FormComponents.createInput({
                    id: 'add-contact-name',
                    label: '联系人',
                    name: 'contact_name'
                })}
                ${FormComponents.createInput({
                    id: 'add-contact-phone',
                    label: '联系电话',
                    name: 'contact_phone',
                    type: 'tel'
                })}
                ${FormComponents.createInput({
                    id: 'add-contact-email',
                    label: '联系邮箱',
                    name: 'contact_email',
                    type: 'email'
                })}
                ${FormComponents.createInput({
                    id: 'add-address',
                    label: '地址',
                    name: 'address'
                })}
                ${FormComponents.createInput({
                    id: 'add-category',
                    label: '供应商分类',
                    name: 'category'
                })}
                ${FormComponents.createSelect({
                    id: 'add-status',
                    label: '状态',
                    name: 'status',
                    value: 'active',
                    options: [
                        { value: 'active', text: '启用' },
                        { value: 'inactive', text: '禁用' }
                    ]
                })}
                ${FormComponents.createTextarea({
                    id: 'add-remark',
                    label: '备注',
                    name: 'remark'
                })}
            `;
            
            await ModalComponents.showFormModal({
                title: '新增供应商',
                formHtml: formHtml,
                size: 'lg',
                onSubmit: async (formData) => {
                    try {
                        await InventoryAPI.createSupplier(formData);
                        utils.showToast('创建供应商成功', 'success');
                        loadSuppliers();
                        return true;
                    } catch (error) {
                        console.error('创建供应商失败:', error);
                        const errorMsg = error.message || '创建供应商失败';
                        utils.showToast(errorMsg, 'danger');
                        return false;
                    }
                }
            });
};

// 编辑供应商（挂载到全局作用域）
window.editSupplier = async function(id) {
            try {
                const response = await InventoryAPI.getSupplierDetail(id);
                const supplier = response.data || response;
                
                const formHtml = `
                    ${FormComponents.createInput({
                        id: 'edit-name',
                        label: '供应商名称',
                        name: 'name',
                        value: supplier.name,
                        required: true
                    })}
                    ${FormComponents.createInput({
                        id: 'edit-code',
                        label: '供应商编码',
                        name: 'code',
                        value: supplier.code,
                        required: true,
                        readonly: true
                    })}
                    ${FormComponents.createInput({
                        id: 'edit-contact-name',
                        label: '联系人',
                        name: 'contact_name',
                        value: supplier.contact_name || ''
                    })}
                    ${FormComponents.createInput({
                        id: 'edit-contact-phone',
                        label: '联系电话',
                        name: 'contact_phone',
                        value: supplier.contact_phone || '',
                        type: 'tel'
                    })}
                    ${FormComponents.createInput({
                        id: 'edit-contact-email',
                        label: '联系邮箱',
                        name: 'contact_email',
                        value: supplier.contact_email || '',
                        type: 'email'
                    })}
                    ${FormComponents.createInput({
                        id: 'edit-address',
                        label: '地址',
                        name: 'address',
                        value: supplier.address || ''
                    })}
                    ${FormComponents.createInput({
                        id: 'edit-category',
                        label: '供应商分类',
                        name: 'category',
                        value: supplier.category || ''
                    })}
                    ${FormComponents.createSelect({
                        id: 'edit-status',
                        label: '状态',
                        name: 'status',
                        value: supplier.status || 'active',
                        options: [
                            { value: 'active', text: '启用' },
                            { value: 'inactive', text: '禁用' }
                        ]
                    })}
                    ${FormComponents.createTextarea({
                        id: 'edit-remark',
                        label: '备注',
                        name: 'remark',
                        value: supplier.remark || ''
                    })}
                `;
                
                await ModalComponents.showFormModal({
                    title: '编辑供应商',
                    formHtml: formHtml,
                    size: 'lg',
                    onSubmit: async (formData) => {
                        try {
                            await InventoryAPI.updateSupplier(id, formData);
                            utils.showToast('更新供应商成功', 'success');
                            loadSuppliers();
                            return true;
                        } catch (error) {
                            console.error('更新供应商失败:', error);
                            const errorMsg = error.message || '更新供应商失败';
                            utils.showToast(errorMsg, 'danger');
                            return false;
                        }
                    }
                });
            } catch (error) {
                console.error('获取供应商详情失败:', error);
                utils.showToast('获取供应商详情失败', 'danger');
            }
};

// 删除供应商（挂载到全局作用域）
window.deleteSupplier = async function(id) {
            if (!confirm('确定要删除该供应商吗？')) {
                return;
            }
            
            try {
                await InventoryAPI.deleteSupplier(id);
                utils.showToast('删除供应商成功', 'success');
                loadSuppliers();
            } catch (error) {
                console.error('删除供应商失败:', error);
                const errorMsg = error.message || '删除供应商失败';
                utils.showToast(errorMsg, 'danger');
            }
};
    </script>

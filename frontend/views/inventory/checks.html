<!-- 库存盘点管理页面 -->
<div class="page-header">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="#" onclick="app.navigate('dashboard')">首页</a></li>
            <li class="breadcrumb-item active">库存盘点</li>
        </ol>
    </nav>
    <h1><i class="bi bi-clipboard-check"></i> 库存盘点</h1>
</div>

<!-- 操作按钮 -->
<div class="action-buttons">
    <button type="button" class="btn btn-primary" onclick="showAddCheckModal()">
        <i class="bi bi-plus-circle"></i> 新增盘点单
    </button>
</div>

<div class="container-fluid py-4">

        <!-- 搜索栏 -->
        <div class="card mb-4">
            <div class="card-body">
                <form id="search-form" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">状态</label>
                        <select class="form-select" id="search-status">
                            <option value="">全部</option>
                            <option value="draft">草稿</option>
                            <option value="completed">已完成</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">开始日期</label>
                        <input type="date" class="form-control" id="search-start-date">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">结束日期</label>
                        <input type="date" class="form-control" id="search-end-date">
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary me-2">
                            <i class="bi bi-search"></i> 搜索
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="resetSearch()">
                            <i class="bi bi-arrow-clockwise"></i> 重置
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 盘点单列表 -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>盘点单号</th>
                                <th>盘点日期</th>
                                <th>状态</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="checks-table-body">
                            <tr>
                                <td colspan="5" class="text-center">加载中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- 分页 -->
                <div id="pagination-container" class="mt-3"></div>
            </div>
        </div>
    </div>

    <!-- 脚本已在index.html中加载，无需重复加载 -->
    <script>
        let currentPage = 1;
        const pageSize = 10;
        let searchParams = {};

        // 挂载到全局作用域，供SPA系统调用
        window.pageInit = async function() {
            loadChecks();
            
            // 搜索表单提交
            const searchForm = document.getElementById('search-form');
            if (searchForm) {
                searchForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    currentPage = 1;
                    searchParams = {
                        status: document.getElementById('search-status').value,
                        start_date: document.getElementById('search-start-date').value,
                        end_date: document.getElementById('search-end-date').value
                    };
                    loadChecks();
                });
            }
        };

        // 加载盘点单列表
        async function loadChecks() {
            try {
                const params = {
                    page: currentPage,
                    page_size: pageSize,
                    ...searchParams
                };
                
                const response = await InventoryAPI.getInventoryChecks(params);
                const checks = response.items || response.data?.items || [];
                const pagination = response.pagination || response.data?.pagination || {};
                
                renderChecksTable(checks);
                renderPagination(pagination);
            } catch (error) {
                console.error('加载盘点单列表失败:', error);
                utils.showToast('加载盘点单列表失败', 'danger');
            }
        }

        // 渲染盘点单表格
        function renderChecksTable(checks) {
            const tbody = document.getElementById('checks-table-body');
            
            if (checks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center">暂无数据</td></tr>';
                return;
            }
            
            tbody.innerHTML = checks.map(check => {
                const statusBadge = check.status === 'completed' 
                    ? '<span class="badge bg-success">已完成</span>'
                    : '<span class="badge bg-secondary">草稿</span>';
                
                let actions = '';
                if (check.status === 'draft') {
                    actions += `<button class="btn btn-sm btn-success" onclick="completeCheck('${check.id}')">
                        <i class="bi bi-check-circle"></i> 完成盘点
                    </button> `;
                    actions += `<button class="btn btn-sm btn-danger" onclick="deleteCheck('${check.id}')">
                        <i class="bi bi-trash"></i> 删除
                    </button> `;
                }
                actions += ` <button class="btn btn-sm btn-info" onclick="viewCheck('${check.id}')">
                    <i class="bi bi-eye"></i> 查看
                </button>`;
                
                return `
                    <tr>
                        <td>${check.check_no || '-'}</td>
                        <td>${check.check_date || '-'}</td>
                        <td>${statusBadge}</td>
                        <td>${check.created_at ? new Date(check.created_at).toLocaleString() : '-'}</td>
                        <td>${actions}</td>
                    </tr>
                `;
            }).join('');
        }

        // 渲染分页
        function renderPagination(pagination) {
            const container = document.getElementById('pagination-container');
            if (!pagination || pagination.pages <= 1) {
                container.innerHTML = '';
                return;
            }
            
            let html = '<nav><ul class="pagination justify-content-center">';
            
            html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;">上一页</a>
            </li>`;
            
            for (let i = 1; i <= pagination.pages; i++) {
                if (i === 1 || i === pagination.pages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a>
                    </li>`;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    html += '<li class="page-item disabled"><span class="page-link">...</span></li>';
                }
            }
            
            html += `<li class="page-item ${currentPage === pagination.pages ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;">下一页</a>
            </li>`;
            
            html += '</ul></nav>';
            html += `<div class="text-center mt-2">共 ${pagination.total} 条记录</div>`;
            
            container.innerHTML = html;
        }

        // 切换页码（挂载到全局作用域）
        window.changePage = function(page) {
            currentPage = page;
            loadChecks();
        };

        // 重置搜索（挂载到全局作用域）
        window.resetSearch = function() {
            document.getElementById('search-status').value = '';
            document.getElementById('search-start-date').value = '';
            document.getElementById('search-end-date').value = '';
            searchParams = {};
            currentPage = 1;
            loadChecks();
        };

        // 显示新增盘点单弹窗（挂载到全局作用域）
        window.showAddCheckModal = async function() {
            const formHtml = `
                ${FormComponents.createInput({
                    id: 'add-check-date',
                    label: '盘点日期',
                    name: 'check_date',
                    type: 'date',
                    value: new Date().toISOString().split('T')[0],
                    required: true
                })}
                <div class="mb-3">
                    <label class="form-label">盘点明细</label>
                    <div id="check-items-container">
                        <div class="check-item row g-2 mb-2">
                            <div class="col-md-4">
                                <select class="form-select item-drug" required>
                                    <option value="">请选择药品</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <input type="number" class="form-control item-book-quantity" placeholder="账面数量" readonly>
                            </div>
                            <div class="col-md-3">
                                <input type="number" class="form-control item-actual-quantity" placeholder="实际数量" min="0" required>
                            </div>
                            <div class="col-md-2">
                                <button type="button" class="btn btn-sm btn-danger" onclick="removeCheckItem(this)">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="btn btn-sm btn-secondary" onclick="addCheckItem()">
                        <i class="bi bi-plus"></i> 添加明细
                    </button>
                </div>
                ${FormComponents.createTextarea({
                    id: 'add-remark',
                    label: '备注',
                    name: 'remark'
                })}
            `;
            
            await ModalComponents.showFormModal({
                title: '新增盘点单',
                formHtml: formHtml,
                size: 'xl',
                onSubmit: async (formData) => {
                    try {
                        // 收集明细数据
                        const items = [];
                        document.querySelectorAll('.check-item').forEach(item => {
                            const drugId = item.querySelector('.item-drug').value;
                            const actualQuantity = parseInt(item.querySelector('.item-actual-quantity').value);
                            
                            if (drugId && !isNaN(actualQuantity)) {
                                items.push({
                                    drug_id: drugId,
                                    actual_quantity: actualQuantity
                                });
                            }
                        });
                        
                        if (items.length === 0) {
                            utils.showToast('请至少添加一条盘点明细', 'warning');
                            return false;
                        }
                        
                        const checkData = {
                            check_date: formData.check_date,
                            items: items,
                            remark: formData.remark || null
                        };
                        
                        await InventoryAPI.createInventoryCheck(checkData);
                        utils.showToast('创建盘点单成功', 'success');
                        loadChecks();
                        return true;
                    } catch (error) {
                        console.error('创建盘点单失败:', error);
                        const errorMsg = error.message || '创建盘点单失败';
                        utils.showToast(errorMsg, 'danger');
                        return false;
                    }
                }
            });
            
            // 加载药品列表
            loadDrugsForCheck();
            
            // 绑定药品选择事件，自动填充账面数量
            setTimeout(() => {
                document.querySelectorAll('.item-drug').forEach(select => {
                    select.addEventListener('change', async function() {
                        if (this.value) {
                            await loadDrugInventory(this.value, this.closest('.check-item'));
                        }
                    });
                });
            }, 100);
        }

        // 加载药品列表（用于盘点）
        async function loadDrugsForCheck() {
            try {
                const response = await PharmacyAPI.getDrugs({ page: 1, page_size: 1000 });
                const drugs = response.items || response.data?.items || [];
                
                document.querySelectorAll('.item-drug').forEach(select => {
                    select.innerHTML = '<option value="">请选择药品</option>';
                    drugs.forEach(drug => {
                        const option = document.createElement('option');
                        option.value = drug.id;
                        option.textContent = `${drug.name} (${drug.specification || ''})`;
                        select.appendChild(option);
                    });
                });
            } catch (error) {
                console.error('加载药品列表失败:', error);
            }
        }

        // 加载药品库存
        async function loadDrugInventory(drugId, itemElement) {
            try {
                const response = await PharmacyAPI.getInventory(drugId);
                const inventory = response.data || response;
                const quantity = inventory.quantity || 0;
                
                itemElement.querySelector('.item-book-quantity').value = quantity;
            } catch (error) {
                console.error('加载药品库存失败:', error);
                itemElement.querySelector('.item-book-quantity').value = 0;
            }
        }

        // 添加盘点明细
        function addCheckItem() {
            const container = document.getElementById('check-items-container');
            const newItem = document.createElement('div');
            newItem.className = 'check-item row g-2 mb-2';
            newItem.innerHTML = `
                <div class="col-md-4">
                    <select class="form-select item-drug" required>
                        <option value="">请选择药品</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <input type="number" class="form-control item-book-quantity" placeholder="账面数量" readonly>
                </div>
                <div class="col-md-3">
                    <input type="number" class="form-control item-actual-quantity" placeholder="实际数量" min="0" required>
                </div>
                <div class="col-md-2">
                    <button type="button" class="btn btn-sm btn-danger" onclick="removeCheckItem(this)">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            `;
            container.appendChild(newItem);
            loadDrugsForCheck();
            
            // 绑定药品选择事件
            newItem.querySelector('.item-drug').addEventListener('change', async function() {
                if (this.value) {
                    await loadDrugInventory(this.value, newItem);
                }
            });
        }

        // 删除盘点明细
        function removeCheckItem(btn) {
            btn.closest('.check-item').remove();
        }

        // 查看盘点单详情（挂载到全局作用域）
        window.viewCheck = async function(id) {
            try {
                const response = await InventoryAPI.getInventoryCheckDetail(id);
                const check = response.data || response;
                
                let itemsHtml = '';
                if (check.items && check.items.length > 0) {
                    itemsHtml = check.items.map(item => {
                        const diffClass = item.difference > 0 ? 'text-success' : item.difference < 0 ? 'text-danger' : '';
                        return `
                            <tr>
                                <td>${item.drug_name || '-'}</td>
                                <td>${item.book_quantity}</td>
                                <td>${item.actual_quantity}</td>
                                <td class="${diffClass}">${item.difference > 0 ? '+' : ''}${item.difference}</td>
                                <td>¥${item.unit_price || 0}</td>
                                <td class="${diffClass}">¥${item.difference_amount || 0}</td>
                            </tr>
                        `;
                    }).join('');
                }
                
                const modalHtml = `
                    <div class="mb-3">
                        <strong>盘点单号：</strong>${check.check_no}
                    </div>
                    <div class="mb-3">
                        <strong>盘点日期：</strong>${check.check_date}
                    </div>
                    <div class="mb-3">
                        <strong>状态：</strong>
                        <span class="badge ${check.status === 'completed' ? 'bg-success' : 'bg-secondary'}">
                            ${check.status === 'completed' ? '已完成' : '草稿'}
                        </span>
                    </div>
                    <div class="mb-3">
                        <strong>备注：</strong>${check.remark || '-'}
                    </div>
                    <div class="table-responsive">
                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>药品名称</th>
                                    <th>账面数量</th>
                                    <th>实际数量</th>
                                    <th>差异数量</th>
                                    <th>单价</th>
                                    <th>差异金额</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${itemsHtml}
                            </tbody>
                        </table>
                    </div>
                `;
                
                await ModalComponents.showModal({
                    title: '盘点单详情',
                    body: modalHtml,
                    size: 'lg'
                });
            } catch (error) {
                console.error('获取盘点单详情失败:', error);
                utils.showToast('获取盘点单详情失败', 'danger');
            }
        }

        // 完成盘点（挂载到全局作用域）
        window.completeCheck = async function(id) {
            if (!confirm('确定要完成盘点吗？完成盘点后将自动调整库存并记录库存流水。')) {
                return;
            }
            
            try {
                await InventoryAPI.completeInventoryCheck(id);
                utils.showToast('完成盘点成功', 'success');
                loadChecks();
            } catch (error) {
                console.error('完成盘点失败:', error);
                const errorMsg = error.message || '完成盘点失败';
                utils.showToast(errorMsg, 'danger');
            }
        }

        // 删除盘点单（挂载到全局作用域）
        window.deleteCheck = async function(id) {
            if (!confirm('确定要删除该盘点单吗？')) {
                return;
            }
            
            try {
                await InventoryAPI.deleteInventoryCheck(id);
                utils.showToast('删除盘点单成功', 'success');
                loadChecks();
            } catch (error) {
                console.error('删除盘点单失败:', error);
                const errorMsg = error.message || '删除盘点单失败';
                utils.showToast(errorMsg, 'danger');
            }
        }
    </script>

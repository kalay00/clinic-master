<!-- 报表内容区域 -->
<div id="report-content"></div>

<script>
// 引入Chart.js（如果未引入）
if (typeof Chart === 'undefined') {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js';
    document.head.appendChild(script);
}

window.pageInit = function() {
    // 默认显示收入报表
    if (window.showRevenueReport) {

};

// 显示收入报表（挂载到全局作用域）
window.showRevenueReport = async function() {
    const container = document.getElementById('report-content');
    container.innerHTML = `
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-cash-stack"></i> 收入报表</h5>
                <div>
                    <input type="date" id="revenue-start-date" class="form-control form-control-sm d-inline-block" style="width: 150px;">
                    <span class="mx-2">至</span>
                    <input type="date" id="revenue-end-date" class="form-control form-control-sm d-inline-block" style="width: 150px;">
                    <button class="btn btn-sm btn-primary ms-2" onclick="if(window.loadRevenueReport) window.loadRevenueReport()">
                        <i class="bi bi-search"></i> 查询
                    </button>
                    <button class="btn btn-sm btn-success ms-2" onclick="if(window.exportRevenueReport) window.exportRevenueReport()">
                        <i class="bi bi-download"></i> 导出
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="card bg-primary text-white">
                            <div class="card-body">
                                <h6>总收入</h6>
                                <h3 id="total-revenue">¥0.00</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card bg-success text-white">
                            <div class="card-body">
                                <h6>现金收入</h6>
                                <h3 id="cash-revenue">¥0.00</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card bg-info text-white">
                            <div class="card-body">
                                <h6>在线支付</h6>
                                <h3 id="online-revenue">¥0.00</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card bg-warning text-white">
                            <div class="card-body">
                                <h6>医保支付</h6>
                                <h3 id="insurance-revenue">¥0.00</h3>
                            </div>
                        </div>
                    </div>
                </div>
                <canvas id="revenue-chart" height="100"></canvas>
            </div>
        </div>
    `;
    
    // 设置默认日期值
    const today = new Date();
    const thirtyDaysAgo = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000);
    const startDateInput = document.getElementById('revenue-start-date');
    const endDateInput = document.getElementById('revenue-end-date');
    if (startDateInput) {
        startDateInput.value = thirtyDaysAgo.toISOString().split('T')[0];
    }
    if (endDateInput) {
        endDateInput.value = today.toISOString().split('T')[0];
    }
    
    await window.loadRevenueReport();
}

// 加载收入报表数据（挂载到全局作用域）
window.loadRevenueReport = async function() {
    try {
        // 调用实际API
        const startDate = document.getElementById('revenue-start-date').value;
        const endDate = document.getElementById('revenue-end-date').value;
        const response = await ReportAPI.getRevenueReport({ start_date: startDate, end_date: endDate });
        
        // 模拟数据（如果API返回的数据格式不同，需要适配）
        // 更新统计卡片
        document.getElementById('total-revenue').textContent = utils.formatMoney(response.total || response.total_amount || 0);
        document.getElementById('cash-revenue').textContent = utils.formatMoney(response.cash || response.cash_amount || 0);
        document.getElementById('online-revenue').textContent = utils.formatMoney(response.online || response.online_amount || 0);
        document.getElementById('insurance-revenue').textContent = utils.formatMoney(response.insurance || response.insurance_amount || 0);
        
        // 绘制图表
        const dailyData = response.daily || response.daily_data || [];
        const canvas = document.getElementById('revenue-chart');
        if (!canvas) {
            console.warn('revenue-chart canvas元素未找到');
            return;
        }
        
        // 销毁已存在的图表实例（如果存在）
        const existingChart = Chart.getChart(canvas);
        if (existingChart) {
            existingChart.destroy();
        }
        
        const ctx = canvas.getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: dailyData.map(d => d.date || d.date_str),
                datasets: [{
                    label: '日收入',
                    data: dailyData.map(d => d.amount || d.revenue || 0),
                    borderColor: 'rgb(13, 110, 253)',
                    backgroundColor: 'rgba(13, 110, 253, 0.1)',
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: true
                    },
                    title: {
                        display: true,
                        text: '收入趋势图'
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            callback: function(value) {
                                return '¥' + value.toFixed(2);
                            }
                        }
                    }
                }
            }
        });
    } catch (error) {
        console.error('加载收入报表失败:', error);
        utils.showToast('加载收入报表失败', 'danger');
    }
}

    try {
        const startDate = document.getElementById('drugs-start-date').value;

        // 绘制图表

        if (!canvas) {
            console.warn('drugs-chart canvas元素未找到');
            return;
        }
        
        // 销毁已存在的图表实例
        const existingChart = Chart.getChart(canvas);
        if (existingChart) {
            existingChart.destroy();
        }
        
        const ctx = canvas.getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: dailyData.map(d => d.date || d.date_str),
                datasets: [{
                    label: '销售额',
                    data: dailyData.map(d => d.amount || 0),
                    backgroundColor: 'rgba(13, 110, 253, 0.6)',
                    borderColor: 'rgb(13, 110, 253)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: true
                    },
                    title: {
                        display: true,
                        text: '药品销售趋势图'
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            callback: function(value) {
                                return '¥' + value.toFixed(2);
                            }
                        }
                    }
                }
            }
        });
        
        // 更新药品明细表格
        const drugsList = data.drugs || data.drug_list || [];
        const tableBody = document.getElementById('drugs-detail-table');
        if (tableBody && drugsList.length > 0) {

            const existingChart = Chart.getChart(genderCanvas);
            if (existingChart) {
                existingChart.destroy();
            }
            
            const genderCtx = genderCanvas.getContext('2d');
            new Chart(genderCtx, {
                type: 'pie',
                data: {
                    labels: ['男性', '女性'],
                    datasets: [{
                        data: [data.male_count || 0, data.female_count || 0],
                        backgroundColor: ['rgba(13, 110, 253, 0.6)', 'rgba(255, 193, 7, 0.6)'],
                        borderColor: ['rgb(13, 110, 253)', 'rgb(255, 193, 7)'],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'bottom'
                        },
                        title: {
                            display: true,
                            text: '性别分布'
                        }
                    }
                }
            });
        }
        
        // 绘制年龄段分布柱状图
        const ageCanvas = document.getElementById('patients-age-chart');
        if (ageCanvas) {
            const existingChart = Chart.getChart(ageCanvas);
            if (existingChart) {
                existingChart.destroy();
            }
            
            const ageGroups = data.age_groups || {};
            const ageCtx = ageCanvas.getContext('2d');
            new Chart(ageCtx, {
                type: 'bar',
                data: {
                    labels: Object.keys(ageGroups),
                    datasets: [{
                        label: '患者数',
                        data: Object.values(ageGroups),
                        backgroundColor: 'rgba(25, 135, 84, 0.6)',
                        borderColor: 'rgb(25, 135, 84)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display: false
                        },
                        title: {
                            display: true,
                            text: '年龄段分布'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }
        
        // 绘制每日新增患者趋势图
        const dailyData = data.daily || data.daily_data || [];
        const canvas = document.getElementById('patients-chart');
        if (canvas && dailyData.length > 0) {
            const existingChart = Chart.getChart(canvas);
            if (existingChart) {
                existingChart.destroy();
            }
            
            const ctx = canvas.getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dailyData.map(d => d.date || d.date_str),
                    datasets: [{
                        label: '新增患者数',
                        data: dailyData.map(d => d.count || d.new_patients || 0),
                        borderColor: 'rgb(255, 193, 7)',
                        backgroundColor: 'rgba(255, 193, 7, 0.1)',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display: true
                        },
                        title: {
                            display: true,
                            text: '新增患者趋势图'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }
    } catch (error) {
        console.error('加载患者统计报表失败:', error);
        utils.showToast('加载患者统计报表失败', 'danger');
    }
}

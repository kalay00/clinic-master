<!-- 病历编辑页面 -->
<div class="page-header">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="#" onclick="app.navigate('dashboard')">首页</a></li>
            <li class="breadcrumb-item"><a href="#" onclick="app.navigate('treatments')">诊疗管理</a></li>
            <li class="breadcrumb-item active" id="page-title-breadcrumb">新建病历</li>
        </ol>
    </nav>
    <div class="d-flex justify-content-between align-items-center">
        <h1><i class="bi bi-file-earmark-medical"></i> <span id="page-title">新建病历</span></h1>
        <div>
            <button type="button" class="btn btn-info" onclick="window.print()">
                <i class="bi bi-printer"></i> 打印
            </button>
            <button type="button" class="btn btn-secondary" onclick="app.navigate('treatments')">
                <i class="bi bi-arrow-left"></i> 返回

<div id="medical-record-form-container"></div>

<script>
let recordId = null;
let isEdit = false;
let diagnosisType = 'western'; // western, tcm, combined

window.pageInit = async function() {
    // 从URL获取参数（支持hash路由和直接URL）
    let urlParams;
    if (window.location.hash && window.location.hash.includes('?')) {
        // 从hash中获取查询参数
        const hashQuery = window.location.hash.split('?')[1];
        urlParams = new URLSearchParams(hashQuery);
    } else {
        // 从URL search中获取查询参数
        urlParams = new URLSearchParams(window.location.search);
    }
    
    recordId = urlParams.get('id');
    const registrationId = urlParams.get('registration_id');
    isEdit = !!recordId;
    
    // 更新页面标题
    const pageTitle = isEdit ? '编辑病历' : '新建病历';
    const titleElement = document.getElementById('page-title');
    const breadcrumbElement = document.getElementById('page-title-breadcrumb');
    if (titleElement) titleElement.textContent = pageTitle;
    if (breadcrumbElement) breadcrumbElement.textContent = pageTitle;
    
    renderForm();
    
    // 如果是新建病历，根据registration_id自动填充信息
    if (!isEdit) {
        if (registrationId) {
            // 从挂号记录自动填充
            await autoFillFromRegistration(registrationId);
        } else {
            // 否则自动填充当前用户信息
            await autoFillCurrentUserInfo();
        }
    }
    
    if (isEdit) {
        loadRecordData();
    }
};

// 从挂号记录自动填充信息（挂载到全局作用域）
async function autoFillFromRegistration(registrationId) {
    try {
        console.log('autoFillFromRegistration: 开始从挂号记录填充', registrationId);
        
        // 获取挂号详情
        const registrationResponse = await RegistrationAPI.getDetail(registrationId);
        const registration = registrationResponse.data || registrationResponse;
        
        if (!registration) {
            utils.showToast('获取挂号信息失败', 'danger');
            return;
        }
        
        console.log('autoFillFromRegistration: 挂号信息', registration);
        
        // 1. 自动填充患者信息
        if (registration.patient_id) {
            try {
                const patientResponse = await PatientAPI.getDetail(registration.patient_id);
                const patient = patientResponse.data || patientResponse;
                
                if (patient) {
                    const patientIdInput = document.getElementById('patient-id');
                    const patientNameDisplay = document.getElementById('patient-name-display');
                    const patientGenderDisplay = document.getElementById('patient-gender-display');
                    const patientAgeDisplay = document.getElementById('patient-age-display');
                    const patientRecordNoDisplay = document.getElementById('patient-record-no-display');
                    
                    if (patientIdInput) patientIdInput.value = patient.id;
                    if (patientNameDisplay) patientNameDisplay.textContent = patient.name || '未知患者';
                    
                    // 性别
                    if (patientGenderDisplay) {
                        patientGenderDisplay.textContent = patient.gender === 'male' ? '男' : (patient.gender === 'female' ? '女' : '-');
                    }
                    
                    // 年龄
                    if (patientAgeDisplay && (patient.birthday || patient.birth_date)) {
                        const birthDate = new Date(patient.birthday || patient.birth_date);
                        const age = new Date().getFullYear() - birthDate.getFullYear();
                        patientAgeDisplay.textContent = age + '岁';
                    }
                    
                    // 病历号
                    const recordNo = patient.medical_record_no || patient.patient_no || patient.record_no || '-';
                    if (patientRecordNoDisplay) patientRecordNoDisplay.textContent = recordNo;
                }
            } catch (e) {
                console.error('获取患者信息失败:', e);
            }
        }
        
        // 2. 自动填充科室和医生
        if (registration.department_id) {
            const departmentSelect = document.getElementById('department-select');
            if (departmentSelect) {
                // 等待科室列表加载完成
                setTimeout(() => {
                    departmentSelect.value = registration.department_id;
                    // 触发科室选择事件，加载对应医生列表
                    if (window.loadDoctorsForMedicalRecord) {
                        window.loadDoctorsForMedicalRecord();
                    }
                    
                    // 3. 自动填充医生
                    if (registration.doctor_id) {
                        setTimeout(() => {
                            const doctorSelect = document.getElementById('doctor-select');
                            if (doctorSelect) {
                                doctorSelect.value = registration.doctor_id;
                            }
                        }, 800);
                    }
                }, 500);
            }
        } else if (registration.doctor_id) {
            // 如果没有科室ID，直接填充医生（医生选择器会自动加载对应科室）
            setTimeout(() => {
                const doctorSelect = document.getElementById('doctor-select');
                if (doctorSelect) {
                    doctorSelect.value = registration.doctor_id;
                }
            }, 1000);
        }
        
        // 4. 自动填充挂号记录
        const registrationIdInput = document.getElementById('registration-id');
        const registrationDisplay = document.getElementById('registration-display');
        
        if (registrationIdInput) {
            registrationIdInput.value = registration.id;
        }
        if (registrationDisplay) {
            const displayText = `${registration.registration_date || registration.date || ''} - ${registration.doctor_name || '未知医生'}`;
            registrationDisplay.value = displayText;
        }
        
        console.log('autoFillFromRegistration: 自动填充完成');
    } catch (error) {
        console.error('从挂号记录自动填充失败:', error);
        utils.showToast('自动填充失败: ' + (error.message || '未知错误'), 'warning');
    }
}

// 自动填充当前用户信息（科室和医生）
async function autoFillCurrentUserInfo() {
    try {
        // 获取当前用户信息
        const userResponse = await UserAPI.getCurrentUserInfo();
        const currentUser = userResponse.data;
        
        if (!currentUser) {
            console.warn('无法获取当前用户信息');
            return;
        }
        
        // 获取当前用户的医生信息（通过user_id查找医生）
        // 注意：需要先获取用户ID，然后查找对应的医生记录
        const userId = currentUser.id;
        
        // 查找该用户对应的医生
        try {
            const doctorsResponse = await DoctorAPI.getList({ page: 1, page_size: 100 });
            const doctors = doctorsResponse.data?.items || doctorsResponse.items || [];
            const currentDoctor = doctors.find(d => d.user_id === userId);
            
            if (currentDoctor) {
                // 自动填充医生
                const doctorSelect = document.getElementById('doctor-select');
                if (doctorSelect && currentDoctor.id) {
                    doctorSelect.value = currentDoctor.id;
                }
                
                // 自动填充科室
                if (currentDoctor.department_id) {
                    const departmentSelect = document.getElementById('department-select');
                    if (departmentSelect) {
                        // 等待科室列表加载完成
                        setTimeout(() => {
                            departmentSelect.value = currentDoctor.department_id;
                            // 触发科室选择事件，加载对应医生列表
                            if (window.loadDoctorsForMedicalRecord) {
                                window.loadDoctorsForMedicalRecord();
                            }
                        }, 500);
                    }
                }
                
                console.log('已自动填充医生和科室信息', {
                    doctor: currentDoctor.name,
                    department: currentDoctor.department_name
                });
            } else {
                console.warn('当前用户未关联医生信息');
            }
        } catch (error) {
            console.error('获取医生信息失败:', error);
        }
    } catch (error) {
        console.error('自动填充用户信息失败:', error);
    }
}

// 加载科室列表
async function loadDepartmentsForForm() {
    try {
        const response = await DepartmentAPI.getList({ page: 1, page_size: 100 });
        const departments = response.data?.items || response.items || response || [];
        
        const departmentSelect = document.getElementById('department-select');
        if (departmentSelect) {
            departmentSelect.innerHTML = '<option value="">请选择科室</option>';
            departments.forEach(dept => {
                const option = document.createElement('option');
                option.value = dept.id;
                option.textContent = dept.name || dept.code || '未知科室';
                departmentSelect.appendChild(option);
            });
        }
    } catch (error) {
        console.error('加载科室列表失败:', error);
        utils.showToast('加载科室列表失败', 'warning');
    }
}

// 加载医生列表（根据选择的科室）（挂载到全局作用域）
window.loadDoctorsForMedicalRecord = async function() {
    const departmentSelect = document.getElementById('department-select');
    const doctorSelect = document.getElementById('doctor-select');
    
    if (!departmentSelect || !doctorSelect) return;
    
    const departmentId = departmentSelect.value;
    doctorSelect.innerHTML = '<option value="">请先选择科室</option>';
    
    if (!departmentId) return;
    
    try {
        const response = await DoctorAPI.getList({ 
            page: 1, 
            page_size: 100,
            department_id: departmentId
        });
        const doctors = response.data?.items || response.items || response || [];
        
        doctorSelect.innerHTML = '<option value="">请选择医生</option>';
        doctors.forEach(doctor => {
            const option = document.createElement('option');
            option.value = doctor.id;
            option.textContent = doctor.name || doctor.employee_no || '未知医生';
            doctorSelect.appendChild(option);
        });
        
        if (doctors.length === 0) {
            doctorSelect.innerHTML = '<option value="">该科室暂无医生</option>';
        }
    } catch (error) {
        console.error('加载医生列表失败:', error);
        utils.showToast('加载医生列表失败', 'warning');
        doctorSelect.innerHTML = '<option value="">加载失败</option>';
    }
};

// 绑定表单事件
function bindFormEvents() {
    // 绑定诊断类型切换事件
    const diagnosisRadios = document.querySelectorAll('input[name="diagnosis_type"]');
    diagnosisRadios.forEach(radio => {
        radio.addEventListener('change', (e) => {
            diagnosisType = e.target.value;
            toggleDiagnosisSections();
        });
    });
    
    // 绑定表单提交
    const form = document.getElementById('medical-record-form');
    if (form) {
        form.addEventListener('submit', handleSubmit);
    }
}

// 切换诊断类型显示
function toggleDiagnosisSections() {
    const western = document.getElementById('western-diagnosis');
    const tcm = document.getElementById('tcm-diagnosis');
    const tcmFour = document.getElementById('tcm-four-exam');
    
    if (diagnosisType === 'western') {
        western.style.display = 'block';
        tcm.style.display = 'none';
        tcmFour.style.display = 'none';
    } else if (diagnosisType === 'tcm') {
        western.style.display = 'none';
        tcm.style.display = 'block';
        tcmFour.style.display = 'block';
    } else { // combined
        western.style.display = 'block';
        tcm.style.display = 'block';
        tcmFour.style.display = 'block';
    }
}

// 选择挂号记录（挂载到全局作用域）
window.selectRegistration = async function() {
    try {
        const patientId = document.getElementById('patient-id')?.value;
        if (!patientId) {
            utils.showToast('请先选择患者', 'warning');
            return;
        }
        
        // 加载该患者的挂号记录（不限制status，获取所有状态的挂号）
        // 注意：后端可能使用pending/completed/cancelled，不使用confirmed
        console.log('开始获取挂号记录，患者ID:', patientId);
        
        const response = await RegistrationAPI.getList({
            page: 1,
            page_size: 100,
            patient_id: patientId
            // 不限制status，获取所有状态的挂号，然后在前端过滤
        });
        
        console.log('挂号API响应:', response);
        
        let registrations = response.data?.items || response.items || response || [];
        
        console.log('获取到的挂号记录（原始）:', registrations);
        
        // 检查是否已有选中的挂号记录（编辑模式）
        const existingRegistrationId = document.getElementById('registration-id')?.value;
        console.log('已有挂号ID:', existingRegistrationId, '是否编辑模式:', isEdit);
        
        // 先过滤掉已取消和已完成的挂号，只保留pending（待就诊）状态的
        // 但如果是编辑模式，也要包含已选择的挂号记录（即使状态不是pending）
        registrations = registrations.filter(reg => {
            const status = reg.status;
            const regId = String(reg.id);
            const isSelected = existingRegistrationId && String(existingRegistrationId) === regId;
            // 只保留pending状态的挂号（待就诊），或者已选择的挂号记录
            const isValid = status === 'pending' || isSelected;
            console.log(`挂号 ${reg.id} 状态: ${status}, 是否已选择: ${isSelected}, 是否有效: ${isValid}`);
            return isValid;
        });
        
        console.log('过滤pending状态后的挂号记录:', registrations);
        
        // 如果是新建模式，过滤掉已有病历的挂号记录（未就医的挂号）
        if (!isEdit) {
            try {
                const medicalRecordsResponse = await TreatmentAPI.getList({
                    patient_id: patientId,
                    page: 1,
                    page_size: 1000
                });
                const medicalRecords = medicalRecordsResponse.data?.items || medicalRecordsResponse.items || [];
                
                console.log('获取到的病历记录:', medicalRecords);
                
                // 将registration_id转换为字符串Set，确保格式一致
                const visitedRegistrationIds = new Set(
                    medicalRecords
                        .map(record => record.registration_id)
                        .filter(id => id)
                        .map(id => String(id)) // 确保都是字符串格式
                );
                
                console.log('已有病历的挂号ID:', Array.from(visitedRegistrationIds));
                
                // 只保留没有对应病历的挂号记录（未就医）
                // 确保比较时格式一致
                registrations = registrations.filter(reg => {
                    const regId = String(reg.id);
                    const isVisited = visitedRegistrationIds.has(regId);
                    console.log(`挂号 ${regId} 是否已就医: ${isVisited}`);
                    return !isVisited;
                });
                
                console.log('过滤后的挂号记录数量:', registrations.length);
            } catch (error) {
                console.warn('获取病历记录失败，显示所有pending状态的挂号记录:', error);
                // 如果获取病历失败，仍然显示所有pending状态的挂号记录
            }
        }
        
        if (registrations.length === 0) {
            utils.showToast('该患者暂无未就医的挂号记录（待就诊状态）', 'warning');
            return;
        }
        
        // 显示挂号选择器（使用简单的select弹窗）
        const optionsHtml = registrations.map(reg => {
            const date = reg.registration_date || reg.date || '未知日期';
            const doctor = reg.doctor_name || '未知医生';
            const dept = reg.department_name || '未知科室';
            const isSelected = existingRegistrationId && String(existingRegistrationId) === String(reg.id);
            return `<option value="${reg.id}" ${isSelected ? 'selected' : ''}>${date} - ${doctor} - ${dept}</option>`;
        }).join('');
        
        const selectHtml = `
            <div class="mb-3">
                <label class="form-label">选择挂号记录</label>
                <select class="form-select" id="registration-select-modal">
                    <option value="">请选择挂号记录</option>
                    ${optionsHtml}
                </select>
            </div>
        `;
        
        const confirmed = await ModalComponents.showFormModal({
            title: '选择挂号记录',
            formHtml: selectHtml,
            onSubmit: async () => {
                const selectElement = document.getElementById('registration-select-modal');
                const selectedId = selectElement?.value;
                
                if (!selectedId) {
                    utils.showToast('请选择挂号记录', 'warning');
                    return false;
                }
                
                const selectedReg = registrations.find(r => String(r.id) === String(selectedId));
                if (selectedReg) {
                    document.getElementById('registration-id').value = selectedReg.id;
                    const displayText = `${selectedReg.registration_date || selectedReg.date} - ${selectedReg.doctor_name || '未知医生'}`;
                    document.getElementById('registration-display').value = displayText;
                    
                    // 自动填充医生和科室
                    if (selectedReg.doctor_id) {
                        const doctorSelect = document.getElementById('doctor-select');
                        if (doctorSelect) {
                            doctorSelect.value = selectedReg.doctor_id;
                        }
                    }
                    if (selectedReg.department_id) {
                        const deptSelect = document.getElementById('department-select');
                        if (deptSelect) {
                            deptSelect.value = selectedReg.department_id;
                            loadDoctorsForMedicalRecord();
                        }
                    }
                    
                    utils.showToast('已选择挂号记录', 'success');
                    return true;
                }
                return false;
            }
        });
    } catch (error) {
        console.error('选择挂号记录失败:', error);
        utils.showToast('选择挂号记录失败: ' + (error.message || '未知错误'), 'danger');
    }
}

// 加载病历数据
async function loadRecordData() {
    if (!recordId) {
        console.warn('病历ID为空，无法加载数据');
        return;
    }
    
    const container = document.getElementById('medical-record-form-container');
    if (!container) {
        console.warn('表单容器未找到');
        return;
    }
    
    const loadingId = LoadingComponents.show('加载中...', container);
    
    try {
        // 调用API获取病历详情
        const response = await TreatmentAPI.getMedicalRecordDetail(recordId);
        // API返回格式：{code: 200, data: {...}}，需要提取data字段
        const record = response.data || response;
        
        if (!record || !record.id) {
            utils.showToast('病历不存在', 'danger');
            LoadingComponents.hide(loadingId);
            return;
        }
        
        // 填充患者信息
        if (record.patient_id) {
            document.getElementById('patient-id')?.setAttribute('value', record.patient_id);
            // 获取患者详情并显示患者信息
            try {
                const patientResponse = await PatientAPI.getDetail(record.patient_id);
                const patient = patientResponse.data || patientResponse;
                if (patient) {
                    const patientNameEl = document.getElementById('patient-name-display');
                    const patientGenderEl = document.getElementById('patient-gender-display');
                    const patientAgeEl = document.getElementById('patient-age-display');
                    const patientRecordNoEl = document.getElementById('patient-record-no-display');
                    
                    if (patientNameEl) {
                        patientNameEl.textContent = patient.name || patient.real_name || '-';
                    }
                    
                    // 填充性别
                    if (patientGenderEl) {
                        const gender = patient.gender || patient.sex;
                        if (gender === 'male' || gender === '男' || gender === 'M') {
                            patientGenderEl.textContent = '男';
                        } else if (gender === 'female' || gender === '女' || gender === 'F') {
                            patientGenderEl.textContent = '女';
                        } else {
                            patientGenderEl.textContent = '-';
                        }
                    }
                    
                    // 填充年龄
                    if (patientAgeEl) {
                        if (patient.age) {
                            patientAgeEl.textContent = patient.age + '岁';
                        } else if (patient.birthday || patient.birth_date) {
                            try {
                                const birthDate = new Date(patient.birthday || patient.birth_date);
                                const today = new Date();
                                const age = today.getFullYear() - birthDate.getFullYear();
                                const monthDiff = today.getMonth() - birthDate.getMonth();
                                if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                                    age--;
                                }
                                patientAgeEl.textContent = age + '岁';
                            } catch (e) {
                                patientAgeEl.textContent = '-';
                            }
                        } else {
                            patientAgeEl.textContent = '-';
                        }
                    }
                    
                    // 填充病历号
                    if (patientRecordNoEl) {
                        const recordNo = patient.medical_record_no || patient.patient_no || patient.record_no || '-';
                        patientRecordNoEl.textContent = recordNo;
                    }
                }
            } catch (e) {
                console.warn('获取患者信息失败:', e);
            }
        }
        
        // 填充科室和医生信息
        if (record.doctor_id) {
            // 先加载科室列表，然后设置科室和医生
            try {
                // 先获取医生信息
                const doctorResponse = await DoctorAPI.getDetail(record.doctor_id);
                const doctor = doctorResponse.data || doctorResponse;
                if (doctor) {
                    // 先加载科室列表
                    await loadDepartmentsForForm();
                    
                    // 设置科室（需要先加载科室选项）
                    if (doctor.department_id) {
                        const departmentSelect = document.getElementById('department-select');
                        if (departmentSelect) {
                            // 延迟设置，确保科室选项已加载
                            setTimeout(() => {
                                departmentSelect.value = doctor.department_id;
                                // 触发change事件，更新医生列表
                                departmentSelect.dispatchEvent(new Event('change', { bubbles: true }));
                                
                                // 再延迟设置医生，确保医生列表已更新
                                setTimeout(() => {
                                    const doctorSelect = document.getElementById('doctor-select');
                                    if (doctorSelect && doctor.id) {
                                        doctorSelect.value = doctor.id;
                                    }
                                }, 300);
                            }, 300);
                        }
                    } else {
                        // 如果没有科室ID，直接设置医生（可能需要先加载所有医生）
                        setTimeout(() => {
                            const doctorSelect = document.getElementById('doctor-select');
                            if (doctorSelect && doctor.id) {
                                doctorSelect.value = doctor.id;
                            }
                        }, 500);
                    }
                }
            } catch (e) {
                console.warn('获取医生信息失败:', e);
            }
        }
        
        // 填充挂号记录
        if (record.registration_id) {
            const registrationIdEl = document.getElementById('registration-id');
            if (registrationIdEl) {
                registrationIdEl.setAttribute('value', record.registration_id);
            }
            
            // 获取挂号详情并显示
            try {
                const regResponse = await RegistrationAPI.getDetail(record.registration_id);
                const registration = regResponse.data || regResponse;
                if (registration) {
                    // 更新显示字段
                    const regDisplayEl = document.getElementById('registration-display');
                    if (regDisplayEl) {
                        const date = registration.registration_date || registration.date || '';
                        const doctor = registration.doctor_name || '未知医生';
                        regDisplayEl.value = `${date} - ${doctor}`;
                    }
                    
                    const regNoEl = document.getElementById('registration-no-display');
                    if (regNoEl) {
                        regNoEl.textContent = registration.registration_no || '-';
                    }
                }
            } catch (e) {
                console.warn('获取挂号信息失败:', e);
            }
        }
        
        // 填充病历内容
        if (record.chief_complaint) {
            const chiefComplaintEl = document.getElementById('chief-complaint');
            if (chiefComplaintEl) chiefComplaintEl.value = record.chief_complaint || '';
        }
        
        if (record.present_illness) {
            const presentIllnessEl = document.getElementById('present-illness');
            if (presentIllnessEl) presentIllnessEl.value = record.present_illness || '';
        }
        
        if (record.past_history) {
            const pastHistoryEl = document.getElementById('past-history');
            if (pastHistoryEl) pastHistoryEl.value = record.past_history || '';
        }
        
        if (record.physical_examination) {
            const physicalExamEl = document.getElementById('physical-examination');
            if (physicalExamEl) physicalExamEl.value = record.physical_examination || '';
        }
        
        if (record.diagnosis) {
            const diagnosisEl = document.getElementById('diagnosis');
            if (diagnosisEl) diagnosisEl.value = record.diagnosis || '';
        }
        
        if (record.treatment_plan) {
            const treatmentPlanEl = document.getElementById('treatment-plan');
            if (treatmentPlanEl) treatmentPlanEl.value = record.treatment_plan || '';
        }
        
        if (record.remark) {
            const remarkEl = document.getElementById('remark');
            if (remarkEl) remarkEl.value = record.remark || '';
        }
        
        utils.showToast('病历数据加载成功', 'success');
        
    } catch (error) {
        console.error('加载病历数据失败:', error);
        const errorMsg = error.message || error.data?.message || '加载病历数据失败';
        utils.showToast(errorMsg, 'danger');
    } finally {
        LoadingComponents.hide(loadingId);
    }
}

// 处理表单提交
async function handleSubmit(e) {
    e.preventDefault();
    e.stopPropagation();
    
    const form = e.target;
    if (!form.checkValidity()) {
        form.classList.add('was-validated');
        return;
    }
    
    // 收集表单数据
    const patientId = document.getElementById('patient-id')?.value;
    const doctorId = document.getElementById('doctor-select')?.value;
    const registrationId = document.getElementById('registration-id')?.value;
    
    // 验证必填字段
    if (!patientId) {
        utils.showToast('请选择患者', 'warning');
        return;
    }
    if (!doctorId) {
        utils.showToast('请选择医生', 'warning');
        return;
    }
    if (!registrationId) {
        utils.showToast('请选择挂号记录', 'warning');
        return;
    }
    
    // 构建提交数据（匹配后端API格式）
    const data = {
        registration_id: registrationId,
        patient_id: patientId,
        doctor_id: doctorId,
        chief_complaint: document.getElementById('chief-complaint')?.value || null,
        present_illness: document.getElementById('present-illness')?.value || null,
        past_history: document.getElementById('past-history')?.value || null,
        physical_examination: document.getElementById('physical-examination')?.value || null,
        diagnosis: document.getElementById('diagnosis')?.value || null,
        treatment_plan: document.getElementById('treatment-plan')?.value || null
    };
    
    // 根据诊断类型添加相应字段
    if (diagnosisType === 'tcm' || diagnosisType === 'combined') {
        // 中医相关字段（如果需要，可以在后续版本中添加）
        // data.tcm_syndrome = document.getElementById('tcm-syndrome')?.value || null;
    }
    
    try {
        if (isEdit) {
            await TreatmentAPI.updateMedicalRecord(recordId, data);
            utils.showToast('更新病历成功', 'success');
            setTimeout(() => {
                app.navigate('treatments');
            }, 1000);
        } else {
            const response = await TreatmentAPI.createMedicalRecord(data);
            utils.showToast('保存病历成功', 'success');
            
            // 保存成功后，提示是否开具处方
            const confirmed = await ModalComponents.confirm({
                title: '保存成功',
                message: '病历已保存成功，是否开具处方？',
                confirmText: '是，开具处方',
                cancelText: '否，返回列表',
                confirmType: 'success'
            });
            
            if (confirmed) {
                // 获取患者和医生信息，用于处方
                const patientName = document.getElementById('patient-name-display')?.textContent || '';
                const doctorName = document.getElementById('doctor-select')?.selectedOptions[0]?.text || '';
                const patientIdValue = patientId;
                const doctorIdValue = doctorId;
                
                // 跳转到新增处方页面，传递患者和医生信息
                if (window.app && window.app.navigate) {
                    const params = new URLSearchParams({
                        patient_id: patientIdValue,
                        doctor_id: doctorIdValue,
                        patient_name: patientName,
                        doctor_name: doctorName
                    });
                    window.app.navigate(`prescriptions?action=add&${params.toString()}`);
                } else {
                    window.location.href = `/views/treatments/prescriptions.html?action=add&patient_id=${patientIdValue}&doctor_id=${doctorIdValue}&patient_name=${encodeURIComponent(patientName)}&doctor_name=${encodeURIComponent(doctorName)}`;
                }
            } else {
                // 返回列表
                setTimeout(() => {
                    app.navigate('treatments');
                }, 500);
            }
        }
        
    } catch (error) {
        console.error('保存病历失败:', error);
        const errorMsg = error.message || error.data?.message || '保存病历失败';
        utils.showToast(errorMsg, 'danger');
    }
}

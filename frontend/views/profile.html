<!-- 个人中心页面 -->
<div class="page-header">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="#" onclick="app.navigate('dashboard')">首页</a></li>
            <li class="breadcrumb-item active">个人中心</li>
        </ol>
    </nav>
    <h1><i class="bi bi-person-circle"></i> 个人中心</h1>
</div>

<!-- 个人信息卡片 -->
<div class="row">
    <div class="col-md-8">
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-person"></i> 基本信息</h5>
            </div>
            <div class="card-body">
                <form id="profile-form">
                    <div class="row mb-3">
                        <label for="username" class="col-sm-3 col-form-label">用户名</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control" id="username" readonly disabled>
                            <small class="text-muted">用户名不可修改</small>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <label for="real_name" class="col-sm-3 col-form-label">姓名 <span class="text-danger">*</span></label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control" id="real_name" name="real_name" required>
                        </div>
                    </div>
                    
                    <div class="row mb-3" id="phone-row">
                        <label for="phone" class="col-sm-3 col-form-label">手机号</label>
                        <div class="col-sm-9">
                            <input type="tel" class="form-control" id="phone" name="phone" placeholder="请输入手机号">
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <label for="email" class="col-sm-3 col-form-label">邮箱</label>
                        <div class="col-sm-9">
                            <input type="email" class="form-control" id="email" name="email" placeholder="请输入邮箱地址">
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-sm-9 offset-sm-3">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> 保存修改
                            </button>
                            <button type="button" class="btn btn-secondary" onclick="resetForm()">
                                <i class="bi bi-arrow-counterclockwise"></i> 重置
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- 修改密码卡片 -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-lock"></i> 修改密码</h5>
            </div>
            <div class="card-body">
                <form id="password-form">
                    <div class="row mb-3">
                        <label for="old_password" class="col-sm-3 col-form-label">当前密码 <span class="text-danger">*</span></label>
                        <div class="col-sm-9">
                            <input type="password" class="form-control" id="old_password" name="old_password" required>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <label for="new_password" class="col-sm-3 col-form-label">新密码 <span class="text-danger">*</span></label>
                        <div class="col-sm-9">
                            <input type="password" class="form-control" id="new_password" name="new_password" required minlength="6">
                            <small class="text-muted">密码长度至少6位</small>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <label for="confirm_password" class="col-sm-3 col-form-label">确认新密码 <span class="text-danger">*</span></label>
                        <div class="col-sm-9">
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="6">
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-sm-9 offset-sm-3">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-key"></i> 修改密码
                            </button>
                            <button type="button" class="btn btn-secondary" onclick="resetPasswordForm()">
                                <i class="bi bi-arrow-counterclockwise"></i> 重置
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <div class="col-md-4">
        <!-- 账户信息卡片 -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-info-circle"></i> 账户信息</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="text-muted small">用户ID</label>
                    <div id="user-id" class="text-break"></div>
                </div>
                <div class="mb-3">
                    <label class="text-muted small">账户状态</label>
                    <div>
                        <span class="badge bg-success" id="user-status">激活</span>
                    </div>
                </div>
                <div class="mb-3" id="tenant-info-container" style="display: none;">
                    <label class="text-muted small">所属租户</label>
                    <div id="tenant-info"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let currentUserData = null;

/**
 * 页面初始化
 */
window.pageInit = async function() {
    await loadUserInfo();
    bindEvents();
};

/**
 * 绑定事件
 */
function bindEvents() {
    // 基本信息表单提交
    const profileForm = document.getElementById('profile-form');
    if (profileForm) {
        profileForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            await saveProfile();
        });
    }
    
    // 密码表单提交
    const passwordForm = document.getElementById('password-form');
    if (passwordForm) {
        passwordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            await changePassword();
        });
    }
}

/**
 * 加载用户信息
 */
async function loadUserInfo() {
    try {
        const response = await UserAPI.getCurrentUserInfo();
        // 处理不同的响应格式
        if (response && typeof response === 'object') {
            if (response.code === 200 || response.code === undefined) {
                // 如果返回的是数据对象（code=200或没有code字段）
                currentUserData = response.data || response;
                fillForm(currentUserData);
            } else {
                // 如果返回的是错误响应
                const errorMsg = response.message || '获取用户信息失败';
                showMessage('获取用户信息失败: ' + errorMsg, 'error');
            }
        } else {
            // 如果返回的是数据对象（没有code字段）
            currentUserData = response;
            fillForm(currentUserData);
        }
    } catch (error) {
        console.error('加载用户信息失败:', error);
        const errorMsg = error.message || error.response?.data?.message || '未知错误';
        showMessage('加载用户信息失败: ' + errorMsg, 'error');
    }
}

/**
 * 填充表单
 */
function fillForm(userData) {
    // 基本信息
    document.getElementById('username').value = userData.username || '';
    document.getElementById('real_name').value = userData.real_name || '';
    document.getElementById('email').value = userData.email || '';
    
    // 平台管理员不显示手机号字段
    const phoneRow = document.getElementById('phone-row');
    if (userData.is_platform_admin) {
        if (phoneRow) phoneRow.style.display = 'none';
    } else {
        if (phoneRow) phoneRow.style.display = 'flex';
        document.getElementById('phone').value = userData.phone || '';
    }
    
    // 账户信息
    document.getElementById('user-id').textContent = userData.id || '';
    
    // 显示租户信息：如果有租户列表，无论是普通用户还是平台管理员都显示
    if (userData.tenants && Array.isArray(userData.tenants) && userData.tenants.length > 0) {
        document.getElementById('tenant-info-container').style.display = 'block';
        // 显示租户名称或代码（后端返回的字段是 name 和 code）
        const tenantInfo = userData.tenants.map(t => {
            // 支持多种字段名格式：name/code 或 tenant_name/tenant_code
            const tenantName = t.name || t.tenant_name;
            const tenantCode = t.code || t.tenant_code;
            
            if (tenantName) {
                return tenantCode ? `${tenantName} (${tenantCode})` : tenantName;
            } else if (tenantCode) {
                return tenantCode;
            } else {
                return t.id || t.tenant_id || '未知租户';
            }
        }).join(', ');
        document.getElementById('tenant-info').textContent = tenantInfo;
    } else if (userData.tenant_id && !userData.is_platform_admin) {
        // 对于普通用户，即使没有 tenants 数组，如果有 tenant_id 也显示
        document.getElementById('tenant-info-container').style.display = 'block';
        document.getElementById('tenant-info').textContent = userData.tenant_id;
    } else {
        // 没有租户信息，隐藏租户信息容器
        document.getElementById('tenant-info-container').style.display = 'none';
    }
}

/**
 * 保存基本信息
 */
async function saveProfile() {
    const form = document.getElementById('profile-form');
    const formData = new FormData(form);
    
    const data = {
        real_name: formData.get('real_name') || null,
        email: formData.get('email') || null,
    };
    
    // 只有非平台管理员才能修改手机号
    if (currentUserData && !currentUserData.is_platform_admin) {
        data.phone = formData.get('phone') || null;
    }
    
    // 移除空值
    Object.keys(data).forEach(key => {
        if (data[key] === null || data[key] === '') {
            delete data[key];
        }
    });
    
    if (Object.keys(data).length === 0) {
        showMessage('请至少修改一项信息', 'warning');
        return;
    }
    
    // 验证邮箱格式
    if (data.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) {
        showMessage('邮箱格式不正确', 'error');
        return;
    }
    
    // 验证手机号格式（如果提供且不是平台管理员）
    if (data.phone && !currentUserData?.is_platform_admin && !/^1[3-9]\d{9}$/.test(data.phone)) {
        showMessage('手机号格式不正确，请输入11位手机号', 'error');
        return;
    }
    
    try {
        const submitBtn = form.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>保存中...';
        
        const response = await UserAPI.updateCurrentUser(data);
        
        if (response.code === 200) {
            showMessage('保存成功', 'success');
            // 更新当前用户数据
            currentUserData = { ...currentUserData, ...response.data };
            fillForm(currentUserData);
            // 更新头部显示的用户名
            if (window.app && window.app.updateUserInfo) {
                window.app.updateUserInfo();
            }
        } else {
            showMessage('保存失败: ' + response.message, 'error');
        }
    } catch (error) {
        console.error('保存失败:', error);
        showMessage('保存失败，请稍后重试', 'error');
    } finally {
        const submitBtn = form.querySelector('button[type="submit"]');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="bi bi-check-circle"></i> 保存修改';
    }
}

/**
 * 修改密码
 */
async function changePassword() {
    const form = document.getElementById('password-form');
    const formData = new FormData(form);
    
    const oldPassword = formData.get('old_password');
    const newPassword = formData.get('new_password');
    const confirmPassword = formData.get('confirm_password');
    
    // 验证必填项
    if (!oldPassword || !newPassword || !confirmPassword) {
        showMessage('请填写所有密码字段', 'warning');
        return;
    }
    
    // 验证新密码长度
    if (newPassword.length < 6) {
        showMessage('新密码长度至少6位', 'error');
        return;
    }
    
    // 验证两次输入的新密码是否一致
    if (newPassword !== confirmPassword) {
        showMessage('两次输入的新密码不一致', 'error');
        return;
    }
    
    // 验证新密码不能与旧密码相同
    if (oldPassword === newPassword) {
        showMessage('新密码不能与当前密码相同', 'error');
        return;
    }
    
    try {
        const submitBtn = form.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>修改中...';
        
        const response = await UserAPI.updateCurrentUser({
            password: newPassword
        });
        
        if (response.code === 200) {
            showMessage('密码修改成功，请重新登录', 'success');
            // 清空表单
            resetPasswordForm();
            // 延迟跳转到登录页
            setTimeout(() => {
                if (window.app && window.app.logout) {
                    window.app.logout();
                } else {
                    window.location.href = '/login.html';
                }
            }, 2000);
        } else {
            showMessage('密码修改失败: ' + response.message, 'error');
        }
    } catch (error) {
        console.error('修改密码失败:', error);
        showMessage('修改密码失败，请稍后重试', 'error');
    } finally {
        const submitBtn = form.querySelector('button[type="submit"]');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="bi bi-key"></i> 修改密码';
    }
}

/**
 * 重置表单
 */
function resetForm() {
    if (currentUserData) {
        fillForm(currentUserData);
    }
}

/**
 * 重置密码表单
 */
function resetPasswordForm() {
    const form = document.getElementById('password-form');
    if (form) {
        form.reset();
    }
}

/**
 * 显示消息
 */
function showMessage(message, type = 'info') {
    // 使用全局的消息提示函数（如果存在）
    if (window.showMessage) {
        window.showMessage(message, type);
    } else if (window.toast) {
        window.toast(message, type);
    } else {
        alert(message);
    }
}
</script>

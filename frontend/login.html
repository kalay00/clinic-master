<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>登录 - 诊所管理系统</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- 自定义CSS -->
    <link href="/css/main.css" rel="stylesheet">
    <!-- 错误提示组件样式 -->
    <link href="/css/error-handler.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景动画效果 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* 登录容器 */
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            z-index: 1;
        }

        .login-container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: center;
        }

        /* 左侧信息区域 */
        .login-info {
            color: white;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }

        .login-info .logo-section {
            margin-bottom: 3rem;
        }

        .login-info .logo-section i {
            font-size: 4rem;
            margin-bottom: 1rem;
            display: block;
            opacity: 0.95;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .login-info h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.2;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .login-info .subtitle {
            font-size: 1.25rem;
            opacity: 0.9;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .login-info .features {
            list-style: none;
            padding: 0;
            margin-top: 2rem;
        }

        .login-info .features li {
            padding: 0.75rem 0;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            opacity: 0.9;
        }

        .login-info .features li i {
            font-size: 1.25rem;
            margin-right: 1rem;
            color: rgba(255, 255, 255, 0.8);
        }

        /* 右侧登录卡片 */
        .login-card-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            padding: 3rem;
            width: 100%;
            max-width: 680px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 25px 70px rgba(0, 0, 0, 0.35),
                0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        .login-card-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-card-header .card-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .login-card-header .card-icon i {
            font-size: 2.5rem;
            color: white;
        }

        .login-card-header h2 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 0.5rem;
        }

        .login-card-header p {
            color: #718096;
            font-size: 0.95rem;
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            font-size: 0.95rem;
        }

        .form-label i {
            margin-right: 0.5rem;
            color: #667eea;
            font-size: 1.1rem;
        }

        .form-control {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 0.875rem 1.25rem;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #f7fafc;
        }

        .form-control:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            outline: none;
        }

        .form-control::placeholder {
            color: #a0aec0;
        }

        .form-text {
            font-size: 0.875rem;
            color: #718096;
            margin-top: 0.5rem;
        }

        .form-check {
            margin-bottom: 1.5rem;
        }

        .form-check-input {
            width: 1.25rem;
            height: 1.25rem;
            border-radius: 6px;
            border: 2px solid #e2e8f0;
            cursor: pointer;
        }

        .form-check-input:checked {
            background-color: #667eea;
            border-color: #667eea;
        }

        .form-check-label {
            color: #4a5568;
            font-size: 0.95rem;
            cursor: pointer;
            margin-left: 0.5rem;
        }

        /* 按钮样式 */
        .btn-login {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            margin-bottom: 1.5rem;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* 错误提示 */
        .alert {
            border-radius: 12px;
            border: none;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
        }

        .alert-danger {
            background: #fed7d7;
            color: #c53030;
        }

        .alert-info {
            background: #bee3f8;
            color: #2c5282;
        }

        /* 链接样式 */
        .forgot-password {
            text-align: center;
            margin-top: 1rem;
        }

        .forgot-password a {
            color: #667eea;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .forgot-password a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        /* 租户信息 */
        .tenant-info {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
        }

        .tenant-info i {
            color: #667eea;
            margin-right: 0.5rem;
        }

        /* 响应式设计 */
        @media (max-width: 992px) {
            .login-container {
                grid-template-columns: 1fr;
                gap: 2rem;
            }

            .login-info {
                text-align: center;
                padding: 1.5rem;
            }

            .login-info h1 {
                font-size: 2rem;
            }

            .login-info .subtitle {
                font-size: 1.1rem;
            }

            .login-card {
                padding: 2.5rem 2rem;
            }
        }

        @media (max-width: 768px) {
            .login-wrapper {
                padding: 1rem 0.5rem;
            }

            .login-card {
                padding: 2rem 1.5rem;
                border-radius: 20px;
            }

            .login-card-header h2 {
                font-size: 1.5rem;
            }

            .login-info h1 {
                font-size: 1.75rem;
            }

            .login-info .features li {
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 1.5rem 1rem;
            }

            .login-card-header .card-icon {
                width: 60px;
                height: 60px;
            }

            .login-card-header .card-icon i {
                font-size: 2rem;
            }

            .login-info .logo-section i {
                font-size: 3rem;
            }

            .login-info h1 {
                font-size: 1.5rem;
            }
        }

        /* 加载动画 */
        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
            border-width: 0.15em;
        }

        /* 输入框图标容器 */
        .input-group-icon {
            position: relative;
        }

        .input-group-icon .form-control {
            padding-left: 3rem;
        }

        .input-group-icon i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            z-index: 1;
        }

        .input-group-icon .form-control:focus + i,
        .input-group-icon .form-control:not(:placeholder-shown) + i {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <!-- 左侧信息区域 -->
            <div class="login-info">
                <div class="logo-section">
                    <i class="bi bi-hospital"></i>
                    <h1 id="project-name">华宣诊所管理系统</h1>
                    <p class="subtitle">专业的医疗管理解决方案，让医疗管理更简单、更高效</p>
                </div>
                <ul class="features">
                    <li>
                        <i class="bi bi-shield-check"></i>
                        <span>安全可靠的数据保护</span>
                    </li>
                    <li>
                        <i class="bi bi-lightning-charge"></i>
                        <span>快速响应的操作体验</span>
                    </li>
                    <li>
                        <i class="bi bi-graph-up-arrow"></i>
                        <span>智能化的数据分析</span>
                    </li>
                    <li>
                        <i class="bi bi-people"></i>
                        <span>完善的用户权限管理</span>
                    </li>
                </ul>
            </div>

            <!-- 右侧登录卡片 -->
            <div class="login-card-wrapper">
                <div class="login-card">
                    <div class="login-card-header">
                        <div class="card-icon">
                            <i class="bi bi-person-circle"></i>
                        </div>
                        <h2>欢迎回来</h2>
                        <p>请登录您的账户以继续</p>
                    </div>
                    
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="username" class="form-label">
                                <i class="bi bi-person"></i>
                                用户名
                            </label>
                            <div class="input-group-icon">
                                <input 
                                    type="text" 
                                    class="form-control" 
                                    id="username" 
                                    name="username" 
                                    placeholder="请输入用户名"
                                    required 
                                    autofocus
                                >
                                <i class="bi bi-person"></i>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="password" class="form-label">
                                <i class="bi bi-lock"></i>
                                密码
                            </label>
                            <div class="input-group-icon">
                                <input 
                                    type="password" 
                                    class="form-control" 
                                    id="password" 
                                    name="password" 
                                    placeholder="请输入密码"
                                    required
                                >
                                <i class="bi bi-lock"></i>
                            </div>
                        </div>
                        
                        <!-- 租户代码输入（如果无法从域名识别，则显示） -->
                        <div class="form-group" id="tenantCodeGroup">
                            <label for="tenantCode" class="form-label">
                                <i class="bi bi-building"></i>
                                租户代码 <span class="text-muted">(可选)</span>
                            </label>
                            <div class="input-group-icon">
                                <input 
                                    type="text" 
                                    class="form-control" 
                                    id="tenantCode" 
                                    name="tenantCode" 
                                    placeholder="如：TEST001"
                                    pattern="[A-Z0-9]+"
                                    title="请输入租户代码（如：TEST001）"
                                >
                                <i class="bi bi-building"></i>
                            </div>
                            <small class="form-text">
                                如果通过域名访问（如：test001.his.example.com），系统会自动识别租户
                            </small>
                        </div>
                        
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">
                                记住我
                            </label>
                        </div>
                        
                        <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>
                        <div id="tenantInfo" class="tenant-info d-none">
                            <i class="bi bi-building"></i>
                            <span id="tenantInfoText"></span>
                        </div>
                        
                        <button type="submit" class="btn btn-login">
                            <span class="btn-text">
                                <i class="bi bi-box-arrow-in-right"></i> 登录
                            </span>
                        </button>
                        
                        <div class="forgot-password">
                            <a href="#">忘记密码？</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 应用主JS（包含ApiClient，必须在api.js之前加载） -->
    <script src="/js/app.js"></script>
    <!-- 公共组件（必须在错误处理组件之前加载） -->
    <script src="/js/components.js"></script>
    <!-- 错误处理组件 -->
    <script src="/js/error-handler.js"></script>
    <!-- API客户端 -->
    <script src="/js/api.js"></script>
    <!-- 验证API对象是否已加载 -->
    <script>
        // 检查关键对象是否已加载
        if (typeof window.api === 'undefined') {
            console.error('错误: api对象未定义！请检查app.js是否正确加载。');
        }
        if (typeof window.ErrorHandler === 'undefined') {
            console.warn('警告: ErrorHandler未定义！');
        }
    </script>
    <!-- 登录脚本 -->
    <script>
        /**
         * 获取租户代码
         * 优先级：1. 从域名提取 2. 从输入框获取
         */
        function getTenantCode() {
            // 方式1：从域名提取（如：test001.his.example.com -> TEST001）
            const hostname = window.location.hostname;
            const parts = hostname.split('.');
            if (parts.length >= 3 && parts[1] === 'his') {
                // 子域名格式，提取第一部分并转换为大写
                const code = parts[0].toUpperCase();
                return code;
            }
            
            // 方式2：从输入框获取
            const tenantCodeInput = document.getElementById('tenantCode');
            if (tenantCodeInput && tenantCodeInput.value) {
                return tenantCodeInput.value.trim().toUpperCase();
            }
            
            return null;
        }
        
        // 检查是否已登录
        const token = localStorage.getItem('his_token');
        if (token) {
            window.location.href = '/index.html';
        }
        
        // 从后端加载项目名称
        async function loadProjectName() {
            try {
                const response = await fetch('/api');
                if (response.ok) {
                    const data = await response.json();
                    if (data.code === 200 && data.data && data.data.project_name) {
                        const projectNameEl = document.getElementById('project-name');
                        if (projectNameEl) {
                            projectNameEl.textContent = data.data.project_name;
                        }
                        // 更新页面标题
                        document.title = `登录 - ${data.data.project_name}`;
                    }
                }
            } catch (error) {
                console.warn('加载项目名称失败，使用默认值:', error);
            }
        }

        // 页面加载时自动检测域名和加载项目名称
        document.addEventListener('DOMContentLoaded', function() {
            // 加载项目名称
            loadProjectName();
            
            const hostname = window.location.hostname;
            const parts = hostname.split('.');
            
            // 如果从域名提取到租户代码，隐藏租户代码输入框并显示租户信息
            if (parts.length >= 3 && parts[1] === 'his') {
                const tenantCode = parts[0].toUpperCase();
                const tenantCodeGroup = document.getElementById('tenantCodeGroup');
                const tenantInfo = document.getElementById('tenantInfo');
                const tenantInfoText = document.getElementById('tenantInfoText');
                
                if (tenantCodeGroup) {
                    tenantCodeGroup.style.display = 'none';
                }
                
                if (tenantInfo && tenantInfoText) {
                    tenantInfoText.textContent = `当前租户: ${tenantCode}`;
                    tenantInfo.classList.remove('d-none');
                }
            }
        });

        // 登录表单提交
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const btnText = submitBtn.querySelector('.btn-text');
            const originalText = btnText.innerHTML;
            
            // 隐藏错误信息
            errorDiv.classList.add('d-none');
            
            // 显示加载状态
            submitBtn.disabled = true;
            btnText.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>登录中...';
            
            try {
                // 获取租户代码
                const tenantCode = getTenantCode();
                
                // 构建登录请求
                const loginData = {
                    username: username,
                    password: password
                };
                
                // 如果获取到租户代码，添加到请求中
                if (tenantCode) {
                    loginData.tenant_code = tenantCode;
                }
                
                // 调用登录API
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(loginData)
                });
                
                const data = await response.json();
                
                if (response.ok && data.code === 200) {
                    const result = data.data;
                    
                    // 检查是否需要选择租户
                    if (result.requires_tenant_selection && result.tenants) {
                        // 保存临时 token，供切换租户接口鉴权使用
                        if (result.temp_token) {
                            localStorage.setItem('temp_token', result.temp_token);
                        }
                        // 需要选择租户，跳转到租户选择页面（同时把临时 token 带入 URL，避免缓存导致 localStorage 未写入）
                        const tenantsParam = encodeURIComponent(JSON.stringify(result.tenants));
                        const userParam = result.user_id;
                        const tokenParam = result.temp_token ? `&temp_token=${encodeURIComponent(result.temp_token)}` : '';
                        window.location.href = `/views/auth/tenant-select.html?tenants=${tenantsParam}&user_id=${userParam}${tokenParam}`;
                        return;
                    }
                    
                    // 登录成功，保存token和用户信息
                    // 保存access_token
                    if (result.access_token) {
                        localStorage.setItem('his_token', result.access_token);
                    }
                    
                    // 保存refresh_token
                    if (result.refresh_token) {
                        localStorage.setItem('his_refresh_token', result.refresh_token);
                    }
                    
                    // 保存用户信息
                    if (result.user) {
                        localStorage.setItem('his_user', JSON.stringify(result.user));
                    }
                    
                    // 跳转到主页
                    window.location.href = '/index.html';
                } else {
                    // 显示错误信息
                    errorDiv.textContent = data.message || '登录失败，请检查用户名和密码';
                    errorDiv.classList.remove('d-none');
                }
            } catch (error) {
                console.error('登录错误:', error);
                errorDiv.textContent = '网络错误，请稍后重试';
                errorDiv.classList.remove('d-none');
            } finally {
                // 恢复按钮状态
                submitBtn.disabled = false;
                btnText.innerHTML = originalText;
            }
        });
    </script>
</body>
</html>
